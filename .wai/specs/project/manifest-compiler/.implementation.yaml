id: manifest_compiler_impl
name: Manifest Compiler Implementation
description: >-
  Pure functions over the authored model. No clock, no disk, no network — which is what makes every
  refusal testable from a literal and every compilation testable without a build.
contract: imanifest-compiler
sourcePath: sdk/cli/src/project/manifest_compiler.rs
methods:
  - name: validateAuthored
    narrative:
      - stepNumber: 1
        description: >-
          Start an empty violation list. Every check below APPENDS; none returns early. Fixing a
          manifest one refused field per build is how a five-minute correction becomes an afternoon.
        type: local
      - stepNumber: 2
        description: >-
          The fqid must be non-empty and must contain a dot. It is the registry namespace, the
          install key and the seed of the deterministic package uuid, so a malformed one is wrong in
          three places at once and none of them says so.
        type: local
      - stepNumber: 3
        description: >-
          The version must parse as SemVer. The registry parses it too, and a version it cannot
          order is one the resolver cannot answer a range with.
        type: local
      - stepNumber: 4
        description: Was a core compatibility range declared?
        type: branch
        condition: authored.coreCompatibility is present and non-blank
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          It must parse as a SemVer REQUIREMENT, not as a version. `^0.1` is the shape; `0.1` is a
          narrower one that still parses; a string that parses as neither installs unchecked while
          looking declared, which is the worst of the three outcomes.
        type: local
      - stepNumber: 6
        label: artifact-names
        description: >-
          Collect the set of names the declared artifacts take inside the bundle — the explicit
          `name`, or the file name of the declared path. Every cross-reference below resolves
          against this set.
        type: local
      - stepNumber: 7
        description: For each declared capability.
        type: loop
        loopKind: forEach
        over: authored.capabilities
        endStep: 8
      - stepNumber: 8
        label: cap-check
        description: >-
          It must name an artifact in the set, and a RuntimePrimitive must carry a symbol. The
          registry's bundle reader aligns declared artifacts to zip entries strictly in BOTH
          directions, so a capability pointing at nothing is refused there too — with a message
          about a zip entry rather than about the field the developer wrote.
        type: local
      - stepNumber: 9
        description: For each declared UI plugin.
        type: loop
        loopKind: forEach
        over: authored.uiPlugins
        endStep: 10
      - stepNumber: 10
        label: ui-check
        description: >-
          It must name an artifact in the set whose kind is UiBundle. The slot is NOT checked
          against any list of region names: a packer has no business knowing the frontend's regions,
          and coupling it to that list makes every new region a change here.
        type: local
      - stepNumber: 11
        description: For each declared artifact.
        type: loop
        loopKind: forEach
        over: authored.artifacts
        endStep: 12
      - stepNumber: 12
        label: artifact-check
        description: >-
          The kind must be Dll or UiBundle, its path must be non-empty and relative, and a Dll must
          declare an entry point — a process host with no symbol to call loads a module that does
          nothing and reports success. A path that escapes the project directory is refused: a
          bundle assembled from files outside the project is one nobody can reproduce from the
          repository.
        type: local
      - stepNumber: 13
        description: For each declared dependency.
        type: loop
        loopKind: forEach
        over: authored.dependencies
        endStep: 14
      - stepNumber: 14
        label: dep-check
        description: >-
          The fqid must be non-empty and the version must parse as a REQUIREMENT. A pin where a
          range belongs makes every upstream patch a republish here; a string that parses as neither
          becomes a dependency the registry's resolver cannot satisfy and cannot explain.
        type: local
      - stepNumber: 15
        description: For each declared middleware.
        type: loop
        loopKind: forEach
        over: authored.middleware
        endStep: 16
      - stepNumber: 16
        description: >-
          The id and handler must be non-empty, and the scope must pass CORE'S
          `MiddlewareScope::validate()` — called, never reimplemented.


          THE HANDLER IS THE ADDRESS THE INTERCEPTOR IS CALLED AT. A declaration without one
          registers, lists and intercepts nothing — the inert-declaration shape — and the host has
          nothing to invoke. It is NOT checked against the declared capabilities: a package's
          BUS-served capabilities are served by its handler and never appear in that list, so the
          check would refuse the ordinary case.


          THE SCOPE CHECK IS CORE'S ONE FUNCTION, so a package this tool packs is a package the node
          will register. It refuses a block that narrows nothing without saying `everything: true`,
          which is the broadest scope wearing the emptiest shape.


          `kind` AND `required` NEED NO CHECK HERE. `kind` is core's enum, so a misspelling already
          failed the parse, naming the field; `required` is a bool.


          WHAT THIS STEP NO LONGER REFUSES, AND WHY. It used to refuse `syw.owner`, `syw.fqid` and
          `target` inside a free-form `filters` bag, and before that `source`. The typed scope
          removed the bag, and the declaration now refuses UNKNOWN KEYS at parse — so a host-stamped
          `owner`, `ownerFqid` or `consentDigest`, and the retired `filters` and `target`, are parse
          errors naming the key rather than values this step has to look for.
        type: local
      - stepNumber: 17
        description: Every violation found, in declaration order.
        type: return
        outcome: the complete violation list, empty when the manifest is sound
    detail: full
  - name: compileManifestBody
    narrative:
      - stepNumber: 1
        description: 'Partition the located artifacts by kind: the loadable modules and the UI bundles.'
        type: local
      - stepNumber: 2
        description: Did the build produce a loadable module?
        type: branch
        condition: at least one located artifact has kind Dll
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Hosting mode is DIRECT — the package loads in-process. DERIVED, never declared: it is a
          fact about what was built, and the previous tool let a project claim a mode its artifacts
          could not support.
        type: local
      - stepNumber: 4
        description: Continue to the capability declarations.
        type: jump
        toStep: 6
      - stepNumber: 5
        label: hosted
        description: >-
          Hosting mode is HOSTED. A package shipping only a UI bundle stays HOSTED and starts
          nothing, because a UI bundle is loaded by the frontend and not by a process host.
        type: local
      - stepNumber: 6
        label: capabilities
        description: >-
          Build the capability declarations, resolving each one's named artifact into an artifact
          reference. A RuntimePrimitive carries its node descriptor — the C symbol and the
          `wf_prim_v1` ffi signature — and its inputs IN DECLARATION ORDER, because that order is
          the calling contract and an empty list means UNDECLARED rather than zero parameters.
        type: local
      - stepNumber: 7
        description: >-
          Build the ui plugin declarations the same way, each pointing at its UiBundle artifact and
          carrying the package's own version. A plugin numbered separately from the package it ships
          inside is a second thing to keep in step for no gain.
        type: local
      - stepNumber: 8
        description: >-
          Assemble the body: fqid, version, hosting mode, the authored permission groups and
          fast-lane requests passed through as written, the dependencies, the capabilities, the ui
          plugins, the MIDDLEWARE, and enabled true.


          THE MIDDLEWARE LIST WAS A LITERAL `[]` UNTIL NOW. Not a default with no authored source —
          an empty array written unconditionally, so no bundle could declare an interceptor whatever
          its author wrote. It is the third instance of that hole, after dependencies and ui
          plugins, and core's consumer side was complete the whole time.


          EACH MIDDLEWARE IS WRITTEN IN CORE'S SPELLING, field by field: `id`, `handler`,
          `needs_payload`, `needs_headers`, `required`, `kind`, the scope serialized by core's own
          type, and `priority` only when declared. `required` AND `kind` ARE WRITTEN EVEN AT THEIR
          DEFAULTS, for the reason the dependency flag is.


          EACH DEPENDENCY CARRIES ITS OPTIONAL FLAG, WRITTEN EVEN WHEN FALSE. Core defaults an
          absent flag to required, so omitting it would carry the same meaning — but a reader could
          not then tell "this author considered it and chose required" from "this manifest predates
          the field", which is the distinction the flag exists to make.


          RUNTIME-MANAGED FIELDS ARE OMITTED, not emitted empty. Identity, approved group ids and
          fast-lane grants are minted by a node; writing them blank would make a bundle that
          declares nothing indistinguishable from one whose author wrote an empty value, and core's
          own warnings depend on telling those apart. A middleware declaration's host-stamped
          `owner`, `owner_fqid` and `consent_digest` are the same kind of field: never written here,
          and refused at parse when an author writes them.


          THE ARTIFACTS ARRAY IS LEFT ABSENT. Its hashes are facts about bytes the writer has not
          written yet.
        type: local
      - stepNumber: 9
        description: Was a core compatibility range declared?
        type: branch
        condition: authored.coreCompatibility is present and non-blank
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Set the field. Emitted ONLY when declared — absent must stay absent so core's warning
          tells the truth about which case it is looking at.
        type: local
      - stepNumber: 11
        label: done
        description: The compiled manifest body, complete but for the artifacts array.
        type: return
        outcome: the /.manifest declarations
    detail: full
  - name: packageUuidFor
    narrative:
      - stepNumber: 1
        description: >-
          Build the seed string `waffler.package:<fqid>` — the runtime's own spelling, byte for
          byte. The prefix is part of the input, so a uuid computed over the bare fqid is a
          different uuid that looks equally plausible.
        type: local
      - stepNumber: 2
        description: >-
          Compute UUIDv5 over the OID namespace with those bytes.


          COPIED FROM THE RUNTIME RATHER THAN INVENTED. The ingested package entity, the
          install-call uuid and the `/namespace/<uuid>.json` segment must all agree; three places
          computing it three ways is three chances to disagree with nothing able to notice, because
          each one is internally consistent.
        type: local
      - stepNumber: 3
        description: The uuid, hyphenated.
        type: return
        outcome: the deterministic package uuid
    detail: full
    intent: >-
      UUIDv5 over the OID namespace of the bytes `waffler.package:<fqid>`.


      The formula is the runtime's own, and copying it here rather than inventing one is the entire
      point: the ingested entity, the install-call uuid and the `/namespace/<uuid>.json` segment
      must agree, and three places computing it three ways is three chances to disagree with no way
      to notice.
