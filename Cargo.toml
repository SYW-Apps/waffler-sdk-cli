[package]
name = "waffler-cli"
version = "0.2.0"
edition = "2021"
description = "Waffler Package Developer SDK — build, pack, scaffold, and publish Waffler packages"
authors = ["SYW Apps"]

# TWO TARGETS, AND THE LIBRARY IS NOT AN AFTERTHOUGHT.
#
# The docker image build is expected to pack bundles by calling this crate rather than by shelling
# out to an installed `waffler` binary, which is why every portal method is reachable without a
# process. A check implemented in a command handler is a check the library path silently skips —
# so the binary is a thin argument layer over the same functions the library exposes.
[lib]
name = "waffler_cli"
path = "src/lib.rs"

[[bin]]
name = "waffler"
path = "src/main.rs"

# STANDALONE CRATE, detached from any parent workspace.
#
# Without this empty table `cargo` inside the superproject checkout refuses to build at all —
# "current package believes it's in a workspace when it's not" — because the root Cargo.toml lists
# this path in neither `members` nor `exclude`. The registry carries the same table for the same
# reason, as does every package. A developer tool that cannot be built from the tree it ships in is
# a tool nobody runs, which is most of how this one drifted four months without anyone noticing.
[workspace]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "color", "env"] }
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP. `stream` is load-bearing: a bundle may be a hundred megabytes and the upload streams from
# the file rather than buffering it, because the registry's own size limit is applied to the body
# before it is buffered and a client that buffers first has already paid what that limit avoids.
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }
# `ReaderStream`, one line, so an upload streams from the file instead of being read whole.
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Interactive terminal
console = "0.15"

# File system
zip = "2"
walkdir = "2"

# Hashing / encoding / entropy
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
open = "5"

# The deterministic package uuid: v5 over the OID namespace, the runtime's own formula.
uuid = { version = "1", features = ["v5"] }

# Version REQUIREMENTS, not just versions. A dependency declares a range the registry resolves.
semver = "1"

# Self-update
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Platform dirs
dirs = "5"

[dev-dependencies]
tempfile = "3"
