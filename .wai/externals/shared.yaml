    name: EntrySignature
    kind: value-object
    fields:
      - name: params
        type: list<entry-param>
        description: 'Blueprint: inputs-map field shape; Subroutine: ordered positional params.'
      - name: output
        type: type-ref
        description: Declared return type (None = no value).
        optional: true
  - id: bus-handle
    name: BusHandle
    kind: value-object
    fields:
      - name: service
        type: string
        description: The owning service/package name this bus handle is stamped with (its bus identity).
      - name: id
        type: string
        description: The opaque handle id issued at attach.
  - id: rule-pattern
    name: RulePattern
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          The variant tag — Bus | Filesystem | Network | Process | Device | Console | Secret |
          External. It selects the EVALUATOR and its target grammar, and a rule never answers about
          a class that is not its own.
      - name: target_kind
        type: string
        description: Bus only — Command | Event | Any.
        optional: true
      - name: target
        type: string
        description: >-
          The scope, in the grammar the kind selects, for every class whose target is an opaque or
          semi-structured NAME. Bus — a glob over the addressed SERVICE id (Command) or the full
          event topic string (Event); the COMMAND is named by verb/verbs, not here. Network — a host
          or host:port glob (a host-only pattern grants any port). Process — a command or
          environment-variable-name glob. Device — a glob over the COMPOSED `<class>:<endpoint>`
          name; an ALLOW that leaves the class axis unauthored grants nothing. Console — one of the
          run's standard streams (in | out | err) or a glob over them; unlike Device the blanket `*`
          IS a real grant, because the namespace is closed at three and can be enumerated by whoever
          writes it. Absent means the rule constrains no target.
        optional: true
      - name: path
        type: string
        description: Filesystem only — host-glob path.
        optional: true
      - name: verbs
        type: list<fs-verb>
        description: >-
          Filesystem — a subset of FsVerb. Bus — a set of COMMAND names, so one rule can cover a
          whole command set. Absent means the rule covers every verb of what it names.
        optional: true
      - name: flags
        type: list<string>
        description: Filesystem only — subset of FsFlag (recursive/force/follow_symlinks/include_hidden).
        optional: true
      - name: class_pattern
        type: string
        description: Secret only — class-FQID glob (optional match dimension).
        optional: true
      - name: assignable_to
        type: string
        description: Secret only — a base-class UUID (classes:is_assignable match).
        optional: true
      - name: secret_uuid
        type: string
        description: Secret only — a specific secret UUID.
        optional: true
      - name: verb
        type: string
        description: >-
          Secret — read | unwrap | list | write | delete | invoke_method. Bus — a single COMMAND
          name. Absent means the rule covers every verb of what it names. `invoke_method` (running a
          method on a stored secret-class instance) is a distinct authority from `unwrap`
          (extracting the value): a rule granting one does not grant the other, and every path
          returning plaintext gates on `unwrap`.
        optional: true
      - name: system_id
        type: string
        description: External only — the registered evaluator's system id.
        optional: true
      - name: payload
        type: any
        description: External only — evaluator-defined opaque body.
        optional: true
  - id: subroutine-kind
    name: SubroutineKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: Inline | Isolated | Closure.
  - id: field-type
