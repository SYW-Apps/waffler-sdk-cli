  - id: waffler-crate
    name: WafflerCrate
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: UUID v7 — the crate's identity key.
      - name: crate_type
        type: string
        description: >-
          System | Library. Gates bootability (only System boots) and resolution semantics. A THIRD
          value, `ForeignBridge`, is still accepted by core's is_valid_crate_type
          (waffler_core/src/crates/model.rs) but is CLOSED as redundant and should not be written by
          new code: a crate that wraps an external package is a Library whose `wrapped_package` is
          set, and nothing about bridging needs its own kind — it changes where the implementation
          comes from, not what the crate IS to a dependent. Removing it from the closed set is a
          core change; until then this field's real domain is three values and its intended domain
          is two.
      - name: metadata
        type: map<string, any>
        description: Free-form open extension slot (e.g. compiler-target hints; core never interprets it).
      - name: dependencies
        type: list<crate-dependency>
        description: The DECLARED dependencies (written by add_dependency); not the resolved closure.
      - name: exports
        type: list<string>
        description: >-
          The crate's PUBLIC API surface: the UUIDs of entities
          (classes/types/interfaces/enums/standalone blueprint-functions) it publicly exports for
          external use by dependents. Entities not listed are crate-internal (usable only within
          this crate; still shipped + inspectable as debug info). Absent/empty = no public API. One
          crate = one module; this is its public interface alongside the default entrypoint.
        optional: true
      - name: wrapped_package
        type: any
        description: >-
          Set when this crate wraps an external package: { fqid, version }. Previously described as
          'ForeignBridge crates ONLY' — with that kind closed, this field is what makes a crate a
          wrapper, on a Library like any other. Absent = the crate implements its own exports.
        optional: true
      - name: default_permissions
        type: list<declared-permission-group>
        description: >-
          The DEFAULT permissions for every system booted from this crate — a TEMPLATE, not a
          runtime subject. A crate is the thing a system is booted FROM and the booted system is the
          runtime principal; this is where a crate says what the systems it templates may reach. At
          boot the declaration is instantiated as live firewall rules sourced as THAT system
          (Blueprint{system_uuid}), optionally narrowed by the booting user, and torn down when the
          system stops. Nothing here is a rule about the crate itself — a crate never calls
          anything.


          Empty (the serde default, and what every crate authored before this field decodes as)
          means the systems booted from it get NO instantiated grants. That is fail-closed and it is
          also exactly the status quo: nothing in the tree has ever authored a Blueprint-sourced
          rule, so every booted system already default-denies every native fs/network/process access
          (runtime::security_adapter::native_access_policy always answers Some, and no seeded rule
          names a Blueprint principal). This field is the first thing that can LIFT that, not a new
          restriction being imposed.


          IT STAYS THE LAST FIELD: rmp encodes a struct as a positional ARRAY, so a trailing
          #[serde(default)] field decodes as empty from a .manifest written with one element fewer,
          and the change is additive. Wire slot 6, and the TAIL slot: min arity 6, max 7.


          The element type was named CratePermissionGroup until 2026-10-02; it is
          DeclaredPermissionGroup now, because a package declares the same five-field shape and the
          name said Crate. Wire-neutral — positional msgpack is name-independent.
        optional: true
