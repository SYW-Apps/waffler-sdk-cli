          Include capabilities belonging to INSTALLED-BUT-DISABLED packages. Defaults to FALSE, so
          the ordinary palette hides them.


          DISABLE IS A SAFE TEMPORARY UNINSTALL — the owner's model, and the reason the default is
          exclude. A disabled package is genuinely off: its actor is stopped, its route dropped, its
          middleware deregistered and its security grants suspended. Offering its capabilities as
          though they were placeable would hand an author a node that fails when it runs.
          Re-enabling restores it, which is why the package stays installed and its records,
          approvals and identity are all kept.


          AND IT IS AN OPTION RATHER THAN A HARD RULE because an operator does legitimately want to
          see what a disabled package would offer — before re-enabling it, or while deciding whether
          to. So the filter can ask for them explicitly; it just never does so by accident.


          IT MUST STAY THE LAST FIELD. rmp encodes a struct as a positional ARRAY, so a trailing
          field with a serde default decodes from a request written with one element fewer — which
          is what makes this an additive change that a deployed client keeps working against,
          sending eight elements and getting the safe default. Appending anywhere but the end would
          shift every field after it and break every existing caller.


          IT DOES NOT AFFECT WHAT ALREADY EXISTS IN A BLUEPRINT. This is a filter on a DISCOVERY
          read: it decides what a palette offers, never what a stored blueprint holds or what the
          compiler accepts. A blueprint that already references a disabled package's capability
          keeps its node, its options and its stored references untouched, and the activation path
          deliberately checks the INSTALLED set rather than the enabled one, so disabling something
          does not retroactively invalidate work that referenced it.
