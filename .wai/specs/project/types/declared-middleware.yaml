kind: value-object
id: declared-middleware
name: Declared Middleware
description: >-
  A bus middleware this package contributes: an interceptor core runs around routed calls, with the
  filters deciding which calls it sees.


  WHY IT EXISTS: THIS TOOL COULD NOT AUTHOR ONE. `compileManifestBody` wrote `"middleware": []` as a
  literal and the authored model had no field, so no bundle in existence declares any middleware —
  the third instance of that hole after `dependencies` and `ui_plugins`. Core's consumer side is
  complete: the supervisor walks a package's declarations, owner-tags each one and registers it on
  both the per-package chain and the global bus chain.


  THE FILTERS ARE AN EFFICIENCY DECISION, NOT ONLY A CORRECTNESS ONE. Core assembles the chain
  in-process before dispatching anything: a declaration whose filters do not match a call never
  enters that chain, so it costs no cross-boundary call into this package at all. Declaring the
  narrowest filters that are still correct is therefore how an interceptor avoids being asked about
  traffic it would only wave through — which matters most for the case this was built for, an auth
  middleware that must see the calls needing a validated user and nothing else.
subsystem: project
group: sdk_cli::authored-manifest
fields:
  - name: id
    type: string
    description: >-
      This declaration's identifier, unique within the package. Re-registering the same id REPLACES
      the earlier declaration rather than adding a second.
    optional: false
  - name: target
    type: string
    description: >-
      The SERVICE whose routed calls this intercepts — exact, or a prefix glob ending in `*`. ABSENT
      intercepts every routed call, which is what a node-wide interceptor declares by saying
      nothing.


      TYPED IN CORE RATHER THAN A FILTER KEY, deliberately: it used to be fished out of the
      free-form filters bag, where a misspelled service name produced a middleware that registered,
      listed, and silently intercepted nothing. Writing it here is the only place a target is
      written.
    optional: true
  - name: needs_payload
    type: bool
    description: >-
      Whether the interceptor is handed the call's payload. Defaults to false.


      ASK FOR NOTHING THAT IS NOT READ. A payload the interceptor does not inspect is bytes crossing
      a package boundary on every matched call, and an auth middleware reading only headers has no
      reason to request one.
    optional: true
  - name: needs_headers
    type: bool
    description: >-
      Whether the interceptor is handed the call's headers. Defaults to false. This is the one an
      auth interceptor needs — it is where a bearer token travels.
    optional: true
  - name: filters
    type: json
    description: >-
      The finer matching core understands beside the typed target. The GLOBAL bus chain reads
      `source` / `target` / `topic`; the per-package chain reads `caller` / `capability` / `active`.
      Unknown keys are ignored by both.


      PASSED THROUGH AS AUTHORED. Free-form because core's matcher owns the vocabulary; re-modelling
      it here would create a second definition free to drift from the one that actually filters.


      TWO KEYS MAY NOT BE WRITTEN AND VALIDATION REFUSES THEM: `syw.owner` and `syw.fqid`. Those are
      RUNTIME-MANAGED — the host stamps the declaring package's identity into them at registration —
      so a value written here is overwritten and decides nothing.


      `target` IS ALSO REFUSED, for a different reason: it has its own typed field, and one value in
      two homes is free to disagree with itself.


      `source` IS PERMITTED, AND WAS ONCE REFUSED HERE. It used to carry the owner tag, so an
      authored value was silently discarded — which is why this tool rejected it. The owner tag has
      since moved to the `syw.*` keys and `source` now means what the global chain always read it
      as: an author-declared filter on the envelope's SOURCE. The refusal was correct when written
      and was invalidated by a change elsewhere.
    optional: true
  - name: priority
    type: int
    description: >-
      Where this sits in the assembled chain relative to other packages' interceptors. Absent takes
      core's default.


      IT ORDERS ACROSS PACKAGES, not only within one, so a number chosen against a node's current
      package set is a number that changes meaning when another package is installed.
    optional: true
  - name: handler
    type: string
    description: >-
      The capability in THIS package's own module that the host invokes for each matched envelope.


      IT IS THE ADDRESS THE INTERCEPTOR IS CALLED AT. The legacy ABI passed it directly —
      `host_register_middleware(cap_ptr, cap_len)` — and the migrated declaration lost it, which
      left nothing able to turn a declaration into something callable.


      NOT NAMED `capability`, deliberately. `filters.capability` already exists and means the
      INTERCEPTED capability — which call is being made. One word carrying both meanings in one type
      is the defect that `mode` and `filters.active` were.


      REQUIRED, NOT OPTIONAL. A declaration with no invoker registers, lists, and intercepts nothing
      — the inert-declaration shape. It is free to require today only because no bundle carries a
      middleware declaration yet.


      NOT CROSS-CHECKED AGAINST `capabilities`, and that is deliberate: a package's BUS-served
      capabilities are served by its handler and are not declared in that list at all, so a check
      against it would refuse the ordinary case. A rule that fails the correct shape is worse than
      no rule.
    optional: false
methods: []
