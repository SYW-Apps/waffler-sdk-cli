  - id: fn-handle
    name: FnHandle
    kind: value-object
    fields:
      - name: kind
        type: string
        description: InternalPrimitive | BusCapability | SubBlueprint | MethodCall | Subroutine.
      - name: primitive_id
        type: string
        description: 'InternalPrimitive: stable primitive registry id.'
        optional: true
