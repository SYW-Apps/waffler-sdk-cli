  - id: globals-snapshot
    name: GlobalsSnapshot
    kind: value-object
    fields:
      - name: globals
        type: any
        description: The map of global const name -> baked value.
      - name: host_generation
        type: int
        description: >-
          The host-variable declaration generation this snapshot was taken under — core's monotonic
          counter, advanced on every accepted host-variable schema or value change, published to the
          runtime alongside the values.


          It rides here because this is already the seam the compiler reads globals through, so the
          fingerprint can fold it in without a new edge. Without it a host-variable write would land
          correctly in every store and still never reach a compiled blueprint: the compile
          fingerprint deliberately excludes baked globals, so nothing would mark the artifact stale,
          and the administrator would see the old value in effect with no indication why. With it, a
          changed host variable flips the fingerprint and the next activation recompiles — the same
          mechanism, and the same lazily-paid cost, as an edited manifest.


          0 on a node that has never declared a host variable. Trailing + defaulted, so a snapshot
          emitted before this field existed decodes as generation 0.
