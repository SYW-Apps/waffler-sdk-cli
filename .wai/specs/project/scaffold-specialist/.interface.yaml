id: iscaffold-specialist
name: Scaffold Rendering Contract
description: >-
  Rendering a new package project as a set of files, without writing any of them.


  PURE, AND THE PURITY IS WHAT MAKES IT TESTABLE AGAINST `pack`. A rendered project can be handed
  straight to the manifest compiler in a test and refused there if it is wrong, which is the only
  way a scaffold's claim about the current format stays true.
component: scaffold-specialist
methods:
  - name: renderProject
    description: >-
      Render a complete package project: `waffler.json`, a Cargo crate wired to the Rust SDK, and a
      capability that answers.


      WHAT IT GENERATES MUST ANSWER, NOT MERELY LOAD. The generated package serves one capability
      that echoes its input along with its own fqid and version, because 'installed' and 'working'
      are different observations and a scaffold whose output can only prove the first teaches a
      developer to stop one step too early.


      IT PINS A CORE CONTRACT RANGE. A bundle declaring none installs UNCHECKED behind a warning
      nobody reads; a scaffold is the one place where the right declaration costs the developer
      nothing.
    signature: >-
      renderProject(fqid: string, version: string, description: string, sdkPath: string):
      RenderedFile[]
    returns: json[]
    params:
      - name: fqid
        type: string
        description: The new package's fully-qualified id.
      - name: version
        type: string
        description: Its starting version.
      - name: description
        type: string
        description: Catalog prose.
      - name: sdkPath
        type: string
        description: >-
          Where the Waffler SDK crates live, relative to the generated project or absolute.


          A PARAMETER BECAUSE THE SDK IS NOT PUBLISHED TO A PACKAGE REGISTRY. A generated crate has
          to point its dependencies somewhere real, and a scaffold emitting a line that points
          nowhere would generate a project that cannot build — the exact failure this component
          exists to prevent, moved from the manifest into the crate manifest. Found by implementing
          it: the shape looked complete until there was a dependency line to write.
    guarantees:
      - idempotent
status: draft
