        optional: true
      - name: height
        type: int
        optional: true
      - name: multiline
        type: bool
        optional: true
      - name: style
        type: field-style
        optional: true
      - name: inherited_from
        type: string
        optional: true
      - name: entity_config
        type: entity-config
        optional: true
  - id: field-constraints
