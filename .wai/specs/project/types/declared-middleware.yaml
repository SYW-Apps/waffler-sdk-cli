kind: value-object
id: declared-middleware
name: Declared Middleware
description: >-
  A bus middleware this package contributes: an interceptor core runs around routed calls, with a
  typed SCOPE deciding which calls it sees.


  WHY IT EXISTS: THIS TOOL COULD NOT AUTHOR ONE. `compileManifestBody` wrote `"middleware": []` as a
  literal and the authored model had no field, so no bundle in existence declares any middleware —
  the third instance of that hole after `dependencies` and `ui_plugins`. Core's consumer side was
  complete the whole time.


  THE SCOPE IS CORE'S OWN TYPE, EMBEDDED, NOT RE-MODELLED HERE. A free-form filter bag produced FOUR
  defects in core — a key that was an owner tag to one matcher and a filter to another, a dimension
  one matcher honoured and the other ignored, one side globbing where the other compared with `==`,
  and a disable that disabled on one chain only. **A free-form bag has no arity, so nothing can
  disagree loudly.** Re-modelling the typed replacement in this crate would rebuild exactly that:
  two definitions of one matcher, free to drift, with the authoring side never the one that runs.


  SO THE SCOPE'S FIELDS ARE snake_case WHILE THE REST OF THIS FILE IS camelCase, deliberately, and
  that visible seam is the cheaper cost. The alternative is a mapping layer between two shapes — and
  a mapping layer is exactly what silently dropped `needs_payload` from this tool's own output one
  change earlier.


  VALIDATION IS CORE'S `MiddlewareScope::validate()`, CALLED, NEVER REIMPLEMENTED. One computation
  for three consumers: the node refuses registration on it, this tool refuses a pack on it, and a
  review surface describes the scope from the same answer. Two copies would be two chances for a
  package to be packable and unregisterable.


  AN UNKNOWN KEY IS REFUSED BY NAME, NOT IGNORED. On a declaration that decides what an interceptor
  sees, a key that silently does nothing changes behaviour without a word: `needsHeader` for
  `needsHeaders` delivers no bearer token to an auth layer, and a host-stamped `owner`, `ownerFqid`
  or `consentDigest` written by an author looks like identity or consent the package gave itself.
  The node overwrites those three unconditionally, so the honest outcome of writing one is a parse
  error naming it — and the same refusal covers the retired `filters` bag and `target`, which the
  typed scope replaced. The scope types already refuse unknown keys this way; this makes the
  declaration around them agree.
subsystem: project
group: sdk_cli::authored-manifest
fields:
  - name: id
    type: string
    description: >-
      This declaration's identifier, unique within the package. Re-registering the same id REPLACES
      the earlier declaration rather than adding a second.
    optional: false
  - name: handler
    type: string
    description: >-
      The capability in THIS package's own module that the host invokes for each matched envelope.


      IT IS THE ADDRESS THE INTERCEPTOR IS CALLED AT. The legacy ABI passed it directly —
      `host_register_middleware(cap_ptr, cap_len)` — and the migrated declaration lost it, which
      left nothing able to turn a declaration into something callable.


      NOT NAMED `capability`: the scope's `capabilities` dimension already means the INTERCEPTED
      capability — which call is being made. One word carrying both meanings in one type is the
      defect that `mode` and `filters.active` were.


      NOT CROSS-CHECKED AGAINST `capabilities`. A package's BUS-served capabilities are served by
      its handler and never appear in that list, so a check against it would refuse the ordinary
      case — and a rule that fails the correct shape is worse than no rule.
    optional: false
  - name: scope
    type: '::shared::middleware-scope'
    description: >-
      What this interceptor sees: a `commands` block, an `events` block, header predicates, and an
      active toggle. CORE'S TYPE, embedded rather than mirrored.


      COMMANDS AND EVENTS ARE SEPARATE BLOCKS, and that is a security property made structural
      rather than documented. Knowing which events a service listens to is enough to manipulate that
      service, so event interception must be deliberate — it can never be acquired by leaving a
      topic list empty inside a command block. An absent block means the interceptor never sees that
      kind of traffic at all.


      NOTHING IS ACQUIRED BY OMISSION. A present block that narrows nothing and does not say
      `everything: true` is REFUSED, at pack and again at the node. That answers the rendering trap
      at the type level instead of in a renderer: the broadest scope can no longer be the
      emptiest-looking declaration, because the emptiest-looking declaration does not register.


      AN EXCLUSION ALONE IS NOT A NARROWING. "Everything except db" still reaches every service
      anyone adds tomorrow; only naming what you DO reach is a list that stops growing on its own.
    optional: false
  - name: needs_payload
    type: bool
    description: >-
      Whether the interceptor is handed the call's payload. Defaults to false.


      ASK FOR NOTHING THAT IS NOT READ. A payload the interceptor does not inspect is bytes crossing
      a package boundary on every matched call, and an auth middleware reading only headers has no
      reason to request one.
    optional: true
  - name: needs_headers
    type: bool
    description: >-
      Whether the interceptor is handed the call's headers. Defaults to false. This is the one an
      auth interceptor needs — it is where a bearer token travels.
    optional: true
  - name: priority
    type: int
    description: >-
      Where this sits in the assembled chain relative to other packages' interceptors. Absent takes
      core's default.


      IT ORDERS ACROSS PACKAGES, not only within one, so a number chosen against a node's current
      package set is a number that changes meaning when another package is installed.
    optional: true
  - name: required
    type: bool
    description: >-
      Can the PACKAGE run without this interceptor registering? Absent means REQUIRED — core's own
      default, and the fail-safe reading of a declaration nobody considered.


      IT DECIDES THE COST OF A DENIAL, NOT THE SCOPE OF CONSENT. Denied or unreviewed and required
      refuses the package's enable; optional skips this layer and reports it. That is why core
      leaves it out of the consent digest: moving from optional to required takes away an operator's
      option to refuse without losing the package, and widens nothing that is intercepted.


      ALWAYS WRITTEN INTO THE MANIFEST, resolved to its default when the author said nothing — the
      same rule as a dependency's `optional` flag, so a manifest from this tool can be told apart
      from one that predates the field.
    optional: true
  - name: kind
    type: '::shared::middleware-kind'
    description: >-
      May this interceptor's VERDICT stop or alter a message? CORE'S ENUM, embedded exactly as the
      scope is: `Enforcing` (the default) or `Observing`.


      SPELLED EXACTLY, AND A MISSPELLING IS A PARSE ERROR. `"observing"` quietly read as the default
      would be an audit layer an operator believes only watches that can in fact reject. An enum
      makes that unrepresentable instead of checkable.


      OBSERVING IS A WITNESS: it sees what its scope admits and can neither reject nor patch,
      whatever it answers. FOLDED INTO THE CONSENT DIGEST with the scope, so a package moving a
      declaration from Observing to Enforcing re-presents it for review rather than inheriting
      consent given to a witness.


      ALWAYS WRITTEN, resolved, like `required`.
    optional: true
methods: []
