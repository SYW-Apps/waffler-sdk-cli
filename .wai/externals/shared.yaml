  - id: value
    name: Value
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          null|bool|int|float|string|char|bytes|object|array|class_instance|error|promise|secret|connection|native|function.
      - name: data
        type: >-
          bool | i64 | f64 | char | string | bytes-buffer | map<string,value> | vec<value> |
          class-instance | promise | native-handle
        description: >-
          The underlying value payload as a typed union over the variant payloads — primitive
          scalars inline (char as a Unicode codepoint u32); kind=bytes as a bytes-buffer (ONE
          contiguous refcounted byte block, NOT a Vec of child values — see bytes-buffer for why
          that distinction is the whole point); anonymous object/array shapes as a MAP or VEC OF
          `value` CHILDREN (Stage 3 — NOT Json: a child is a whole Value and therefore carries its
          own side-channels, which is the entire point); language-primitive class instances (incl
          Error/Secret/Connection and user instances) as class-instance; a Fork result as promise; a
          package-owned native resource as native-handle. (null = no payload.) Composite payloads
          are refcounted + copy-on-write, so an owned copy is a refcount bump — and a bytes-buffer
          is refcounted on the same terms, so passing a megabyte payload between frames copies a
          pointer.
        optional: true
      - name: class_uuid
        type: string
        description: 'For class instances / Error: the resolved class_uuid (trap-match key).'
        optional: true
      - name: native_handle
        type: native-handle
        description: >-
          For kind=native: the opaque handle to a package-owned native resource
          (tensor/model/buffer); data is unused.
        optional: true
      - name: sensitivity
        type: sensitivity
        description: Taint (Sensitive|Secret), propagated + redacted.
        optional: true
      - name: heap_ref
        type: heap-handle
        description: >-
          SHARED (reference) class instances only: the opaque generational HeapHandle addressing
          this instance's cell in the per-run object heap. PRESENT => this is a SHARED instance
          (data is None; the field state lives in the heap cell; reference semantics + identity).
          ABSENT (the common case) => an OWNED/inline value (state in data, or a
          primitive/Error/native). Never crosses a serialization boundary (snapshotted to the
          instance value there).
        optional: true
      - name: fn_handle
        type: fn-handle
        description: >-
          kind=function only: the invokable pre-bound call target this first-class function value
          carries (Stage 1: a receiver-less SubBlueprint reference; data carries the compile-baked
          (inputs, output) callback contract). NEVER serialized — at a wire boundary the value emits
          only a stable descriptor string in data, and a deserialized function value is INERT
          (fn_handle=None). The payload side-channel convention mirrors native_handle/heap_ref.
        optional: true
      - name: bound_recv
        type: value
        description: >-
          N-2 (bound-method callbacks): the IN-MEMORY bound receiver of a kind=function value —
          present ONLY on a value produced by the BindReceiver opcode (a SHARED, heap-backed class
          instance; binding to an owned/inline instance is rejected — a handler must see LIVE state,
          a copy would lie). NEVER serialized (the wire descriptor stays inert; a deserialized
          function value has no receiver); nesting in a composite is LEGAL as of Stage 3 (the
          composite-nesting rule is repealed — a child is a whole Value, so a bound method survives
          being stored in a map, and only the wire projection inerts it). EQUALITY: two bindings of
          the same method to different instances are DISTINCT — function equality is same kind +
          fn_handle + the receivers' identity (their heap_ref cells). Invoke of a has_self handle
          REQUIRES bound_recv (threaded as self_recv through the existing dispatch); has_self
          WITHOUT a receiver stays the trap. The FFI callback registry stores the receiver's
          HeapHandle in the registration cell (the per-run arena keeps the cell exactly as long as
          registrations can fire); submit_external re-resolves it at fire time — a stale cell
          rejects cleanly. The $wf_callback descriptor is unchanged: the receiver NEVER crosses the
          FFI.
        optional: true
      - name: captured_env
        type: closure-binding
        description: >-
          Stage 2 (lambda-lifted inline closures): the CLOSURE BINDING of a kind=function value
          whose target is a Closure-kind Subroutine — its resolved owner PROGRAM paired with its
          captured ENVIRONMENT (see closure-binding), created together by LoadFunction because they
          are created at the same instant and are meaningless apart. This is V8's
          (SharedFunctionInfo, Context), CPython's (func_code, func_closure), Lua's (Proto,
          upvalues), a CLR Delegate's (_methodPtr, Target). The captures are ORDERED to match the
          handle's capture_slots positionally (no name lookup at runtime; the names live in the
          compiler and in slot_names for debug). Produced ONLY by a LoadFunction carrying capture
          operands, which resolves the owner program from the frame it is EXECUTING IN — the fiber
          is inside the owner at that instant, so the program needs no index, table or membership
          test, and an ENTRY-owned closure resolves as readily as a member-owned one — and SNAPSHOTS
          each captured slot's Value at closure-creation time. Because a SHARED instance's snapshot
          is its heap_ref HANDLE, capturing one shares the underlying cell (live in-place mutation
          visible both ways) while capturing an OWNED value takes a copy — the existing owned/shared
          discriminant is the whole by-value/by-reference story, so no boxing pass and no new cell
          type are introduced. WHY NOT C#/JS VARIABLE CAPTURE (the question every reader will ask):
          those languages let a closure observe a later assignment by hoisting the captured local
          into a hidden heap box (a display class / environment record) and rewriting the enclosing
          scope's own accesses to go through it. That box cannot be implicit in a TRANSPILED
          language: two of the four value-semantics allocation policies have no heap to hold it
          (StaticOnly = PLC/embedded, Buffer = GPU), and on HeapRefcount a closure fired from a
          FOREIGN THREAD — the entire point of the FFI callback path — forces Arc<Mutex<_>>, making
          the enclosing scope's own reads and writes lock-guarded with genuine deadlock surface.
          Snapshot is the INTERSECTION semantics every target expresses natively (Rust move,
          C#/Swift capture-list temp, JS const binding, C struct-of-captures), so it is a
          portability constraint, not a preference. The user who WANTS shared mutation captures a
          SHARED instance — the one construct that already HAS a per-target allocation policy, so
          the box is explicit in the graph and each target decides what a box is (refcount heap /
          arena / retained static / buffer binding). Explicit box, zero new transpiler concepts. To
          keep the divergence from being a silent surprise the compiler makes it UNWRITEABLE: a
          captured binding is FROZEN from its capture point, and a later write to it is a compile
          error naming both fixes. Every program that compiles therefore behaves identically under
          snapshot and under C#-style promotion — so relaxing that error into auto-promotion later
          could never change an existing program's meaning. A captured value may itself carry ANY
          side-channel — a heap_ref, a native_handle, or another function value with its own
          captured_env (closures nest and their environments chain) — which is exactly why this is a
          DEDICATED channel and not a Json child (the composite-nesting rule). LIFETIME: the
          environment is owned by the function value, so a closure stays invocable after the frame
          that created it is gone — the property the whole trigger->listener reframe rests on. NEVER
          serialized (a deserialized function value is inert AND environment-less, so captured state
          can neither leak nor be forged over a wire) and never crosses a bus / execute_external
          boundary. EQUALITY participates, on the CAPTURES only: two closures over one lambda with
          different captures are DISTINCT (heap-backed captures compare by cell identity, owned
          captures structurally), while the binding's program reference is DERIVED from the
          fn_handle (same handle => same owner) and so adds nothing to identity. The FFI callback
          registry cell holds the whole function value, so heap-backed captures are validated LIVE
          at submission exactly as a bound receiver is — a stale captured cell rejects the
          submission cleanly instead of failing deep inside the fired handler — and the cell
          transitively PINS the owner program for exactly as long as the registration can still fire
          into it.
        optional: true
    methods:
      - name: to_wire
        signature: to_wire() -> Json
        returns: any
        description: >-
          THE BOUNDARY PROJECTION (Stage 3) — the ONLY way a Value becomes bytes. Serialization is a
          language-level feature and a property of a BOUNDARY, never of the value: the in-memory
          tagged union exists for EXECUTION. Called by the seams that genuinely cross something —
          the message bus, persistence, `.compiled` artifact writing, execute_external's boundary
          snapshot, and the FFI callback-descriptor marshal — and by nothing else. Because it is the
          single crossing point, the side-channel rules become STRUCTURAL rather than conventional:
          a handle-bearing (SHARED) instance projects as its stable id, a function value as its
          `fn:<kind>:<target>` descriptor (fn_handle, bound_recv and the closure binding never
          appear), a native handle never appears, and a COMPOSITE projects by recursively projecting
          its children — so a map of closures crosses as a map of inert descriptors and cannot
          smuggle a live reference. BYTE-COMPATIBLE: the emitted shape is exactly the pre-Stage-3
          wire form (kind/data/class_uuid/native_handle/sensitivity, positional on the MsgPack
          lane), so every existing `.compiled` artifact and bus message stays valid. BOUNDED: the
          projection is one of the walks that must not run off the native stack, so it carries its
          nesting depth and REFUSES past MAX_VALUE_DEPTH — through the serializer's own error
          channel, so a bus/persistence/FFI send fails as an ordinary Err at the seam that asked for
          it. The materializing form (which cannot return an Err) surfaces that refusal as a panic
          instead; a panic unwinds and is contained, unlike the stack overflow it replaces.
      - name: from_wire
        signature: 'from_wire(wire: Json) -> value'
        returns: value
        description: >-
          The inverse projection: rebuild an in-memory Value from the wire form, recursively lifting
          composite children into `value` children. Everything that comes back is INERT by
          construction — no fn_handle, no closure binding, no bound receiver, no heap_ref, no native
          handle — because none of them was ever emitted, so an invokable or a live cell reference
          can never be forged off a wire. A function value read back this way traps InvalidFunction
          on Invoke, exactly as before.
      - name: nesting_exceeds
        signature: 'nesting_exceeds(limit: usize) -> bool'
        returns: bool
        description: >-
          THE NESTING CEILING, and the probe that lets a caller refuse politely. A Waffler program
          can nest a value without bound — x = arrayOf(x) in a loop is one instruction per level, so
          neither the step ceiling nor the call-depth ceiling ever sees it (no VM frame is pushed) —
          and EVERY walk over a value costs one NATIVE stack frame per level. A stack overflow is a
          SIGSEGV, not a panic: it does not unwind, catch_unwind cannot contain it, the run-scoped
          panic boundary never runs, and the node dies without diagnostics for a bug in one guest
          program. THE RULE: a value nested past MAX_VALUE_DEPTH (512) is not a value this runtime
          will traverse. Every traversal refuses it — with an error where the signature carries one
          (the wire projection returns a serializer error, so a bus/persistence/FFI send fails
          normally) and with a PANIC where it does not (to_json, structural equality, Debug
          rendering); a panic unwinds, so it is contained and diagnosed, which is the whole
          difference from the SIGSEGV it replaces. This method is the ITERATIVE, early-exiting probe
          a caller WITH an error channel uses so it can refuse with a named trappable error instead
          of meeting that panic; depth is a MAX over all children, so it cannot be answered by
          following one spine. 512 is far past any structure a program legitimately builds — nesting
          accumulates only through OWNED composites, and a SHARED class instance keeps its state in
          a heap cell (data absent), so the lists, trees and graphs a real system builds are DEPTH
          ONE at the value level however many nodes they have — and far short of the stack a
          traversal needs. NOT a VmLimits knob: the step and call-depth ceilings bound a RUN's
          resource use and a legitimate computation can genuinely need more, while this bounds the
          SHAPE OF A VALUE, past which a value stops being expressible rather than expensive
          (serde_json's own parser refuses at 128 levels, so a value near this ceiling cannot be
          read back on the JSON lane at all).
      - name: drop
        signature: drop()
        returns: void
        description: >-
          A DEEPLY NESTED VALUE IS FREED WITH A WORKLIST, NOT WITH THE STACK. Drop is the ONE
          traversal with no error channel even in principle — every other walk can refuse a
          structure it judges too deep; freeing memory cannot — so it is made ITERATIVE rather than
          capped: the children are moved onto an explicit worklist and freed in a loop, O(nodes) in
          time and O(frontier) in space regardless of depth. It also fires with no program action
          beyond letting a value go out of scope, which makes it the one that always eventually
          happens. ONLY WHAT IS OWNED OUTRIGHT IS TAKEN: every child edge is behind a refcount, and
          the drain descends only when it holds the last reference, so a payload another holder is
          still addressing is left alone — freeing something still shared would be the one bug worse
          than the overflow. COST ON THE ORDINARY SHALLOW PATH is three loads and a branch, and NO
          allocation: a scalar returns on the first check; a composite still shared with another
          holder frees nothing so nothing can recurse; a sole-owner composite moves only those
          children that can THEMSELVES nest, so an array of a thousand integers moves nothing and
          allocates nothing. FOUR EDGES carry Value children and all four are drained: the two
          composite payloads, a closure's captured environment (environments CHAIN — a capture may
          itself be a closure), and a bound receiver (included even though a receiver is always
          heap-backed today and so cannot chain: a Drop that stays correct only while an invariant
          enforced in another module holds is a trap for whoever changes that module). CONSEQUENCE
          FOR CALLERS: Value is now a Drop type, so a partial move out of one
          (functional-record-update `Value { field: x, ..base }`, or moving a field out of an owned
          Value) is a compile error — clone-then-overwrite, or borrow.
  - id: vm-limits
    name: VmLimits
    kind: value-object
    fields:
      - name: ceilings
        type: any
        description: Map of LimitKind -> ceiling value.
  - id: waffler-class
