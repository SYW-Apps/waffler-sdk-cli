          stream, so read against the wrong run it would start mid-frame, and because arbitrary
          bytes occasionally decode as a frame the answer would be plausible-looking garbage instead
          of an error. Present even on an empty page: it is where the reader has got to, which is
          exactly what an empty page needs to tell it.
