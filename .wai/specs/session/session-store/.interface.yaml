id: isession-store
name: Session Persistence Contract
description: >-
  The persisted session: a default registry, and one credential per registry.


  IT INTERPRETS NOTHING IT HOLDS. No scope, role or entitlement is read out of a token; what a
  credential may do is the registry's answer. A store that pre-judged authorization would be a
  second opinion about permission, and the one that disagrees silently is always the local one.
component: session-store
methods:
  - name: load
    description: >-
      Read the persisted session from the user's config directory.


      HYDRATION, AND THE ONLY REASON THIS STORE IS DURABLE. A tool that re-prompted for a browser
      login on every command is a tool people script around with a raw token in an environment
      variable — strictly worse than the file this holds.


      AN ABSENT FILE IS AN EMPTY SESSION, NOT AN ERROR. A first run has no credentials and that is
      the ordinary case.
    signature: 'load(): PersistedSession'
    returns: json
    params: []
    effect: read
    invokedBy:
      kind: runtime
      caller: >-
        Process start. The orchestrator hydrates the persisted session before serving any command,
        because every command — including one that only reports which registry it resolved — needs
        the persisted default.
  - name: credentialFor
    description: >-
      The credential held for one normalised registry URL, or none.


      THE KEY IS THE NORMALISED URL, produced by the resolver and by nothing else. A second
      normalisation would let two spellings of one registry hold two credentials and use whichever
      the current command's spelling found.
    signature: 'credentialFor(registry: string): RegistryCredential?'
    returns: sdk_cli::registry-credential
    params:
      - name: registry
        type: string
        description: The normalised registry base URL.
    effect: read
  - name: putCredential
    description: >-
      Persist a credential, replacing any entry already held for that registry.


      WRITTEN OWNER-ONLY AND NEVER INTO A PROJECT TREE. The refresh token is a long-lived secret,
      and a credential file that can be committed eventually is.
    signature: 'putCredential(credential: RegistryCredential): void'
    returns: void
    params:
      - name: credential
        type: sdk_cli::registry-credential
        description: The session to persist.
    guarantees:
      - idempotent
    effect: write
  - name: removeCredential
    description: >-
      Delete the credential for one registry.


      DELETED, NOT BLANKED. A record with cleared fields is indistinguishable from an expired one,
      and the two need different sentences: 'you are not signed in to this registry' versus 'your
      session expired'.
    signature: 'removeCredential(registry: string): void'
    returns: void
    params:
      - name: registry
        type: string
        description: The normalised registry base URL.
    guarantees:
      - idempotent
    effect: write
  - name: defaultRegistry
    description: The persisted `use` default, or none.
    signature: 'defaultRegistry(): string?'
    returns: string
    params: []
    effect: read
  - name: setDefaultRegistry
    description: >-
      Persist the `use` default.


      SETTING IT DOES NOT SIGN ANYONE IN. The default decides which registry a command addresses;
      whether there is a credential for it is a separate fact, and conflating them is how a `use` to
      an unauthenticated registry looks like a working session.
    signature: 'setDefaultRegistry(registry: string): void'
    returns: void
    params:
      - name: registry
        type: string
        description: The normalised registry base URL.
    guarantees:
      - idempotent
    effect: write
status: draft
