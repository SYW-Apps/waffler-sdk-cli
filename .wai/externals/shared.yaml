        type: string
        description: 'SubBlueprint: callee blueprint uuid.'
        optional: true
      - name: entry_index
        type: int
        description: 'Subroutine: entry instruction index in this blueprint.'
        optional: true
      - name: subroutine_kind
        type: subroutine-kind
        description: 'Subroutine: Inline | Isolated.'
        optional: true
      - name: slot_count
        type: int
        description: 'Subroutine(Isolated | Closure): callee frame size.'
        optional: true
      - name: has_self
        type: bool
        description: >-
          SubBlueprint | MethodCall (Phase 2b self-threading): the call threads a RECEIVER instance
          into the callee's reserved self slot (slot 1). When true the Execute's slot_operands are
          [inputs_slot, self_slot, out_slot]; absent/false = a static/free call with no receiver
          ([inputs_slot, out_slot]).
        optional: true
      - name: dispatch_class_uuid
        type: string
        description: >-
          MethodCall (Phase 2b): the statically-resolved class the method name is looked up FROM; at
          the call the receiver's ACTUAL class (its heap-instance class_uuid) overrides it for
          VIRTUAL dispatch via resolve_virtual.
        optional: true
      - name: method_name
        type: string
        description: >-
          MethodCall (Phase 2b): the method name resolved virtually (resolve_virtual) against the
          receiver's actual class to the winning override's blueprint, then dispatched as a
          SubBlueprint frame push.
        optional: true
      - name: fn_params
        type: list<string>
        description: >-
          SubBlueprint | MethodCall (Stage 1.5, fn-param threading): the callee's FUNCTION-TYPED
          parameter names in declaration order. The SELF/OPERAND CONVENTION generalizes:
          slot_operands = [inputs_map_slot, fn_arg_slot_0..fn_arg_slot_N-1 (one per entry, same
          order), self_slot (iff has_self), out_slot]. Function-typed args ride DEDICATED operands.
          THE REASON CHANGED (Stage 3): they exist because the named-args map's children were plain
          Json and structurally could not carry the fn_handle side-channel (the sim-caught inerting
          gap). That limit is GONE — a composite's children are now `value`s carrying their own
          side-channels — so this is now an OPTIMIZATION, deliberately RETAINED: a dedicated operand
          is positional, needing no map build at the call site and no name lookup at frame push.
          Keep it; do not unwind proven machinery merely because its original justification was
          repealed. The fiber seeds them into the callee's reserved fn_param_slots at frame push.
          Dispatch of a non-empty fn_params handle that would route ExecuteExternal traps
          FunctionAcrossBoundary instead (a function value cannot serialize); the compiler already
          rejects cross-crate fn-param calls at resolve time, so the runtime trap is
          defense-in-depth. Defaulted on decode (absent/empty = the prior convention, pre-existing
          .compiled artifacts keep loading).
        optional: true
      - name: owner_blueprint_uuid
        type: string
        description: >-
          Subroutine(Closure) ONLY (Stage 2): the uuid of the blueprint whose instruction vector
          this closure's body was lowered into. A Closure handle rides a first-class function Value
          that ESCAPES the creating frame (stored, passed as a fn-param, or held by the FFI callback
          registry and fired from a foreign thread), so entry_index needs an owner to be meaningful
          at all. This field is that owner's STABLE, SERIALIZABLE identity: it qualifies the wire
          descriptor (so two closures at one entry index in different blueprints never collide), it
          is what the loader validates, and it is what a transpile target maps. It is NOT how a call
          finds the code — the LIVE program is bound at LoadFunction from the executing frame and
          carried in the value's closure-binding, so dispatch performs no lookup of this uuid and no
          membership test. Absent on Inline/Isolated handles (frame-relative as before). DECLARED
          AFTER fn_params, matching the Rust: it was added later, and in a positional-MessagePack
          codebase a new field only ever goes on the END, so pre-Stage-2 .compiled artifacts keep
          loading.
        optional: true
      - name: capture_slots
        type: list<int>
        description: >-
          Subroutine(Closure) ONLY (Stage 2, the CALLEE half of capture): the reserved frame slots
          of this closure's captured environment, in the SAME order as the function Value's
          captured_env, so frame push seeds captured_env[i] -> frame[capture_slots[i]] with no name
          lookup. The self-threading / fn_param_slots convention generalized once more: a captured
          value rides a DEDICATED slot. As with fn_params, THE REASON CHANGED (Stage 3): the slot
          existed because a captured value may carry a side-channel (a heap_ref, a native_handle,
          another closure) that a Json map child structurally could not hold. Composite children are
          `value`s now, so this too is a RETAINED OPTIMIZATION — positional seeding at frame push,
          no name lookup. Assigned by the compiler after the subroutine's positional params; a
          `self` capture binds the closure frame's reserved self slot, so `self.field` / a method
          call inside the lambda works through the existing has_self convention. Absent/empty = a
          capture-free lambda (a plain lifted function). THE LAST FIELD, matching the Rust: appended
          after owner_blueprint_uuid so pre-Stage-2 .compiled artifacts keep loading.
        optional: true
