id: scaffold_specialist_impl
name: Scaffold Specialist Implementation
description: >-
  Renders a project as in-memory files. Writing them is the adapter's job, which is what lets a test
  render a project, hand it to the manifest compiler, and fail if the scaffold's claim about the
  current format has gone stale.
contract: iscaffold-specialist
sourcePath: sdk/cli/src/project/scaffold_specialist.rs
methods:
  - name: renderProject
    narrative:
      - stepNumber: 1
        description: >-
          Derive the crate name from the fqid by replacing dots with underscores, and the module
          file name from it. One derivation, stated once, so the Cargo.toml and the artifact path
          the manifest declares cannot disagree.
        type: local
      - stepNumber: 2
        description: >-
          Render `waffler.json`: the fqid, the version, the description, a pinned core compatibility
          range, and ONE declared artifact of kind Dll whose path is the release output for this
          crate on this platform, with entry point `wf_init`.


          THE RANGE IS PINNED RATHER THAN OMITTED. A bundle declaring none installs UNCHECKED behind
          a warning nobody reads, and a scaffold is the one place where the right declaration costs
          the developer nothing.
        type: local
      - stepNumber: 3
        description: >-
          Render `Cargo.toml`: a cdylib+rlib crate depending on the Rust SDK and the shared types,
          carrying its own empty `[workspace]` table.


          THE EMPTY WORKSPACE TABLE IS LOAD-BEARING. Without it, a crate created inside a checkout
          that lists neither its path in `members` nor in `exclude` refuses to build at all —
          'current package believes it's in a workspace when it's not'. Every package in this tree
          carries it, and a scaffold that omitted it would generate a project that cannot be built
          from the directory it was created in.
        type: local
      - stepNumber: 4
        description: >-
          Render `src/lib.rs`: a handler serving one capability that echoes the payload back along
          with the package's own fqid and version, and an init that returns it.


          IT MUST ANSWER, NOT MERELY LOAD. Returning the caller's own bytes plus this package's
          identity proves the artifact loaded AND is executing — a record-only install would produce
          a row in the package list and nothing else, and a scaffold whose output can only prove the
          first teaches a developer to stop one step too early.


          The reply is MessagePack, because that is what the bus carries and what a caller decodes.
          A fixture whose reply cannot be decoded by the tools that call it cannot be asserted on,
          which is the one thing it exists to allow.
        type: local
      - stepNumber: 5
        description: >-
          Render a README stating the three commands that take this project to a node — build, pack,
          publish — and naming the registry resolution order, so the first question a new developer
          has is answered where they are already looking.
        type: local
      - stepNumber: 6
        description: The rendered file set, relative paths and contents.
        type: return
        outcome: a project that packs, publishes and installs
    detail: full
