name: Auto Tag

on:
  push:
    branches:
      - main

# Skip if this push is itself the version-bump commit (prevents infinite loop)
jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the pushed commit + tag triggers release.yml
          # (commits from GITHUB_TOKEN do not trigger other workflows)
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST"

          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          if [ "$LATEST" = "v0.0.0" ]; then
            MESSAGES=$(git log --pretty=format:"%s" HEAD)
          else
            MESSAGES=$(git log --pretty=format:"%s" "${LATEST}..HEAD")
          fi

          echo "Commits since $LATEST:"
          echo "$MESSAGES"

          if echo "$MESSAGES" | grep -qi "\[major\]"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUMP="major"
          elif echo "$MESSAGES" | grep -qi "\[minor\]"; then
            MINOR=$((MINOR + 1)); PATCH=0; BUMP="minor"
          else
            PATCH=$((PATCH + 1)); BUMP="patch"
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump: $BUMP → $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_ver=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml version
        run: |
          NEW_VER="${{ steps.version.outputs.new_ver }}"
          # Replace the version field in [package] section only
          sed -i "0,/^version = \"[^\"]*\"/{s/^version = \"[^\"]*\"/version = \"${NEW_VER}\"/}" Cargo.toml
          echo "Cargo.toml version is now: $(grep '^version' Cargo.toml | head -1)"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_tag }}"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin main
          git push origin "${{ steps.version.outputs.new_tag }}"
