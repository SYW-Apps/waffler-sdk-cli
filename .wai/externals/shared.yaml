          system starts, and torn down when it stops.


          RESOLVED, not a reference, and that is the point. It is frozen here for the same reason
          boot_args is: this record is what a node restart REPLAYS, and replaying against the
          crate's current manifest would let a crate update silently hand an already-booted system
          permissions its user never saw. A permission set the author changed reaches a system the
          next time somebody boots one, which is when a human is there to look at it.


          Empty means no instantiated grants — what a crate that declares nothing gets, and what
          every .systems/ record persisted before this field decodes as. TRAILING + serde-default:
          the record is positional rmp, so an older one loads unchanged.


          The element type was named CratePermissionGroup until 2026-10-02; it is
          DeclaredPermissionGroup now, because a package declares the same five-field shape.
