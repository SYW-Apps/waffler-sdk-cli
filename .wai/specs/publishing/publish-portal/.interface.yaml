id: ipublish-portal
name: Publish Command Contract
description: >-
  The `pack` and `publish` commands.


  OUTPUT NAMES THE REGISTRY AND THE SHAPE. Every run says which registry it resolved, how it
  resolved it, and whether the artifact carries a publisher signature. Those three facts are what a
  developer needs to know they did what they meant to, and all three were unavailable in the
  previous tool.
component: publish-portal
methods:
  - name: pack
    description: >-
      Build a bundle and stop. No network, no credential, nothing uploaded. A publisher key is
      optional; without one the bundle is unsigned, which is what a registry publish expects.
    signature: >-
      pack(directory: string, outputPath: string, skipBuild: boolean, publisherKeyPath: string?):
      WrittenBundle
    returns: sdk_cli::written-bundle
    params:
      - name: directory
        type: string
        description: The project root.
      - name: outputPath
        type: string
        description: Where to write the bundle.
      - name: skipBuild
        type: boolean
        description: Reuse already-built artifacts.
      - name: publisherKeyPath
        type: string
        description: A publisher signing key.
        optional: true
    endpoint:
      transport: CLI
      command: pack
  - name: publish
    description: Build a bundle if needed and upload it to the resolved registry.
    signature: >-
      publish(directory: string, bundlePath: string?, registryFlag: string?, skipBuild: boolean,
      publisherKeyPath: string?): PublishOutcome
    returns: sdk_cli::publish-outcome
    params:
      - name: directory
        type: string
        description: The project root.
      - name: bundlePath
        type: string
        description: An already-built bundle to publish instead.
        optional: true
      - name: registryFlag
        type: string
        description: A `--registry` override.
        optional: true
      - name: skipBuild
        type: boolean
        description: Reuse already-built artifacts.
      - name: publisherKeyPath
        type: string
        description: A publisher signing key.
        optional: true
    endpoint:
      transport: CLI
      command: publish
  - name: unpublish
    description: Withdraw a published version, naming the registry it is being withdrawn from.
    signature: 'unpublish(fqid: string, version: string, registryFlag: string?): void'
    returns: void
    params:
      - name: fqid
        type: string
        description: The package to withdraw from.
      - name: version
        type: string
        description: The version to withdraw.
      - name: registryFlag
        type: string
        description: A `--registry` override.
        optional: true
    endpoint:
      transport: CLI
      command: unpublish
  - name: newPublisherKey
    description: >-
      Create a publisher signing key, stating what it commits its owner to.


      A COMMAND RATHER THAN AN IMPLICIT STEP. Generating a key as a side effect of the first signed
      pack would hand someone an irreversible commitment as a convenience — every node that installs
      the package pins that publisher, rotation is refused, and a lost key is a package that can
      never be updated. Making it a thing a developer asks for is what makes the statement land
      while there is still a decision to make.
    signature: 'newPublisherKey(path: string): PublicKey'
    returns: bytes
    params:
      - name: path
        type: string
        description: Where to write it. Refused if anything is already there.
    endpoint:
      transport: CLI
      command: key new
status: draft
