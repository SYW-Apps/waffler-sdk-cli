      - name: generics
        type: list<any>
        description: Generic declarations (loose).
      - name: inputs
        type: list<form-field>
        description: >-
          The parameter list — an ARRAY of named FormFields, one per argument (each FormField's
          key/label names + identifies the param; its FieldType is the param type: a primitive kind,
