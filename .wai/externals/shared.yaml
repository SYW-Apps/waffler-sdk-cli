          ONE LIST WITH A FLAG, not a second optional_dependencies collection. The crates
          dependency-resolver REGENERATES a crate's closure by walking `dependencies` uniformly, and
          every consumer that walks it — preflight, boot resolve, the packer, the accessibility
          check — would have to be taught about a second collection. One that was not taught would
          silently ignore half the dependencies, which is the defect shape this codebase produces
          most often. A flag is invisible to a walker that does not care and available to one that
          does.


          A BOOLEAN rather than a string discriminant, deliberately, sitting next to kind: String
          and status: String. Those have already cost a case-sensitivity defect here; a boolean
          cannot be misspelled or case-folded wrong. A richer rule ("required only when X is
          present") arrives later as its own field, which costs exactly what widening a string would
          have — so the string buys nothing today.


          DEFAULTS TO REQUIRED, the fail-safe direction: a row written before this field existed
          blocks an enable rather than letting a package silently run without something it declared
          it needed.


          PROPAGATION, which is not obvious: a transitive row folded in under an OPTIONAL dependency
          inherits that optionality (if the dependent runs without X, it runs without everything
          reachable only through X), while a row DERIVED from compile evidence is always required
          (the evidence is the proof it is used). Where one fqid arrives by several routes the
          closure dedup merges them REQUIRED-WINS — first-wins would have made the answer depend on
          which layer ran first.
  - id: crate-dependent
    name: CrateDependent
    kind: value-object
    fields:
      - name: crate_uuid
        type: string
        description: >-
          The CONSUMING crate — the one holding the evidence row. Never the crate that owns the
          target.
      - name: blueprint_uuid
        type: string
        description: >-
          The member blueprint whose evidence row names the target: the thing that would need
          re-authoring if the target went away.
      - name: entity_uuid
        type: string
        description: >-
          The referenced foreign entity itself, as the evidence row records it. Present even when
          the query asked by CRATE uuid, so a crate-wide answer still says which entities are
          reached.
  - id: crate-entity-ref
    name: CrateEntityRef
    kind: value-object
    fields:
      - name: crate_uuid
        type: string
        description: The uuid of the crate that OWNS the referenced entity (the dependency target).
      - name: entity_uuid
        type: string
        description: >-
          The uuid of the referenced foreign entity itself (what the export-isolation check is asked
          about).
  - id: crate-patch
    name: CratePatch
    kind: value-object
    fields:
      - name: crate_type
        type: string
        description: >-
          A new crate_type (System|Library); absent = unchanged. Not clearable — a crate always has
          a kind.
        optional: true
      - name: metadata
        type: map<string, any>
        description: Replacement free-form metadata; absent = unchanged, an empty map = cleared.
        optional: true
      - name: dependencies
        type: list<crate-dependency>
        description: Replacement declared dependency list; absent = unchanged, an empty list = cleared.
        optional: true
      - name: exports
        type: list<string>
        description: >-
          Replacement public export list — the crate's VISIBILITY BOUNDARY. Every entry the caller
          sends is checked for crate MEMBERSHIP at the point of write. Absent = unchanged (and
          unchecked, so a caller is not answerable for an entry a previous writer left behind), an
          empty list = cleared.
        optional: true
      - name: wrapped_package
        type: any
        description: >-
          A new wrapped-package descriptor; absent = unchanged. The one field with no clear form —
          nothing in core reads or writes it today, so there is nothing to blank.
        optional: true
      - name: default_permissions
        type: list<declared-permission-group>
        description: >-
          Replacement DEFAULT permission declaration for the systems booted from this crate; absent
          = unchanged, an empty list = cleared (systems booted from it get no instantiated grants).
          Editable after create for the same reason `exports` is: a declaration you can only set
          once is a declaration an author cannot correct. Every rule is re-checked for Allow-only at
          the point of write, so the constraint cannot be dodged by patching it in later. TRAILING +
          serde-default for the positional-rmp reason WafflerCrate's own field carries — a patch
          body written before this field existed decodes with it absent, i.e. unchanged, never
          cleared. (Type renamed from CratePermissionGroup 2026-10-02: packages declare the same
          shape, so the name no longer says Crate.)
        optional: true
  - id: crate-state
    name: CrateState
    kind: value-object
    fields:
      - name: phase
        type: string
        description: Lifecycle phase — Registered | Booting | Active | Failed | Shutdown.
      - name: detail
        type: any
        description: Phase-specific activation metadata (entrypoint, error, boot args).
        optional: true
  - id: create-crate-request
    name: CreateCrateRequest
    kind: value-object
    fields:
      - name: technical_name
        type: string
        description: The crate's technical name (root segment).
      - name: crate_type
        type: string
        description: >-
          The crate kind: System | Library | ForeignBridge (gates bootability + the
          default-entrypoint factory).
      - name: display_name
        type: string
        description: Human-readable label.
        optional: true
      - name: tags
        type: list<string>
        description: Crate tags.
        optional: true
      - name: parent_uuid
        type: string
        description: >-
          WHERE the crate goes in the namespace tree; absent = a root crate, which is what every
          caller got before this field existed. A crate is a project root for its OWN CONTENTS,
          which says nothing about where it lives in the workspace: waffler holds waffler_core and
          waffler_ui as subcrates, waffler_core holds a services/ folder with a subcrate per
          service, and a business node nests departments, organizations and teams with access scoped
          to a subtree. Nesting was always the design and only this verb could not express it — the
          tree nests a crate correctly (namespaces:move places one and crates:list still finds it)
          and namespaces:get_crate is defined as the NEAREST crate ancestor-or-self, a resolver that
          only means anything if a crate can sit inside another. Because the bus tolerates unknown
          fields, a client that sent parent_uuid in good faith had it accepted and DISCARDED,
          getting a root crate and no error. A malformed value is now refused as InvalidPayload
          rather than dropped, before anything is minted or written. TRAILING and serde(default)
          because the msgpack wire is POSITIONAL: a four-element request written before this field
          still decodes and still means a root crate.
        optional: true
  - id: db-op
    name: DbOp
    kind: value-object
    fields:
      - name: value
        type: string
        description: The db operation — Insert | Update | Delete | Upsert.
  - id: deactivate-hook
    name: DeactivateHook
    kind: value-object
    fields:
      - name: target
        type: string
        description: Opaque reference to the bound deactivate callback.
  - id: debug-fiber
    name: DebugFiber
    kind: value-object
    fields:
      - name: fiber
        type: int
        description: >-
          The Wack FiberId (wack::fiber::WackFiber::owner) this row describes. ABSENT is a third
          state, not "fiber zero": it means the marker that recorded this row did not name a fiber
          (a foreign or absent marker payload). The Wack mints fiber ids from 1, so 0 is never a
          real fiber and is never used as a stand-in here.
        optional: true
      - name: node_uuid
        type: string
        description: >-
          The node at whose boundary this fiber was last seen during the current stop — where it is
          parked.
      - name: stop_reason
        type: debug-stop-reason
        description: >-
          Why this fiber requested the stop (Breakpoint | Step). ABSENT means it requested nothing:
          it reached a boundary while the run was ALREADY stopped and parked on the run's pause
          gate. Absent is not "no reason known" — it is the positive fact that this fiber is a
          bystander of somebody else's stop.
        optional: true
      - name: is_stop_origin
        type: bool
        description: >-
          Whether this fiber is the one that moved the run Running -> Paused (GDB's "Thread 3 hit
          Breakpoint 1"). Exactly one row carries true while a stop is recorded. A row may carry a
          stop_reason and still be false: a second fiber can arrive at its own breakpoint after the
          run has already stopped, which is a real breakpoint hit but not the origin of this stop.
  - id: debug-session
    name: DebugSession
    kind: value-object
    fields:
      - name: session_id
        type: string
        description: The debug session id.
      - name: execution_id
        type: any
        description: The execution being debugged.
      - name: breakpoints
        type: any
        description: The active breakpoint set and paused state.
  - id: debug-stop-reason
    name: DebugStopReason
    kind: value-object
    fields:
      - name: value
        type: string
        description: Breakpoint | Step.
  - id: decision
    name: Decision
    kind: value-object
    fields:
      - name: allowed
        type: bool
        description: Whether the action is permitted.
      - name: reason
        type: string
        description: Why it was denied (when not allowed).
        optional: true
  - id: declared-permission-group
    name: DeclaredPermissionGroup
    kind: value-object
    fields:
      - name: id
        type: string
        description: >-
          Stable id, unique within the declaring crate or package. Must match [A-Za-z0-9._-] — no
          ':', because ':' is the delimiter of the instantiated firewall-rule id
          (sys:{system}:group:{id}:rule:{i}).
      - name: display_name
        type: string
        description: >-
          The name a reviewer sees when adjusting this group at boot, or when approving a package's
          request at install.
      - name: description
        type: string
        description: What the group is for, in the author's words — the justification a reviewer reads.
      - name: required
        type: bool
        description: >-
          true = REQUIRED (the subject cannot function without it, so a review may narrow its rules
          but may not decline the group); false = OPTIONAL (a review may decline it outright).
          Serde-default true, matching StoredPermissionGroup — an author who does not say is treated
          as the cautious reading.
      - name: rules
        type: list<permission-rule>
        description: >-
          The permissions themselves, in the firewall's own vocabulary. Rule INDEX is identity: a
          boot-time narrowing addresses a rule by its position here, so reordering a published
          declaration's rules re-points every persisted adjustment.
  - id: def-resolver
    name: DefResolver
    kind: value-object
    fields:
      - name: target
        type: string
        description: Opaque reference to the bound definition resolver supplied by the caller.
  - id: dependency-closure
    name: DependencyClosure
    kind: value-object
    fields:
      - name: deps
        type: list<resolved-dep>
        description: The transitively-resolved dependency set.
  - id: dependency-decl
    name: DependencyDecl
    kind: value-object
    fields:
      - name: name
        type: string
        description: The dependency name.
      - name: version_req
        type: string
        description: The semver version requirement.
  - id: dir-entry
    name: DirEntry
    kind: value-object
    fields:
      - name: name
        type: string
        description: The entry name.
      - name: is_dir
        type: bool
        description: True when the entry is a directory.
  - id: direction
    name: Direction
    kind: value-object
    fields:
      - name: value
        type: string
        description: The direction variant — Inbound | Outbound.
  - id: discovered-segment
    name: DiscoveredSegment
    kind: value-object
    fields:
      - name: manifest
        type: any
        description: The parsed SegmentManifest for the discovered segment.
      - name: source
        type: string
        description: Workspace | Library.
      - name: parent_uuid
        type: string
        description: >-
          The parent segment UUID carried from discovery so the mounter registers the segment under
          its parent (nested-tree rebuild); null for a volume root.
        optional: true
  - id: drop-plan
    name: DropPlan
    kind: value-object
    fields:
      - name: steps
        type: any
        description: The ordered release steps (resource kind + handle/id per step).
  - id: effective-permissions
    name: EffectivePermissions
    kind: value-object
    fields:
      - name: is_owner
        type: bool
        description: Whether the caller holds owner/admin authority.
      - name: principals
        type: list<string>
        description: The caller's resolved principal set (the rules flatten over these).
      - name: groups
        type: list<string>
        description: The permission groups the caller belongs to.
      - name: rules
        type: list<firewall-rule>
        description: The concrete firewall rules that apply to the caller.
  - id: endpoint
    name: Endpoint
    kind: value-object
    fields:
      - name: transport
        type: string
        description: The wire protocol — HTTP | gRPC | GraphQL | MessageBus | NamedPipe | IPC | CLI | Custom.
      - name: address
        type: any
        description: The transport-specific address (path/topic/event/pipe/command).
  - id: engine-capabilities
    name: EngineCapabilities
    kind: value-object
    fields:
      - name: range_scan
        type: bool
        description: Whether `scan` by key range is supported.
      - name: prefix_scan
        type: bool
        description: Whether `scan` by key prefix is supported.
      - name: transactions
        type: bool
        description: Whether atomic `transaction` batches are supported.
  - id: entity-def
    name: EntityDef
    kind: value-object
    fields:
      - name: entity_type
        type: string
        description: The entity type discriminant for the body.
      - name: body
        type: any
        description: The flattened definition body for that entity type.
  - id: entity-id
    name: EntityId
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: The stable entity UUID (preferred).
        optional: true
      - name: fqid
        type: string
        description: The FQID dotted path (resolved to a uuid).
        optional: true
  - id: entity-identity
    name: EntityIdentity
    kind: value-object
    fields:
      - name: fqid
        type: string
        description: >-
          The entity's fully-qualified id (derived by namespaces from the uuid-path; never stored on
          the content).
      - name: crate_uuid
        type: string
        description: The uuid of the crate root that owns this entity (the first segment of its uuid-path).
  - id: entity-kind
    name: EntityKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: 'One of: type | class | interface | enum | signature | blueprint.'
  - id: entity-ref
    name: EntityRef
    kind: value-object
    fields:
      - name: uuid
        type: any
        description: The referenced entity's id.
      - name: entity_type
        type: string
        description: The referenced entity's type (blueprint | class | interface | type | enum | crate | ...).
  - id: entity-type
    name: EntityType
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          Blueprint | Class | Interface | Type | Enum | Crate | Signature | Folder. A NARROWER set
          than `namespace-entity-type`, which additionally carries Package, FunctionSignature,
          Secret, Connection and Extension — the two are different vocabularies and a consumer must
          not treat one as the other.
  - id: entity-type-spec
    name: EntityTypeSpec
    kind: value-object
    fields:
      - name: entity_type
        type: string
        description: The entity type name (the persistence keying namespace).
      - name: config
        type: any
        description: Storage configuration for this type (provider/route, indexes, options).
  - id: env-sync-report
    name: EnvSyncReport
    kind: value-object
    fields:
      - name: findings
        type: list<reconcile-finding>
        description: The discrepancies found during reconcile.
      - name: applied
        type: bool
        description: Whether corrective changes were applied.
  - id: error-instance
    name: ErrorInstance
    kind: value-object
    fields:
      - name: class_uuid
        type: any
        description: The Error class uuid (trap-match key).
      - name: message
        type: string
        description: The error message.
      - name: data
        type: any
        description: Optional structured error payload.
        optional: true
  - id: error-metrics
    name: ErrorMetrics
    kind: value-object
    fields:
      - name: unit
        type: string
        description: The failing unit (service/package fingerprint).
      - name: error_count
        type: int
        description: Errors observed in the current window.
      - name: window_ms
        type: int
        description: The aggregation window in ms.
      - name: last_error
        type: error-payload
        description: The most recent error classification.
        optional: true
      - name: consecutive_failures
        type: int
        description: Consecutive failures (drives reboot/shutdown escalation).
        optional: true
  - id: error-payload
    name: ErrorPayload
    kind: value-object
    fields:
      - name: code
        type: string
        description: The closed-set WafflerError code (see waffler-error).
      - name: message
        type: string
        description: Human-readable detail.
      - name: source
        type: string
        description: The emitting principal (service FQID / 32-hex package fingerprint).
        optional: true
      - name: data
        type: any
        description: Optional structured context (e.g. validation issues[]).
        optional: true
      - name: stack_trace
        type: string
        description: >-
          The error's stack trace — DOES travel on the wire (remote error reporting across
          services), core/API.md. Optional.
        optional: true
      - name: trace_id
        type: string
        description: >-
          Correlation id mirroring the envelope header (ties the error to its request chain).
          Optional.
        optional: true
  - id: event-gap
    name: EventGap
    kind: value-object
    fields:
      - name: topic
        type: string
        description: The topic the events were missed on.
      - name: first_seq
        type: int
        description: The first missed event's sequence number on the topic.
      - name: last_seq
        type: int
        description: The last missed event's sequence number, inclusive. The range is contiguous.
      - name: reason
        type: string
        description: >-
          Why they were missed, one of a closed set: `over_bounds` - the backlog exceeded the
          subscription's memory bounds and its spill quota; `spill_failed` - the events were spilled
          to disk and could not be written, or were refused on the way back (an IO error, or a
          segment that failed its integrity check). `retention` would join it with the durable
          distributed log (D10-4, backlog).
    methods:
      - name: count
        signature: count() -> u64
        returns: int
        description: 'How many events were missed: last_seq - first_seq + 1, and 0 for a malformed range.'
  - id: event-handler
    name: EventHandler
    kind: value-object
    fields:
      - name: target
        type: string
        description: Opaque reference to the bound event handler.
  - id: exec-config
    name: ExecConfig
    kind: value-object
    fields:
      - name: trace_level
        type: trace-level
        description: >-
          This run's trace verbosity as the CLOSED trace-level type, not a bare string: an
          unrecognised spelling is refused by the request decoder instead of reading as no-trace.
          Absent is a third state and NOT the same as Off — it means the caller did not decide,
          which is what runtime-host-backends' resolve_boot_logging reads to fall back to the
          entrypoint's declared logging_config. For every other run absent behaves as Off. Test runs
          floor at Nodes.
        optional: true
      - name: start_paused
        type: bool
        description: Start the run paused at the first node (debugger attach before stepping).
        optional: true
      - name: logging_config
        type: blueprint-logging-config
        description: >-
          Per-run logging override ({ enabled, log_variable_values }); else the blueprint/host
          default.
        optional: true
      - name: journal_level
        type: string
        description: Off | Intent | Full — the per-run journal capture level.
        optional: true
      - name: is_test_env
        type: bool
        description: Test-env run (enables the MockInterceptorRegistry / try_mock path; non-persistent).
        optional: true
      - name: persistent
        type: bool
        description: Whether run state/results are persisted (false for test_blueprint).
        optional: true
      - name: concurrency_overflow_policy
        type: concurrency-overflow-policy
        description: Per-run fork-overflow policy override (else the blueprint default).
        optional: true
      - name: workers
        type: int
        description: >-
          Concurrency Phase 5: the Wack worker-pool size cap for this run — the maximum parallel
          fiber workers. Default (absent) = the host's logical core count. 1 = the deterministic
          cooperative mode (byte-identical Phase-1 single-thread interleaving; the whole pre-Phase-5
          test corpus runs under it). The pool grows LAZILY from 1 toward this cap only while
          runnable fibers exceed idle workers, so a run that never forks spawns zero extra threads.
        optional: true
      - name: sched_seed
        type: int
        description: >-
          Concurrency Phase 5 test mode: a deterministic-scheduling seed — the scheduler picks the
          next ready fiber by a seeded RNG instead of FIFO, making interleaving exploration
          REPRODUCIBLE (same seed = same schedule; a failing seed is a repro artifact). Presence
          coerces workers=1 (a parallel schedule is not reproducible).
        optional: true
      - name: limits
        type: vm-limits
        description: >-
          This run's VM ceilings (steps / wallclock / ...). TRAILING and defaulted: compact
          MessagePack encodes this struct POSITIONALLY, so a new field is only safe at the end.
          Absent = the runtime's own defaults.
        optional: true
      - name: call_depth
        type: int
        description: >-
          How many execute_external boundaries this run already sits behind — 0 for a run a caller
          started, incremented once per nesting level. A blueprint calling ITSELF routes through
          execute_external into a whole new run with a fresh instruction counter, so depth is the
          only thing that accumulates across that boundary and the in-fiber runaway backstop needs
          it carried on the config. TRAILING and defaulted, for the same positional-MessagePack
          reason limits is.
  - id: executable-blueprint
    name: ExecutableBlueprint
    kind: value-object
    fields:
      - name: instructions
        type: list<vm-instruction>
        description: The flat program walked by the cursor.
      - name: slot_count
        type: int
        description: Per-invocation frame size.
      - name: slot_names
        type: list<string>
        description: slot index -> display name (debug only; unused slots marked, no behaviour change).
      - name: slot_kinds
        type: list<variable-kind>
        description: slot index -> Var|Const (runtime Const guard; baked globals + execution.* are Const).
      - name: trap_table
        type: trap-table
        description: Static exception range map (Phase D).
      - name: node_map
        type: list<node-boundary>
        description: Sparse node-boundary map (sorted by instr_index).
      - name: constants
        type: list<any>
        description: Constants pool referenced by LoadConst{const_id}.
      - name: entry_signature
        type: entry-signature
        description: The inputs-map shape (blueprint) or positional params (subroutine) + output type.
      - name: uuid
        type: string
        description: >-
          The blueprint's own uuid (Phase 2b member_index plumbing): emitted per closure member so
          the bundle-loader builds the member-uuid index that splits an in-bundle SubBlueprint
          frame-push from a cross-crate execute_external. Absent on legacy artifacts (then every
          SubBlueprint routes cross-crate via execute_external — today's behaviour).
        optional: true
      - name: closure_refs
        type: list<string>
        description: >-
          Stage 1.5 (sim-caught gap: live bundles shipped empty closures so in-bundle routing never
          happened): the COMPILE-BAKED same-crate dependency-closure targets — the blueprint uuids
          of every bound static SubBlueprint / constructor-body / function.ref target, plus each
          MethodCall's STATICALLY-resolved declared-impl blueprint (the runtime override walk may
          still pick a subclass body, which then routes execute_external), INCLUDED iff
          def-resolver.owning_crate(target) == the unit's context_crate (both Some). The runtime's
          bundle assembly recursively get_or_compiles these into Bundle.closure, making intra-bundle
          frame-push routing (and fn-param-carrying calls) real. A context-less compile bakes none
          (everything routes cross-crate — the prior behavior). serde-default so pre-existing
          .compiled artifacts keep loading (empty = all-external).
        optional: true
      - name: fn_param_slots
        type: any
        description: >-
          Stage 1.5 (the CALLEE half of fn-param threading): this blueprint's OWN function-typed
          parameters as an ordered { name -> reserved frame slot } list, compiler-assigned after the
          reserved inputs/self slots. A caller threads matching fn-typed args as DEDICATED Execute
          operands (see fn-handle fn_params) and the fiber seeds them into these slots at frame
          push; the slot sweep resolves `inputs.<name>` references to the reserved slot instead of
          the Json map (whose children structurally cannot carry the fn_handle side-channel).
          serde-default (absent = no fn-typed params).
        optional: true
      - name: required_globals
        type: list<string>
        description: >-
          PORTABILITY: the INJECTED globals this artifact expects supplied at run start — the
          `host.` names the snapshotter deliberately did NOT bake, recorded so a runner can check
          before starting rather than discovering the gap mid-run. A baked global is frozen into the
          artifact, which binds it to the core that compiled it; the `host.` namespace means "a fact
          about the machine this is running ON", so those values are left out and supplied per run.
          The list is the CONTRACT, not a hint: an unsupplied name is UnknownGlobal at run start,
          naming it, and must never default to null. TRAILING + serde-default (empty = an artifact
          that requires nothing injected — every pre-existing .compiled).
        optional: true
      - name: cross_crate_refs
        type: list<crate-entity-ref>
        description: >-
          THE CROSS-CRATE REFERENCES THE COMPILER ACCEPTED — every foreign entity this artifact
          reached into and was allowed to, each paired with the crate that owns it, sorted +
          deduped, recorded as the compiler decided it rather than re-derived afterwards. Empty for
          a same-crate-only artifact and for a context-less compile (a draft has no owning crate, so
          there is nothing to depend on).


          COMPILE PROVENANCE, NOT PROGRAM TEXT: the VM never executes and never reads it — nothing
          in the instruction stream, trap table or frame layout consults it. It rides the artifact
          so a cache HIT carries it too.


          WHY ENTITY-GRANULAR: the crate uuid alone is enough to DECLARE a dependency but not to
          CHECK one — the export-isolation backstop asks is_accessible(this_crate, target_crate,
          target_entity), and with only the crate it would have to guess the entity.


          WHY THE COMPILER SAYS IT: it already loads every referenced element and already decides
          accessibility (def-resolver check_access -> crates-accessibility.is_accessible), so it is
          the only place that knows which references exist AND which crossed a crate boundary AND
          which were approved. Deriving it on the SAVE path by walking the node JSON, or in the UI
          at selection time, were both weighed and rejected: the first re-derives what counts as a
          cross-crate dependency and drifts from the resolver the moment the resolver's notion
          moves; the second makes it a fact about the editor rather than about the crate, in one
          client among several.


          WHY IT RIDES THE ARTIFACT: a cache HIT performs no compile, so a fact carried only by the
          CompileOutput would leave an activation that loads a valid .compiled recording nothing at
          all. It is stamped INTO the artifact and survives the .compiled round trip, exactly as
          required_globals beside it does.


          The compiler NEVER writes this to a crate manifest — a compile is a read path and
          validate_blueprint IS the full compile. The artifact states the fact; the ACTIVATION path
          records it as one member's row in the consuming crate's EVIDENCE layer (.member_refs).
          TRAILING + serde-default (empty = an artifact compiled before this field existed, which is
          indistinguishable from one that reaches no other crate — and both record nothing, so the
          two agree).
        optional: true
