id: iproject-client-adapter
name: Project Access Contract
description: >-
  Publishing's one door into Project.


  IT IS THIN AND THAT IS FINE. What it buys is that the crossing happens in ONE place: when the
  plan's shape changes, exactly one file in Publishing has to know, and the orchestrator that
  decides publishing ORDER does not become a second reader of the project model.
component: project-client-adapter
methods:
  - name: planFromDirectory
    description: Ask Project for a bundle plan.
    signature: 'planFromDirectory(directory: string, skipBuild: boolean): BundlePlan'
    returns: sdk_cli::bundle-plan
    params:
      - name: directory
        type: string
        description: The project root.
      - name: skipBuild
        type: boolean
        description: Reuse already-built artifacts.
status: draft
