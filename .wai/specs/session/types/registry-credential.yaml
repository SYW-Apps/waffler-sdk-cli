kind: entity
id: registry-credential
name: Registry Credential
description: >-
  One signed-in session, belonging to exactly one registry.


  KEYED BY REGISTRY, WHICH IS A TRUST BOUNDARY RATHER THAN A CONVENIENCE. Two registries are two
  services with two identity providers and two ideas of who owns which namespace. One cached token
  shared between them would let a `use` change carry an identity across that boundary silently, and
  the request that arrived at the wrong registry would carry a perfectly valid bearer for somewhere
  else.


  IT IS A SECRET AT REST. The refresh token is long-lived; the record lives in the user's own config
  directory with owner-only permissions and never in a project tree, because a credential file that
  can be committed eventually is.


  NOTHING HERE IS INTERPRETED. The subject and username are for display; no scope, role or
  entitlement is read out of the token to pre-judge what it may do. A client that decides in advance
  what a credential is allowed to do is a client that can disagree with the server about permission,
  and it disagrees silently.
subsystem: session
fields:
  - name: registry
    type: string
    description: >-
      The normalised registry base URL this credential is for. The same normalisation the resolver
      produces — there must not be a second one.
    optional: false
    key: primary
  - name: accessToken
    type: string
    description: The bearer presented to the registry. Short-lived by design.
    optional: false
  - name: refreshToken
    type: string
    description: >-
      Exchanged for a new access token without a browser. Absent when the issuer grants none, in
      which case expiry means a real re-login.
    optional: true
  - name: expiresAt
    type: string
    description: >-
      When the access token stops being accepted, as an absolute instant. Compared against a margin
      so a token cannot expire between the check and the upload it was checked for.
    optional: false
  - name: subject
    type: string
    description: >-
      The `sub` claim, for display. Stable across username changes, which is why it and not the
      username is the identity shown when they disagree.
    optional: false
  - name: username
    type: string
    description: A human-readable name from the token, for display only.
    optional: true
methods: []
componentClass: sdk_cli::session-store
invariants:
  - id: one-credential-per-registry
    description: >-
      At most one credential exists per normalised registry URL. Writing a credential replaces any
      existing entry for that registry rather than appending, so two spellings of one registry can
      never produce two live sessions.
  - id: removed-not-blanked
    description: >-
      Signing out deletes the entry. A record left in place with cleared fields is indistinguishable
      from an expired one, and the two need different messages: 'you are not signed in to this
      registry' versus 'your session expired'.
