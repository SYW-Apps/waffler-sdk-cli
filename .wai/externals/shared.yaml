  - id: closure-capture
    name: ClosureCapture
    kind: value-object
    fields:
      - name: name
        type: string
        description: >-
          The captured name — identical on both sides of the frame boundary, because the capture
          binding SHADOWS the enclosing one (which is what lets every later pass resolve the body's
          uses with no capture-awareness at all).
      - name: from_slot
        type: int
        description: >-
          The OUTER slot snapshotted from: the name re-resolved nearest-enclosing from the creation
          node's own scope (the LoadFunction capture operand).
      - name: to_slot
        type: int
        description: >-
          The CLOSURE-FRAME slot it lands in: the same name resolved in the closure's own scope (the
          handle's capture_slots entry, seeded by frame push).
      - name: liveness
        type: capture-liveness
        description: snapshot | shared-live | runtime-form — never collapsed (see CaptureLiveness).
  - id: source-map-payload
    name: SourceMapPayload
    kind: value-object
    fields:
      - name: node_ranges
        type: list<node-range>
        description: node -> [start..end] instruction range. THE per-node grouping table (see NodeRange).
      - name: slots
        type: list<slot-info>
        description: slot/variable -> name + kind + declaring/clearing scope.
      - name: edge_jumps
        type: list<edge-jump>
        description: >-
          exec-edge -> the realizing Jump/JumpIfFalse (branch-path reconstruction). Serde-defaulted
          empty.
      - name: closures
        type: list<closure-capture-table>
        description: >-
          function.closure node -> its ORDERED capture list — what lets a designer render capture
          badges ON the closure node. Serde-defaulted empty.
      - name: pin_slots
        type: list<node-pin-slots>
        description: >-
          node -> its pins' slots. What lets a `.logs` record say what a node SAW and PRODUCED
          rather than only that it ran. Serde-defaulted empty, and LAST in the positional encoding.
    methods:
      - name: into_source_map
        signature: 'into_source_map(): SourceMap'
        returns: source-map
        description: Encode into the shared SourceMap carrier (the `.debug` part's on-disk shape).
      - name: from_source_map
        signature: 'from_source_map(map: SourceMap): SourceMapPayload'
        returns: source-map-payload
        description: >-
          Decode from the shared SourceMap carrier; a structurally corrupt payload refuses with
          ValidationFailed naming the decode failure.
  - id: connection-designer
    name: ConnectionDesigner
    kind: value-object
    fields:
      - name: label
        type: string
        description: Edge label.
        optional: true
  - id: permission-rule
    name: PermissionRule
    kind: value-object
    fields:
      - name: pattern
        type: rule-pattern
        description: The target-side RulePattern.
      - name: effect
        type: permission-effect
        description: Allow | Deny.
      - name: priority
        type: int
        description: >-
          The firewall priority this rule flattens to (ascending = evaluated first,
          first-match-wins, Ledger §8.1). Priorities 0-99 belong to the node's own baseline
          (AUTHORED_PRIORITY_FLOOR = 100, checked by shared::security reserved_priority): every
          authoring write refuses a rule below 100, and a rule already stored below it is raised
          into the authored band when the active rule set is rebuilt. From 100 up the author sets
          it; any u32 >= 100 is valid.
  - id: vm-instruction
    name: VmInstruction
    kind: value-object
    fields:
      - name: opcode
        type: string
        description: >-
          Jump|JumpIfFalse|Switch|Return|Throw|Fork|Await|ResolvePromise|ClearSlot|DropScope|NodeEnter|LoadConst|SetVariable|Wait|Log|NewInstance|SetField|SetPath|Execute|LoadFunction|Invoke|BindReceiver.
      - name: slot_operands
        type: list<int>
        description: >-
          Slot-index operands (cond_slot/out_slot/arg_slots/from..to/Switch
          discriminant=slot_operands[0]/etc.; LoadFunction = [out_slot] alone for a plain function
          REFERENCE, or [out_slot, capture_src_0..N-1] for a Stage-2 CLOSURE — the capture sources
          are READ and snapshotted into the built value's captured_env in operand order, matching
          the handle's capture_slots; out-slot-first keeps the reference form's operand shape
          unchanged; BindReceiver = [fn_slot, recv_slot, out_slot]: verify frame[fn_slot] is a
          function value whose handle has_self, frame[recv_slot] is a SHARED (heap_ref-bearing)
          class instance, and write the BOUND copy (bound_recv = the receiver) into out_slot —
          violations are trap-able NotBindable/OwnedReceiver Fails, out_slot unwritten; class
          conformance is NOT checked here — virtual dispatch resolves against the receiver's ACTUAL
          class at the call and fails cleanly there — N-2).
        optional: true
      - name: target
        type: int
        description: Jump/Fork target instruction index.
        optional: true
      - name: fn_handle
        type: fn-handle
        description: >-
          The pre-bound call target (Execute; LoadFunction carries the handle its built function
          Value wraps — a receiver-less reference, a has_self handle awaiting BindReceiver (N-2), or
          a Closure-kind Subroutine handle whose capture_slots the instruction's capture operands
          fill (Stage 2)).
        optional: true
      - name: const_ref
        type: any
        description: >-
          const_id (pool index) or inline Value (LoadConst); LoadFunction: the compile-baked
          (inputs, output) callback-contract shape of the referenced target — a blueprint's own
          signature, or a Closure-kind subroutine's inputs/output pair, which is the SAME (inputs,
          output) shape by BP-1 (seeded into the built function Value's data — the Stage 1-FFI
          validation contract).
        optional: true
      - name: node_uuid
        type: string
        description: The node identity baked into a NodeEnter marker.
        optional: true
      - name: class_uuid
        type: string
        description: >-
          The resolved class_uuid to construct + tag (NewInstance only) — the compiler-resolved
          class the instance is an instance of; also selects the Error-derived ALWAYS-inline
          carve-out at runtime.
        optional: true
      - name: shared
        type: bool
        description: >-
          NewInstance only (Concurrency Phase 2b): the construction variable's OWNED/SHARED
          authoring mode — true = SHARED (allocate an object-heap cell + write a heap_ref handle
          into out_slot), absent/false = OWNED (inline ClassInstance in out_slot). The compiler sets
          it from the construction variable's ownership (owned default, shared explicit — value
          model §1.1), and it REPLACES the per-run shared_classes FiberConfig set as the source of
          truth for the shared/inline choice; the runtime Error-derived carve-out (error_classes)
          still forces inline regardless.
        optional: true
      - name: taint
        type: sensitivity
        description: >-
          The DECLARED sensitivity this instruction stamps onto the value it writes. A `sensitive`
          class property is not a runtime concern -- the value behaves identically -- it is an
          OBSERVABILITY one: the logger and the debugger redact by `Value.sensitivity`, and nothing
          ever set it from a property's declaration. The compiler knows which property a
          construction field belongs to, so the mark is applied where the value is STORED, once, and
          every later read inherits it through ordinary taint propagation. Absent = stamp nothing,
          which is every instruction the compiler did not mark. Serde-default, so pre-existing
          `.compiled` artifacts keep loading.
        optional: true
  - id: variable-kind
    name: VariableKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: Var | Const.
  - id: node-boundary
    name: NodeBoundary
