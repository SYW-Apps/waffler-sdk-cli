id: publishing
name: Publishing
description: >-
  Turning a built package project into a signed artifact and getting it into a registry. The heart
  of the tool: pack and publish.


  WHAT IT OWNS. The bundle format as WRITTEN — /.manifest + /artifact/<name> +
  /namespace/<uuid>.json — the publisher signature that rides on it, and the HTTP conversation with
  a registry's publication API. It is the producer counterpart to registry::publication, which reads
  and validates everything written here, and to waffler_core's installer, which verifies it again on
  a node months later.


  THE INVARIANT IT SERVES. The bytes a node verifies must be the bytes that were signed. Nothing
  here may re-zip, re-compress or normalise a payload after signing it — a transformation that looks
  harmless produces an artifact core refuses as IntegrityFailure, discovered on a stranger's machine
  rather than here. The registry holds the same invariant from the other side and calls it opaque
  custody.


  TWO PUBLISH SHAPES, and the tool must make the safe one the easy one. A bundle uploaded UNSIGNED
  is signed by the registry alone; a bundle carrying a publisher signature is countersigned by the
  registry and binds the artifact to whoever built it. The registry refuses an upload that already
  carries a REGISTRY signature, because it cannot safely decide which trailing bytes were signature
  and which were content — so producing the right artifact for the right path is this subsystem's
  job rather than the operator's.


  DOWNGRADE IS THE ATTACK. A package that has ever carried a publisher signature may never publish
  one without. That is enforced here as a refusal that needs no flag, backed by asking the registry
  what it holds — not as policy documentation, because a flag is how a safe path becomes the
  inconvenient one and gets worked around.


  WHAT IT DOES NOT DO. It does not install, does not verify a node's trust anchors, and does not
  decide whether a package is trustworthy. It produces an artifact and hands it to a registry; every
  acceptance decision after that belongs to someone else.
