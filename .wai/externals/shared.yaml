          issue, which is nearly all of them — a type mismatch and an unresolvable primitive have no
          permission to suggest. Its PRESENCE says this issue is a permission finding and that a
          rule would resolve it; its ABSENCE says nothing about whether the blueprint is permitted,
          only that this issue is not about permissions. A suggestion GRANTS NOTHING: the permission
          model stays authored, and PermissionSuggestion.is_complete must be consulted before
          offering to append one on a single click — a sketch whose target could not be derived is a
          starting point, not a rule. TRAILING and serde-defaulted, per the positional-MessagePack
          rule this wire obeys: a new field only ever appends, so an issue encoded before this
          existed still decodes (with no suggestion, which is the truthful reading of a report
          produced before the permission census ran).
