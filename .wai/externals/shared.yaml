      - name: name
        type: string
        description: The function name as used in the {{ }} expression language.
      - name: execution_type
        type: string
        description: >-
          BuiltIn (in-process Rust) | Custom (a bus call to service:command) | Blueprint (executed
          by the VM as a blueprint).
      - name: service
        type: string
        description: 'Custom execution_type only: the target service.'
        optional: true
      - name: command
        type: string
        description: 'Custom execution_type only: the target command.'
        optional: true
      - name: blueprint_id
        type: string
        description: 'Blueprint execution_type only: the backing blueprint UUID.'
        optional: true
      - name: manifest
        type: function-manifest
        description: >-
          The self-describing manifest (arguments, return type, category, UI hints) for designer
          rendering.
  - id: inlined-expressions
    name: InlinedExpressions
    kind: value-object
    fields:
      - name: entries
        type: any
        description: Map of node/pin -> compiled InstructionSubset.
  - id: install-trigger
    name: InstallTrigger
    kind: value-object
    fields:
      - name: value
        type: string
        description: Interactive | Automated.
  - id: installed-package
    name: InstalledPackage
    kind: value-object
    fields:
      - name: fqid
        type: string
        description: The package's fully-qualified id (namespace key).
      - name: version
        type: string
        description: The installed SemVer (exactly one full binary per package; no side-by-side versions).
      - name: identity
        type: string
        description: >-
          The package's non-forgeable Ed25519 fingerprint / bus principal. RUNTIME-MANAGED, like
          .state/approved it is NOT carried in the signed bundle .manifest: minted at install via
          security create_package_identity and re-derived DETERMINISTICALLY from (node_seed, fqid)
          on every boot (same fqid -> same fingerprint across restart/reinstall; security
          verify_fingerprint round-trips it back to this fqid). Because the persisted .manifest is
          the bundle manifest (which never carries identity), this field serde-DEFAULTS to empty on
          the boot read-back decode — a missing identity is therefore NOT a malformed record; the
          supervisor's init re-issue (create_package_identity) repopulates each hydrated record's
          identity through the Store (set_identity) before anything consumes it. Never persisted to
          VFS, so no stale fingerprint can diverge from the deterministic runtime identity.
        optional: true
      - name: hosting_mode
        type: string
        description: DIRECT (in-process) | HOSTED (separate process; default, one-way toward isolation).
      - name: permission_groups
        type: list<stored-permission-group>
        description: >-
          The manifest's declared permission groups (the approved set is tracked separately in the
          Store).
      - name: dependencies
        type: list<crate-dependency>
        description: The package's own declared dependencies (crate | package), FQID-pinned.
      - name: capabilities
        type: list<package-capability>
        description: The typed, host-targeted capability declarations — the multi-service extension set.
      - name: ui_plugins
        type: list<ui-plugin-manifest>
        description: Declared frontend editor extensions.
      - name: middleware
        type: list<middleware-declaration>
        description: Declared bus middleware contributions.
      - name: artifacts
        type: list<artifact-ref>
        description: >-
          The bundled files in the package's /artifact/ part (hashes aligned with the verified
          manifest).
      - name: enabled
        type: bool
        description: >-
          The persisted enable/disable state (the .state part, separate from the signed .manifest).
          Init starts ONLY enabled packages; enable persists true / disable persists false so a
          disabled package survives a process restart. Mirrors the crates SystemInstance.enabled
          flag.
      - name: fast_lane_requests
        type: list<fast-lane-request>
        description: >-
          The package's manifest-declared fast-lane requests (each { target, secure, required,
          review }) — the reviewable grant set. Requests whose review == Approved materialize into
          fast_lane_grants + security LinkGrants and load into the link-policy; Pending / Rejected
          do not. serde-default: absent on legacy records (empty), for which the
          capability-target_host derivation is the fallback.
        optional: true
      - name: fast_lane_grants
        type: list<fast-lane-grant>
        description: >-
          The APPROVED, materialized fast-lane grants (target + secure) the supervisor loads into
          the link-policy on start/enable — derived from fast_lane_requests where review ==
          Approved. serde- default: absent on legacy records, for which the supervisor DERIVES the
          set from the capabilities' target_hosts (legacy fallback).
        optional: true
      - name: approved_group_ids
        type: list<string>
        description: >-
          The persisted user-approved permission-group ids the enable flow re-asserts to security.
          serde-default: absent on legacy records, for which the supervisor DERIVES the set from
          permission_groups whose status == "Approved".
        optional: true
      - name: core_compatibility
        type: string
        description: >-
          The core CONTRACT range the bundle declared it was built against (e.g. '^0.1'), checked at
          install against CORE_CONTRACT_VERSION and RETAINED here. Retention is the point: the
          install gate fires once, so without this the record cannot say what a package was built
          for, and a node whose core later moves to an incompatible generation keeps running
          packages nothing can identify as stale. Absent means the bundle declared nothing and
          installed UNCHECKED - which is NOT the same as compatible, and consumers must not read it
          as such. APPENDED LAST because this is a positional MessagePack wire where field ORDER is
          contract; serde-default so every record written before this field decodes unchanged.
        optional: true
      - name: signed_by
        type: string
        description: >-
          The LABEL of the trust anchor whose key verified this bundle's signature. Persisted so
          provenance survives the check: "signed" and "signed by my organisation's registry" are
          different sentences and only the second is one a user can act on -- verifying against a
          set and then keeping only a boolean merges every distinct trust story into one verdict
          nothing downstream can take apart again. ABSENT MEANS "NOT RECORDED", NOT "UNSIGNED":
          every installed package passed the signature gate or it would not be here, and records
          written before this field existed simply have nothing to say. APPENDED LAST -- positional
          MessagePack, so field order is contract; serde-default, so every earlier record still
          decodes.
        optional: true
      - name: middleware_reviews
        type: list<middleware-review>
        description: >-
          The operator's per-declaration decisions about this package's middleware, keyed by
          MiddlewareDeclaration.id within the package. Absence of an entry means NEVER PRESENTED --
          distinct from a recorded Pending, and distinct again from a recorded Rejected, which is a
          decision an operator already made. Parallel to approved_group_ids and shaped differently
          on purpose: a permission group carries its own reviewable status alongside, so a bare id
          list suffices there; a declaration does not, so a bare list here would make denied and
          unreviewed the same state. APPENDED LAST -- positional MessagePack, field order is
          contract; serde-default empty so every earlier record decodes. BREAKING for any consumer
          that decodes the full positional record (the marketplace does, deliberately):
          consumer-first, and consumer DEPLOYED first.
        optional: true
  - id: instruction-subset
    name: InstructionSubset
    kind: value-object
    fields:
      - name: instructions
        type: any
        description: The ordered slot-operand VM instructions.
  - id: integrity-mode
    name: IntegrityMode
    kind: value-object
    fields:
      - name: value
        type: string
        description: The integrity-mode variant — None | Hash | Signed.
  - id: intercept-outcome
    name: InterceptOutcome
    kind: value-object
    fields:
      - name: kind
        type: string
        description: The outcome variant — Continue | ShortCircuit.
      - name: response
        type: any
        description: The short-circuit response or header mutations (variant-dependent).
        optional: true
  - id: interceptor-handle
    name: InterceptorHandle
    kind: value-object
    fields:
      - name: id
        type: string
        description: The interceptor registration id.
  - id: interceptor-spec
    name: InterceptorSpec
    kind: value-object
    fields:
      - name: id
        type: string
        description: The interceptor id.
      - name: capability
        type: string
        description: The capability key it intercepts.
      - name: order
        type: int
        description: Position in the interceptor chain.
  - id: job-handle
    name: JobHandle
    kind: value-object
    fields:
      - name: id
        type: string
        description: The job handle id.
  - id: job-status
    name: JobStatus
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          The job-status variant — Running | Paused | Completed | Failed. Cancellation is not among
          them: a cancelled run is `Failed` carrying a cancellation error, and the request itself
          lives on the job's `cancel_requested` flag.
  - id: journal-ack
    name: JournalAck
    kind: value-object
    fields:
      - name: sequence
        type: int
        description: The durably-committed global sequence assigned to the entry.
  - id: journal-entry
    name: JournalEntry
    kind: value-object
    fields:
      - name: sequence
        type: int
        description: Global monotonic sequence (single-writer total order); assigned by the journal.
      - name: prev_hash
        type: bytes
        description: The chain tail this entry links onto (raw binary).
      - name: entry_hash
        type: bytes
        description: SHA-256 over the record bytes incl. prev_hash (raw binary).
      - name: timestamp
        type: int
        description: Creation time, epoch milliseconds.
      - name: source
        type: string
        description: The emitting principal (service FQID / package fingerprint).
      - name: target
        type: string
        description: >-
          The fully service-qualified target this entry records — service.capability@version (NOT a
          bare name@version).
      - name: direction
        type: string
        description: >-
          in (an inbound command received) | out (an outbound capability call) — underpins the
          outgoing-capture/crash story.
      - name: content_hash
        type: bytes
        description: >-
          SHA-256 of the payload bytes (raw binary) — ALWAYS present, independent of payload
          storage, so an Intent entry (or an encrypted keystone) that omits the payload still
          carries the integrity anchor.
      - name: detail
        type: string
        description: Intent (metadata only) | Full (incl. payload).
      - name: payload
        type: any
        description: >-
          The command payload (Full only; omitted for Intent + for an encrypted keystone's hashed
          bytes).
        optional: true
      - name: entity_refs
        type: list<bytes>
        description: >-
          Referenced entity UUIDs as raw bin(16) (NOT hex strings) — ALWAYS present (possibly
          empty), never omitted from the encoding.
      - name: trace_id
        type: bytes
        description: Optional trace id (raw bin(16)) mirroring the envelope header.
        optional: true
      - name: correlation_id
        type: string
        description: Optional correlation id tying the entry to its request chain.
        optional: true
      - name: encrypted
        type: bool
        description: Whether the payload rode an AEAD-encrypted secure frame (the keystone payload-skip).
      - name: strict_journal
        type: bool
        description: If true, a ship/fsync failure is fatal to the caller (no proceed without durable ack).
  - id: journal-level
    name: JournalLevel
    kind: value-object
    fields:
      - name: value
        type: string
        description: The journal-level variant — Debug | Info | Warn | Error.
  - id: key-range
    name: KeyRange
    kind: value-object
    fields:
      - name: from
        type: bytes
        description: Inclusive range start key.
      - name: to
        type: bytes
        description: Range end key.
  - id: lane-tier
    name: LaneTier
    kind: value-object
    fields:
      - name: value
        type: string
        description: bus | fastlane | secure_fastlane | internal.
  - id: lane-tier-requirement
    name: LaneTierRequirement
    kind: value-object
    fields:
      - name: value
        type: string
        description: Plaintext | Direct | Secure.
  - id: limit-decision
    name: LimitDecision
    kind: value-object
    fields:
      - name: value
        type: string
        description: Allow | Throttle | Kill.
  - id: limit-kind
    name: LimitKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: The limit kind — Cpu | Memory | Wallclock | Steps | Depth.
  - id: limit-state
    name: LimitState
    kind: value-object
    fields:
      - name: kind
        type: limit-kind
        description: Which limit this tracks.
      - name: used
        type: int
        description: Amount consumed so far.
      - name: ceiling
        type: int
        description: The configured ceiling.
  - id: lineage
    name: Lineage
    kind: value-object
    fields:
      - name: class_uuid
        type: string
        description: The subject class UUID.
      - name: extends
        type: list<string>
        description: Base class UUIDs, nearest-first up the extends chain.
      - name: implements
        type: list<string>
        description: Implemented interface UUIDs (transitive).
  - id: link-decision
    name: LinkDecision
    kind: value-object
    fields:
      - name: allowed
        type: bool
        description: Whether the link is authorized.
      - name: mode
        type: string
        description: The granted lane mode (Direct | Secure) when allowed.
        optional: true
      - name: reason
        type: string
        description: Denial reason (when not allowed).
        optional: true
  - id: link-grant
    name: LinkGrant
    kind: value-object
    fields:
      - name: caller
        type: string
        description: The caller principal-pattern string.
      - name: target
        type: string
        description: The target principal-pattern string.
      - name: mode
        type: string
        description: bus | direct | secure (secure mode = the manifest's secure=true link request, §7).
  - id: link-mode
    name: LinkMode
    kind: value-object
    fields:
      - name: value
        type: string
        description: Bus | Direct | Secure.
  - id: list-filter
    name: ListFilter
    kind: value-object
    fields:
      - name: prefix
        type: string
        description: Restrict to entries under this prefix.
        optional: true
      - name: recursive
        type: bool
        description: Recurse into subdirectories.
        optional: true
      - name: include_hidden
        type: bool
        description: Include dot/hidden entries.
        optional: true
  - id: live-instance
    name: LiveInstance
    kind: value-object
    fields:
      - name: instance_uuid
        type: any
        description: The live instance's unique id.
      - name: class_uuid
        type: any
        description: The instance's class.
      - name: state
        type: any
        description: The current instance state (sensitive parts vault-held / redacted).
      - name: scheduled_task_ref
        type: task-ref
        description: >-
          Optional reference-only handle to a recurring task on the runtime Scheduler (e.g.
          credential auto-refresh; §23 R4 — a reference, never a value). Null when the instance has
          no scheduled task.
        optional: true
  - id: live-system
    name: LiveSystem
    kind: value-object
    fields:
      - name: system_uuid
        type: string
        description: >-
          The activated system instance's identity — the heap key, handed in by the crates service
          and never derived.
      - name: crate_uuid
        type: string
        description: >-
          The owning crate, for attribution and crate-scoped teardown. Optional ONLY because
          .systems records persisted before C-MED1 carry no crate_uuid; such a record belongs to no
          crate.
        optional: true
      - name: entrypoint_blueprint_uuid
        type: string
        description: >-
          The designated free-main entrypoint blueprint this system entered through (N-3) — no
          class, no construction step.
      - name: execution_id
        type: string
        description: >-
          The started root-fiber run's execution job — how the run's terminal outcome is polled once
          it settles, and how the run's Wack scope is resolved for a graceful shutdown.
      - name: started_at_ms
        type: int
        description: >-
          Wall-clock activation instant in epoch milliseconds — the uptime a live-systems view
          shows.
  - id: loaded-blueprint
    name: LoadedBlueprint
    kind: value-object
    fields:
      - name: uuid
        type: any
        description: The blueprint uuid.
      - name: program
        type: flattened-program
        description: The bound, executable program.
      - name: slot_count
        type: int
        description: The frame slot count.
  - id: loaded-bundle
    name: LoadedBundle
    kind: value-object
    fields:
      - name: entry
        type: any
        description: The entry blueprint uuid.
      - name: closure
        type: any
        description: The loaded same-crate sub-blueprint closure.
  - id: loaded-entity
    name: LoadedEntity
    kind: value-object
    fields:
      - name: identity
        type: namespace-segment
        description: The entity's identity/location.
      - name: body
        type: any
        description: The deserialized definition body.
  - id: mac
    name: Mac
    kind: value-object
    fields:
      - name: value
        type: bytes
        description: The authentication tag bytes.
  - id: member-crate-refs
    name: MemberCrateRefs
    kind: value-object
    fields:
      - name: blueprint_uuid
        type: string
        description: The member blueprint whose compile produced these refs (the replacement key).
      - name: refs
        type: list<crate-entity-ref>
        description: >-
          Every cross-crate reference that member's compile accepted, sorted + deduped as the
          compiler accumulated them.
  - id: message-envelope
    name: MessageEnvelope
    kind: value-object
    fields:
      - name: id
        type: string
        description: The message UUID.
      - name: source
        type: string
        description: >-
          The sender's canonical principal — an FQID for services or the 32-lowercase-hex package
          fingerprint; stamped by the sender's BusHandle (non-forgeable, supervisor-verified).
      - name: target
        type: string
        description: The destination service name (Commands only; 1-to-1).
        optional: true
      - name: topic
        type: string
        description: The event topic (Events only; 1-to-N).
        optional: true
      - name: headers
        type: message-headers
        description: The Arc-shared header set (named cross-cutting headers + open metadata map).
      - name: payload
        type: bytes
        description: The serialized body (MsgPack on the wire).
  - id: message-headers
    name: MessageHeaders
    kind: value-object
    fields:
      - name: source
        type: string
        description: The non-forgeable principal/source (SV-4) — service FQID or package fingerprint.
      - name: correlation_id
        type: string
        description: Correlation/trace id for the request chain.
        optional: true
      - name: capability
        type: string
        description: Target capability name@version.
        optional: true
      - name: journal_intent
        type: bool
        description: The reserved journal-intent anti-forgery header.
        optional: true
      - name: jwt
        type: string
        description: Raw bearer token; parsed by auth.identity's middleware (core ships none).
        optional: true
      - name: trace_id
        type: string
        description: Correlation id (UUID) for tracing across the request chain; mirrors the envelope.
        optional: true
      - name: origin
        type: string
        description: >-
          Set by runtime for blueprint-originated calls ("blueprint", the ORIGIN_BLUEPRINT
          constant). READ by the bus security enforcer: a message carrying it is one the sending
          service is RELAYING for a running system, so it is authorized as that system
          (blueprint_uuid/system_uuid below) and never takes the relayer's trusted-service fast
          path. Believed only from a relaying service in the node's trusted set.
        optional: true
      - name: blueprint_uuid
        type: string
        description: >-
          The originating blueprint UUID. Trusted ONLY when the verified source == runtime's Ed25519
          identity (Ledger §5.5).
        optional: true
      - name: system_uuid
        type: string
        description: >-
          The RELAYED RUN'S SUBJECT ID — a booted system's uuid, or an ad-hoc run's ephemeral mint,
          or (for a run acting as its blueprint) that blueprint's uuid. Always filled by the
          runtime's stamp, because the slot means 'the id this call is relayed for'; leaving it
          empty is what made the enforcer fall back to blueprint_uuid and derive a DIFFERENT
          principal from the one the native gate enforced against. WHICH KIND of subject the id
          names rides the extra bag under the subject_type key. Trusted ONLY when the verified
          source == runtime's Ed25519 identity (Ledger §5.5).
        optional: true
      - name: authenticated
        type: bool
        description: >-
          Set by auth.identity's JWT middleware; gates whether JWT-derived User/AuthRole/AuthGroup
          claim keys in the open map are promoted to principals downstream.
        optional: true
      - name: developer_mode
        type: bool
        description: Dev-scaffold flag.
        optional: true
      - name: extra
        type: map<string, string>
        description: >-
          The open metadata map (incl. parsed JWT-claim keys). Named cross-cutting headers above are
          pinned (with their §5.5 trust rules); only truly-open metadata rides here — with ONE
          load-bearing exception, the HEADER_SUBJECT_TYPE key.


          subject_type carries WHICH KIND of subject a relayed run is, as a PrincipalType token
          (System / Run / Blueprint). It has to exist because after the run-subject split the uuid
          in system_uuid no longer identifies its own type: a booted system and an ad-hoc run both
          put one there, and their rules are sourced at two different principal types — so without
          it a system's crate-declared BUS grants would stop matching the calls they were
          instantiated for while its NATIVE grants kept matching. It rides here rather than as a
          pinned field because it is exactly as trustworthy as the origin/blueprint_uuid/system_uuid
          trio it accompanies: all four are believed only from a service the node trusts to relay,
          and none is SDK-reserved. The enforcer accepts only the three run-subject tokens; anything
          else, or an absent key, reads as the pre-split legacy Blueprint, which covers all three
          run subjects, so an older peer behaves exactly as before.
        optional: true
  - id: message-target
    name: MessageTarget
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          The resource class: Command | Event | Filesystem | Network | Process | Device | Secret |
          External. It decides which rules may answer at all — a Filesystem rule never decides a
          Command request, and a Process rule never decides a Device request.
      - name: name
        type: string
        description: >-
          The identity of the resource WITHIN `kind`, and nothing else: Command the bare SERVICE id
          (the command rides `verb`, and the joined "service:command" is never valid here); Event
          the full topic string; Filesystem the canonical absolute host path; Network the host or
          host:port; Process the command or environment-variable name; Device the device-endpoint
          name (gpu:0, comm:COM3, mmio:0xfe000000); Secret the secret_uuid (the class rides
          `class_uuid`); External the plugin system's own resource id.
      - name: namespace
        type: string
        description: Optional namespace qualifier (null when not applicable).
        optional: true
      - name: class_uuid
        type: string
        description: >-
          The target secret's class UUID — lets a Secret rule match class_pattern / assignable_to
          distinctly from the name-carried secret_uuid. Null for bus/fs targets.
        optional: true
      - name: verb
        type: string
        description: >-
          The action being taken on the resource: the COMMAND name for a bus Command (the enforcer
          fills it from the envelope's capability header, so a Bus rule can name one command and not
          only the service), or the access verb for the Filesystem / Network / Process / Device /
          Secret evaluators. Null for an Event, which has no action to constrain — and a verb-less
          target is admitted by every verb constraint.
        optional: true
      - name: flags
        type: list<string>
        description: Access flags (Filesystem / Secret evaluators). Null when not applicable.
        optional: true
    methods:
      - name: has_joined_name
        signature: has_joined_name() -> bool
        returns: bool
        description: >-
          Whether this target carries a client's TRANSPORT ADDRESS where its resource identity
          belongs — a Command whose `name` holds the joined "service:command" instead of the bare
          service. Answers only about Command targets on purpose: a colon is meaningful inside other
          classes' identities (a Network host:port, a Windows drive path), so a class-blind check
          would refuse well-formed targets. The answer is a REFUSAL, never a repair — splitting the
          name would silently decide that `Deny runtime:boot` meant `Deny runtime`, which turns one
          denial into an outage, or would widen an Allow to a whole service.
  - id: middleware-declaration
    name: MiddlewareDeclaration
    kind: value-object
    fields:
      - name: id
        type: string
        description: >-
          Stable middleware id (REQUIRED) — the handle for invoke(middleware_id, ...) and
          owner-keyed removal/deregistration (without it those paths can't address a registered
          middleware).
      - name: needs_payload
        type: bool
        description: Whether the pipeline must hand this middleware the message payload.
      - name: needs_headers
        type: bool
        description: Whether the pipeline must hand this middleware the headers.
      - name: priority
        type: int
        description: Chain priority band (lower runs earlier; the security enforcer is fixed first).
        optional: true
      - name: handler
        type: string
        description: >-
          The capability in the DECLARING PACKAGE'S OWN module that the host invokes for each
          matched envelope -- the address the port had no field for. The legacy ABI was
          `host_register_middleware(cap_ptr, cap_len)` ("register a bus middleware layer backed by a
          WASM capability in this module") and the migrated type carried id, needs_payload,
          needs_headers, filters, priority and target with nothing saying WHICH handler to call, so
          a declaration could register, list, and intercept nothing. That missing address is why the
          package port stayed a stub rather than being an oversight. NOT named `capability`:
          `filters.capability` already means the INTERCEPTED capability -- which call is being made
          -- and one word carrying two meanings in one type is exactly what `mode` and
          `filters.active` were. REQUIRED rather than optional, because a declaration with no
          handler is inert, and required stops being free the moment a bundle carries one. NOT
          cross-checked against the package's declared `capabilities`: a package's BUS-SERVED
          capabilities are served by its handler and never appear in that list, which is for
          capabilities a HOST registers, so such a rule would refuse the correct case. APPENDED LAST
          in the Rust rather than placed beside `id` where it reads best, because this type rides
          the positional bus encoding inside InstalledPackage.middleware and a field's slot is
          contract; the struct's field order is invisible to whoever authors a name-keyed JSON
          manifest.
      - name: scope
        type: middleware-scope
        description: >-
          What this middleware is allowed to see. Author-declared, node-validated,
          reviewer-rendered. A scope that narrows nothing and does not claim `everything` is REFUSED
          at the package enable and again at the chain, so a renderer is never handed a blank object
          that silently means everything -- absence and unrestricted are exactly the two readings a
          reviewer would confuse.
      - name: owner
        type: string
        description: >-
          The declaring package's non-forgeable bus IDENTITY (its fingerprint) -- the key the
          teardown cascade removes a layer by. HOST-STAMPED, never authored: it is overwritten
          unconditionally, because the declaration originates in the package's own manifest and an
          author naming another package as owner would make the layer unremovable by the real one.
          Optional on the wire because a manifest arrives without it; a declaration still carrying
          none at registration is REFUSED, since a layer nothing can key could never be taken off
          the chain.
        optional: true
      - name: owner_fqid
        type: string
        description: >-
          The declaring package's FQID -- its SERVICE NAME, which is what resolves its live actor.
          DISTINCT from `owner` because the two identifiers are not interchangeable and their
          consumers do not overlap: teardown keys on the identity, reaching the live package needs
          the fqid. Carrying only one means whichever consumer holds the wrong one resolves nothing,
          and "resolved nothing" is indistinguishable from "not installed". Host-stamped by the same
          single call that writes `owner`, so no call site can write one and forget the other.
        optional: true
      - name: required
        type: bool
        description: >-
          Can the PACKAGE run without this interceptor registering? Denied-or-unapproved and
          REQUIRED refuses the enable; optional skips this layer and reports. The same posture
          permission groups and fast-lane requests take, and absent means required because that is
          the fail-safe read of a declaration nobody updated. DISTINCT FROM kind, which the owner
          explicitly refused to fold together with it: required asks whether the package works
          without the layer, kind asks whether the layer's answer may stop a message -- one field
          answering two questions is the shape that produced this subsystem's defects. NOT in the
          consent digest: approval grants the same interception either way; required changes the
          cost of DENIAL, not the scope of consent. APPENDED -- positional MessagePack, field order
          is contract; serde-default true.
        optional: true
      - name: kind
        type: middleware-kind
        description: >-
          May this layer's VERDICT stop or alter a message? Enforcing (default) or Observing. The
          pipeline ENFORCES it rather than trusting the guest: an Observing layer's outcome is
          discarded, so it can neither Reject nor patch, and when its package crashes its messages
          proceed. IN the consent digest: v1 Observing and v2 Enforcing over the same scope would
          otherwise present an identical request, and an update would inherit consent for something
          strictly more powerful. APPENDED -- positional MessagePack; serde-default Enforcing.
        optional: true
      - name: consent_digest
        type: string
        description: >-
          The digest of what this declaration ASKS FOR, HOST-STAMPED for the same reason owner and
          owner_fqid are: a package does not compute the value its consent is checked against. It
          exists because a consumer could not otherwise answer 'has this changed since it was
          approved' without re-implementing the fold (hash, field order, encoding) in another
          language -- a second copy of one rule that fails silently in whichever direction it
          drifts. With it stamped, comparison against MiddlewareReview.consent_digest is string
          equality. handler is NOT in the digest (a package can change what its handler does without
          changing its name). Overwritten unconditionally by the host; nothing an author writes
          survives. APPENDED -- positional MessagePack; serde-default absent.
        optional: true
  - id: middleware-kind
    name: MiddlewareKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: 'The variant: Enforcing (default) | Observing.'
  - id: middleware-outcome
    name: MiddlewareOutcome
    kind: value-object
    fields:
      - name: kind
        type: string
        description: Continue | ShortCircuit.
      - name: patch
        type: header-patch
        description: Header mutations applied on Continue.
        optional: true
      - name: response
        type: any
        description: The short-circuit response payload.
        optional: true
  - id: middleware-review
    name: MiddlewareReview
    kind: value-object
    fields:
      - name: id
        type: string
        description: The declaration this decides, matching MiddlewareDeclaration.id within the package.
      - name: review
        type: review-state
        description: >-
          Pending, Approved or Rejected. Absence from the list is a fourth state -- never presented
          -- and deliberately not a variant: a package that was never reviewed has no record, which
          differs from one reviewed and left undecided.
      - name: consent_digest
        type: string
        description: >-
          The digest of what was DECIDED ABOUT (MiddlewareDeclaration::compute_consent_digest: scope
          folded with kind). Carried for a rejection as well as an approval: a package asking again
          for exactly what was refused should not re-present as new, and one asking for something
          different should.
      - name: approved_scope
        type: middleware-scope
        description: >-
          The scope AS IT WAS when the decision was taken. A SNAPSHOT, NEVER AN INPUT TO MATCHING --
          the matcher reads the live declaration, always; history cannot drift from the present the
          way a duplicate can, and the point is to show where they differ. It exists because a
          digest is one-way: from a digest alone a surface can say 'this differs from what you
          approved' but never 'you approved db.*, it now intercepts db.read only', and only the
          second makes a NARROWING legible -- a package that quietly stopped intercepting what it
          was installed to intercept is an auth package that is not checking anything. The whole
          scope rather than a summary, because a summary would be a third representation of scope
          with its own rendering rules and its own way to be subtly wrong.
  - id: middleware-scope
    name: MiddlewareScope
    kind: value-object
    fields:
      - name: commands
        type: command-scope
        description: Command interception. ABSENT = never sees a command.
        optional: true
      - name: events
        type: event-scope
        description: >-
          Event interception. ABSENT = never sees an event. Separate from commands because it is a
          separate consent: knowing which events a service subscribes to is enough to change its
          behaviour by patching or withholding them, so this is never acquired by leaving a topic
          list empty inside a command scope.
        optional: true
      - name: headers
        type: list<header-predicate>
        description: Conditions on the arriving headers, applied to commands and events alike.
      - name: active
        type: bool
        description: >-
          The author's own on/off toggle. Honoured by BOTH chains; it used to disable a layer on one
          and not the other.
  - id: migration-step
    name: MigrationStep
    kind: value-object
    fields:
      - name: step
        type: string
        description: The step tag — AddCollection | AddIndexedField | DropIndexedField.
      - name: collection
        type: string
        description: The target collection.
      - name: field
        type: field-def
        description: >-
          The field to add (AddIndexedField; AddCollection carries its initial field set per
          engine).
        optional: true
      - name: field_name
        type: string
        description: The field to drop (DropIndexedField).
        optional: true
  - id: minor-version
    name: MinorVersion
    kind: value-object
    fields:
      - name: value
        type: int
        description: The minor version number.
  - id: module-group
    name: ModuleGroup
    kind: value-object
    fields:
      - name: module_id
        type: string
        description: >-
          The module's stable identity within one response, and the key a consumer joins a
          capability to.


          UNIQUE WITHIN ONE RESPONSE, and what guarantees that differs by source, which a consumer
          has to know:
            * A NAMESPACE-ROOTED module (`stdlib`, `current_crate`, `workspace_crate`, `package_crate`) uses the FQID PREFIX its capabilities share — `std.flow`, `std.String`, a crate's root path. Unique because it is a path, and matched by the searches with `starts_with`.
            * A `package_native` module uses the OWNER FQID instead, and NOT a prefix. A native package's capability fqids need not sit under its own fqid at all — `syw.system.ledger` declaring `rows.query` — so the prefix is not the owner, and worse, two packages under one root (`syw.system.ledger` with `rows.query` beside `acme.rowkit` with `rows.insert`) share the prefix `rows` and would collide here, breaking the uniqueness this field promises. The owner is unique by construction because the installer stamps it from the installing fqid.

          SO DO NOT DERIVE THE JOIN FROM THIS FIELD. `source.kind` names the search and the filter —
          see ModuleSource's search selector. The trap is specifically `package_crate`: it is a
          package's module AND it is joined by `module`, not by `package_id`, because its contents
          are blueprints and `blueprints-capability-search` has no `package_id` filter. A consumer
          that branched on "came from a package -> package_id" would get an empty page for every
          Waffler-content module and read it as missing content rather than as a wrong join.
      - name: display_name
        type: string
        description: >-
          What the palette shows for the group. Distinct from `module_id` on purpose: it is the one
          place a module can be PRESENTED under a root it is not STORED under, which is how a frozen
          persisted id can still read as `std.*` to an author without a data migration — the hook
          the stdlib namespace migration uses. For a native package it is the human-facing package
          name rather than the capability prefix, since the prefix may be shared with another
          publisher's package.
      - name: source
        type: module-source
        description: >-
          Where this module came from, and — through `kind` — which `CapabilitySearchQuery` filter
          reaches its contents. See ModuleSource for why it is declared here rather than derived
          from `module_id` by the reader.


          SPELLED AS THE BARE TYPE NAME, not `shared.ModuleSource`. The dotted form was used here
          once and resolved to NOTHING: a sibling type is referenced by its bare name
          (`AccessLevel`, which resolves to the spec whose id is `access-level`) or by its kebab id
          inside a generic (`Vec<exec-pin>`). A dotted prefix is neither, so the reference dangled
          and dropped this type out of the comparable set — which is what turned waffler_ui's
          `wire:specrefs` and `roots-and-facts` gates red while every file involved was present and
          correct.
  - id: msg-pack
    name: MsgPack
    kind: value-object
    fields:
      - name: value
        type: bytes
        description: The MessagePack-encoded bytes.
  - id: namespace-event
    name: NamespaceEvent
    kind: value-object
    fields:
      - name: kind
        type: string
        description: registered | deleted | updated | moved.
      - name: uuid
        type: any
        description: The affected segment's uuid.
      - name: detail
        type: any
        description: Change payload (entity_type, old_fqid/new_fqid, parent deltas, trigger).
  - id: namespace-segment
    name: NamespaceSegment
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: Stable UUID-primary key (survives technical-name/FQID changes).
      - name: technical_name
        type: string
        description: The identifier-safe segment name (the folder basename).
      - name: display_name
        type: string
        description: Human-readable name (defaults to technical_name).
      - name: entity_type
        type: namespace-entity-type
        description: The semantic type of this segment.
      - name: created_at
        type: string
        description: >-
          ISO-8601 creation timestamp — generated by namespaces (the documented authority) at
          create_storage and persisted in the .ns SegmentManifest; carried on the identity wire.
      - name: parent_uuid
        type: string
        description: Parent segment UUID; null for a top-level root entity.
        optional: true
      - name: full_path
        type: string
        description: The FQID dotted path (mutable; DERIVED — resolved lazily UUID->FQID on read, not stored).
      - name: tags
        type: list<string>
        description: Free-form tags.
      - name: source
        type: string
        description: >-
          The never-merged volume the segment lives in ("Library" read-only / "Workspace"
          read-write) — carried on the wire so consumers know the volume (immutability is
          SOURCE-based). Derived at scan from which volume root found the segment; not a .ns column.
  - id: native-access-kind
    name: NativeAccessKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: Pure | Filesystem | Network | Process | Device | Console.
  - id: native-access-request
    name: NativeAccessRequest
    kind: value-object
    fields:
      - name: kind
        type: native-access-kind
        description: Which host resource class this act reaches.
      - name: target
        type: string
        description: >-
          The resolved concrete target: a canonical absolute path (Filesystem), a host or host:port
          (Network), a variable name or command (Process), a device-endpoint name such as gpu:0 /
          comm:COM3 / mmio:0xfe000000 (Device), a standard-stream name in | out | err (Console).
          Empty means the target could not be resolved — or, for Device, that the declaring
          capability exposed no string input carrying its endpoint — which only an unconstrained
          rule can cover.
      - name: verb
        type: fs-verb
        description: >-
          The act's verb token (Read | Write | List | Stat | CreateDir | Connect | Listen | Spawn |
          ReadEnv | WriteEnv, plus whatever verb a package declares for a Device act). Console
          reuses Read and Write — the direction is the whole of what a console act does, and reading
          a password is the same REACH as reading a name, so it is not split off into a verb of its
          own. FsVerb is reused as the rule verb token across all five gated classes so
          RulePattern.verbs needs no wire change.
  - id: native-capability-class
    name: NativeCapabilityClass
    kind: value-object
    fields:
      - name: kind
        type: native-access-kind
        description: >-
          The host resource class this capability reaches; Pure means it reaches nothing and is
          never gated.
      - name: verb
        type: string
        description: >-
          The rule verb this capability requests (matched against RulePattern.verbs/verb). Absent
          means the capability requests any verb, so only a verb-unconstrained rule covers it.
        optional: true
      - name: target_input
        type: string
        description: >-
          The NAME of the entry in PackageCapability.inputs whose value carries the concrete target
          (path / host / command / device endpoint). Resolved to a positional argument index once,
          at attach.
        optional: true
      - name: device_class
        type: string
        description: >-
          The DEVICE CLASS a Device capability's targets are named in — the left axis of the
          two-axis Device target grammar `<device_class>:<endpoint>`, which the gate composes rather
          than reading off a call argument. Must be a non-empty token containing neither ':' (which
          would graft the capability into another class's endpoint space) nor '*' (which would let a
          declaration spell itself as the wildcard an operator writes). Ignored for every other
          kind, whose targets are already whole. Absent or malformed on a Device capability is a
          refusal of every call it makes, not an empty target. Wire slot 3, trailing default: a
          record written before this field decodes with no class.
        optional: true
  - id: native-handle
    name: NativeHandle
    kind: value-object
    fields:
      - name: resource_type
        type: string
        description: >-
          The native resource kind (e.g. tensor, model, dataset, stream) - keys the provider's drop
          primitive.
      - name: handle
        type: string
        description: >-
          The opaque native reference token (the runtime maps it to the actual native pointer);
          never inspected by core.
      - name: provider
        type: string
        description: >-
          The owning package principal — so the runtime resolves THIS package's drop primitive to
          free the resource on Value-drop. It is a ROUTING input, not only an authorization one:
          drop_native_handle resolves the dropper by SecurityPrincipal{Package, provider} +
          resource_type, so a value carrying a chosen provider would invoke THAT package's drop fn,
          and the package's own `provider ==` gate would then pass because the provider was chosen
          to match. The field SURVIVES the wire (it is an envelope field, unlike
          heap_ref/fn_handle/bound_recv/captured_env), so it arrives as whatever the sender wrote
          and is only TRUE where the reading seam attested it against an identity it independently
          knew. One seam does: the package-primitive return (runtime-native-primitive-host
          bind_symbol's trampoline), which refuses a provider other than the fqid of the package
          whose module it just called. A handle lifted anywhere else — a bus reply, an
          execute_blueprint self_receiver, an invoke_method instance — is an unattested claim.
      - name: dlpack
        type: any
        description: >-
          Optional DLPack descriptor (dtype, shape, strides, device, data_ptr) for zero-copy
          interchange with torch/numpy/JAX/candle. Absent for non-tensor native resources.
        optional: true
      - name: version
        type: string
        description: Optional capability/binding version (for @v-tagged coexistence).
        optional: true
  - id: native-primitive
    name: NativePrimitive
    kind: value-object
    fields:
      - name: primitive_id
        type: string
        description: >-
          The stable primitive id bound into the Wack cache (keys the fn-ptr); matches the
          AuthoringNode capability fqid — the DOTTED namespace.verb form (e.g. io.read, mmio.map,
          cpu.x86.read_cr), NOT a legal C export symbol. Resolved to a fn-ptr via c_symbol, never
          dlsym'd directly.
      - name: c_symbol
        type: string
        description: >-
          The C-ABI export symbol in the loaded DLL that realizes this primitive — the underscore
          form the native adapter actually dlsyms. The fqid->c_symbol bridge lives HERE (the
          provider's manifest), so resolve_fn never tries to dlsym the dotted fqid, and so no
          consumer has to re-derive it. Distinct from primitive_id (the Wack cache key). **IT IS NOT
          A TRANSFORM OF THE FQID, AND THIS FIELD'S OWN EXAMPLE USED TO IMPLY IT WAS: the example
          read `io_read for io.read`, and io.read's real export is `read_io`.** Some providers do
          spell it as the dotted id with dots replaced by underscores (mmio.map -> mmio_map,
          mmio.read -> mmio_read), and that coincidence is what makes the wrong reading survive;
          ELEVEN CAPABILITIES ACROSS FOUR PACKAGES DIVERGE — io.read -> read_io, io.write ->
          write_io, timer.clock_now -> clock_now, timer.delay -> delay, sync.atomic_add ->
          atomic_add, sync.atomic_cas -> atomic_cas, sync.barrier -> barrier, interrupt.register_isr
          -> register_isr, interrupt.enable_irq -> enable_irq, interrupt.disable_irq -> disable_irq,
          interrupt.clear_pending -> clear_pending. A consumer that derived the symbol would name an
          export no DLL has, and would name it PLAUSIBLY, which is the whole reason this is a
          declared field.
      - name: fn_ptr
        type: string
        description: >-
          Opaque handle to the C-ABI function pointer in the loaded DLL (resolved by the native
          adapter via dlsym(c_symbol)); never inspected by core.
      - name: resource_type
        type: string
        description: >-
          The native resource kind this primitive produces (e.g. RegionHandle, BufferHandle,
          DmaBufferHandle, TensorHandle) — keys the drop primitive for NativeHandle teardown. Set on
          resource-producing primitives; absent for stateless/ambient ones.
        optional: true
      - name: drop_fn
        type: string
        description: >-
          The C-ABI drop-symbol (the native-adapter drop_handle export) that frees this primitive's
          resource_type on Value-drop. Carried into register_native_primitive so the Wack seeds its
          (owner, resource_type) -> drop_fn dropper map. Set together with resource_type on
          resource-producing primitives; absent otherwise.
        optional: true
  - id: node
    name: Node
    kind: value-object
    fields:
      - name: id
        type: node-id
        description: Node id.
      - name: designer
        type: node-designer
        description: UI metadata.
      - name: operation
        type: operation-reference
        description: The capability this node invokes.
      - name: inputs
        type: map<string, input-value>
        description: Input pin values (static/expression/variable).
      - name: store_result
        type: variable-mapping
        description: Where this node's output is stored (the hidden set_variable target).
        optional: true
      - name: outputs
        type: map<string, connection>
        description: Output connector -> downstream edge.
      - name: timeout_ms
        type: int
        description: Per-node capability timeout (ms); None = runtime default (30s).
        optional: true
      - name: enable_error_handler
        type: bool
        description: >-
          RT-20: wrap this node in a trap so a failure routes to the error-handler branch instead of
          aborting the run. Default false.
        optional: true
      - name: await_result
        type: bool
        description: >-
          RT-20: whether the node's async/Promise result is awaited before continuing (true) or
          fired and continued (false). Default true.
        optional: true
  - id: node-capability-manifest
    name: NodeCapabilityManifest
    kind: value-object
    fields:
      - name: capability_id
        type: string
        description: >-
          The capability's fully-qualified id (e.g. std.flow.for; a class-method fqid; a blueprint
          fqid). The flow root is std.flow.
      - name: kind
        type: string
        description: 'The capability kind / source: flow | primitive | blueprint | class_method.'
      - name: display_name
        type: string
        description: Palette display name.
      - name: icon
        type: string
        description: Palette icon id/name.
        optional: true
      - name: color
        type: string
        description: Palette accent color.
        optional: true
      - name: category
        type: string
        description: Palette category/grouping.
      - name: keywords
        type: list<string>
        description: Search keywords/aliases.
        optional: true
      - name: input_contracts
        type: list<form-field>
        description: >-
          Data input pins (one FormField per input). A pin's FormField carries is_self when it is
          the RECEIVER, which for a receiver-shaped capability is the LEADING pin.
      - name: exec_pins
        type: list<exec-pin>
        description: Execution/branch output pins (then/else/body/case_n/...; a plain node has just `next`).
      - name: output_contracts
        type: list<form-field>
        description: Data output pins (one FormField per output).
      - name: config_contracts
        type: list<form-field>
        description: >-
          The configuration form fields (flow modes, variable names, case lists, ...) the
          DynamicForm renders; authors the typed config (the *-config).
  - id: node-execution-record
    name: NodeExecutionRecord
    kind: value-object
    fields:
      - name: node_uuid
        type: string
        description: The node this record is for.
      - name: step_seq
        type: int
        description: >-
          The authoritative monotonic replay/order key (replaces scope_id ordering) — distinct per
          node execution so loop iterations + subroutine re-entries order correctly.
      - name: started_at
        type: datetime
        description: When the node started.
        optional: true
      - name: timestamp
        type: datetime
        description: Completion timestamp.
      - name: status
        type: node-execution-status
        description: Completed | Failed.
      - name: error
        type: string
        description: Error message if failed.
        optional: true
      - name: inputs
        type: list<any>
        description: >-
          Evaluated inputs as ordered (name, value) pairs (redacted) — SPEC_EXECUTION_LOG
          Vec<(String,Value)>.
      - name: output
        type: any
        description: Raw output value.
        optional: true
      - name: execution_id
        type: any
        description: >-
          The execution (run) this record belongs to — added so .logs records are filterable
          per-execution (list/replay/get_node_execution_trace key on { blueprint_uuid, execution_id
          }); nil for legacy records serialized before this field existed (serde default
          back-compat).
      - name: context_delta
        type: map<string, any>
        description: >-
          The variables this node changed, and their values afterwards — ReplayStep's context_delta,
          and the ONLY thing TraceLevel::Full captures that Nodes does not. None at every level that
          does not capture a delta (TraceLevel::captures_context_delta is the authority), and None
          is NOT 'this node changed nothing': a node that ran under Nodes was never asked the
          question. An EMPTY map is the answer that means nothing changed. WHICH variables depends
          on the level: at Full, NAMED variables only (scratch slots are deliberately absent — the
          compiler lowers every intermediate expression to a $tmp, so including them would bury one
          real assignment under the temporaries that computed it); at Expressions, the $tmp scratch
          slots TOO, because a developer debugging an expression wants precisely them
          (TraceLevel::captures_scratch_slots is that exclusion's switch). A reader cannot tell the
          two apart from the map alone; the run's trace_level is what says which question was asked.
          Values are WIRE ENVELOPES, exactly as inputs and output carry them, so the one redaction
          pass in redact_record covers all three rather than two of them. Appended LAST and
          serde(default): this is a positional-MessagePack codebase, so a new field only ever goes
          on the end and an older .logs record decodes with None.
        optional: true
  - id: node-execution-trace
    name: NodeExecutionTrace
    kind: value-object
    fields:
      - name: blueprint_uuid
        type: string
        description: The blueprint the run belongs to (UUID).
      - name: execution_id
        type: string
        description: The projected run (UUID).
      - name: nodes
        type: list<node-trace-entry>
        description: Per-node IO entries projected onto the visual graph.
      - name: path
        type: list<string>
        description: The ordered execution path as visited node UUIDs.
  - id: node-identity
    name: NodeIdentity
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: The node instance UUID (v7).
      - name: name
        type: string
        description: The node name.
      - name: version
        type: string
        description: The node version.
  - id: node-step-event
    name: NodeStepEvent
    kind: value-object
    fields:
      - name: execution_id
        type: any
        description: The execution this step belongs to.
      - name: node_id
        type: string
        description: The blueprint node that executed.
      - name: io
        type: any
        description: The executed branch + pin-labelled inputs/outputs for this node.
  - id: notify
    name: Notify
    kind: value-object
    fields:
      - name: kind
        type: string
        description: The notification kind.
      - name: payload
        type: any
        description: The notification body.
        optional: true
  - id: open-handle
    name: OpenHandle
    kind: value-object
    fields:
      - name: handle
        type: handle-id
        description: The opaque open-file handle id.
      - name: size
        type: int
        description: The file size in bytes known at open time.
  - id: operation-reference
    name: OperationReference
    kind: value-object
    fields:
      - name: developer_id
        type: string
        description: Owning developer/package id.
        optional: true
      - name: module
        type: string
        description: Capability module (service) name.
      - name: capability
        type: string
        description: Capability/command name.
      - name: category
        type: string
        description: UI category.
        optional: true
      - name: version
        type: string
        description: Pinned capability_version (one version per capability per blueprint).
        optional: true
  - id: owned-dir-kind
    name: OwnedDirKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: 'The owned-directory kind variant tag: Data | ProjectData | EntityConfig.'
  - id: owned-method-blueprint
    name: OwnedMethodBlueprint
    kind: value-object
    fields:
      - name: owner_class_uuid
        type: any
        description: The owning class/interface uuid.
      - name: blueprint_uuid
        type: any
        description: The implementing blueprint's uuid.
  - id: pack-options
    name: PackOptions
    kind: value-object
    fields:
      - name: compile_missing
        type: bool
        description: >-
          Compile any stale/missing .compiled members on the fly during pack instead of failing
          (default false = fail-fast on uncompiled content).
        optional: true
      - name: run_tests
        type: bool
        description: >-
          Run the crate's test suite during pack instead of only checking the recorded pass status
          (default false). Never bypasses the test gate.
        optional: true
      - name: version
        type: string
        description: The package version to stamp; if absent, derived/incremented from the crate.
        optional: true
  - id: pack-result
    name: PackResult
    kind: value-object
    fields:
      - name: archive
        type: bytes
        description: >-
          The signed, custody-sealed package ZIP bytes (the exact format the packages staged-ingest
          consumes).
      - name: package_fqid
        type: string
        description: The derived package identity (from the crate).
      - name: version
        type: string
        description: The stamped package version.
  - id: package-capability
    name: PackageCapability
    kind: value-object
    fields:
      - name: fqid
        type: string
        description: >-
          The capability's fully-qualified id (the addressable capability name; version-routed
          patch->minor).
      - name: version
        type: string
        description: The capability's SemVer (capability-version routing via the shared Capability Registry).
      - name: kind
        type: capability-kind
        description: Which host surface this capability extends (CapabilityKind).
      - name: target_host
        type: service-name
        description: >-
          The host service this capability attaches to (ServiceName — transpiler | runtime-wack |
          sdk-capability-registry | frontend | message-bus | external).
      - name: artifact_ref
        type: artifact-ref
        description: >-
          The bundled artifact that realizes this capability (e.g. a RuntimePrimitive's DLL, a
          UiPlugin's bundle). Absent for declarative AuthoringNodes or a TranspileBackend composed
          from an in-tree Waffler subsystem.
        optional: true
      - name: inputs
        type: list<form-field>
        description: >-
          The ORDERED parameter list — the calling contract, the same (inputs, output) shape a
          WafflerSignature carries. ORDER IS LOAD-BEARING: it is the positional argument order the
          realizing primitive reads. Without it NodeCapabilityManifest.input_contracts had nothing
          to build from, so a package node reached the designer with NO PINS and the compiler fell
          back to sorting pin names alphabetically — a convention no callee ever agreed to. INLINE
          rather than a ref to a shipped signature entity, because the contract must be covered by
          the bundle SIGNATURE, readable at INSTALL time (the capability index is built before
          Library discovery), and valid with no other entity present; a pointer satisfies none of
          the three. serde(default): a record written before this field decodes with an EMPTY
          contract, which keeps already-installed packages loadable at boot. Empty means UNDECLARED.
      - name: output
        type: form-field
        description: The declared return value; absent = this capability returns nothing.
        optional: true
      - name: metadata
        type: capability-metadata
        description: >-
          Designer / form-renderer hints (CapabilityMetadata) — icon, category, config fields, the
          native node_descriptor. Deliberately NOT the calling contract: rendering hints and a
          callable signature answer different questions, and conflating them is what left the
          contract with nowhere to live. Sits AFTER inputs/output on the wire (slot 7) — it was
          pushed back from slot 5 when they were added, and a decoder still reading slot 5 as
          metadata reads the calling contract under the wrong name. Carries NO serde(default), so it
          is the last always-present slot and the trailing-default run starts at 8 — which is why a
          decoder accepts 8, 9 or 10 elements and refuses 11.
        optional: true
      - name: security
        type: native-capability-class
        description: >-
          The DECLARED security class of the host reach this capability performs — the grant side of
          the calling contract. Present = the package states what it touches (Pure | Filesystem |
          Network | Process | Device, its verb, and which input pin carries the concrete target),
          and the runtime gates it against the firewall rules the user granted its principal. ABSENT
          = UNDECLARED, which is deliberately NOT read as Pure: a package native primitive runs
          in-process with the node's own OS privileges, so silence is treated as dangerous and the
          call is refused unless an explicit grant covers it. serde(default) at slot 8: a record
          written before this field decodes as undeclared, which is the safe reading, not the
          convenient one — an already-installed package whose capability declares nothing keeps
          loading but must be granted before its primitive may reach the host. Always EMITTED (a
          plain serde(default), no skip), which is what makes owner below the ONLY skippable field
          and therefore unambiguous.
        optional: true
      - name: owner
        type: string
        description: >-
          The PROVIDING PACKAGE's fqid. DECLARED AND NOT YET POPULATED (slot 9, last). A capability
          that cannot name its provider is incomplete: at the places a capability is DETACHED from
          its parent record it is still a capability, and what it lost it must carry. The SDK's boot
          path had to GUESS it as the first dot-segment of the CAPABILITY's fqid — a publisher ROOT
          NAMESPACE naming every package that publisher ships — so the detach cascade could not
          remove what the boot path registered. It is an AUTHORITY KEY: consumers authorize
          unregister_capability / remove_interceptor / list_by_owner on it, so an author-supplied
          value out of a signed .manifest would file a registration under a victim. It is therefore
          HOST-STAMPED from the record's own fqid at BOTH doors — install and hydration read-back —
          because a record restored from disk is untrusted too. NOT optional: a host-stamped String
          has no representable 'unknown', and None would invite 'unknown, so derive it', which is
          the guess being removed. serde(default) + skip_serializing_if = String::is_empty holds the
          EMITTED arity at 9 while the field is empty, so a deployed decoder is untouched while the
          DECLARATION lets a consumer's codegen generate the 9..10 decoder — a consumer cannot widen
          a decoder it generates from a field that does not exist yet. Sound only while this is LAST
          and the ONLY skippable field: two trailing skippables would make one length ambiguous
          between two layouts. Populating it and REMOVING the skip are one commit, so the break is
          deploy-triggered and uniform rather than data-triggered and latent.
  - id: package-consent
    name: PackageConsent
    kind: value-object
    fields:
      - name: enabled
        type: bool
        description: Whether an operator enabled it. Unreadable reads DISABLED.
      - name: approved_group_ids
        type: list<string>
        description: >-
          The permission-group ids an operator approved. Unreadable reads NOTHING APPROVED, so a
          package's required groups must be approved again rather than inherited from its own
          manifest - a package approving its own groups by restart is the failure this prevents.
      - name: signed_by
        type: string
        description: >-
          Which trust anchor verified the bundle. Unreadable reads NOT RECORDED. It cannot ride the
          manifest, because a bundle naming its own verifier is a publisher vouching for itself.
        optional: true
      - name: middleware_reviews
        type: list<middleware-review>
        description: >-
          What was decided about each declared interceptor. Unreadable reads NEVER REVIEWED, and
          absence from the list is itself a state: a declaration never presented has no record,
          which is not the same as one presented and refused.
  - id: package-dependency
    name: PackageDependency
    kind: value-object
    fields:
      - name: name
        type: string
        description: The dependency package name.
      - name: version_req
        type: string
        description: The semver version requirement/range.
  - id: package-keypair
    name: PackageKeypair
    kind: value-object
    fields:
      - name: public_key
        type: string
        description: The Ed25519 public key.
      - name: private_key
        type: string
        description: The Ed25519 private key (owner-held only).
        optional: true
  - id: package-supervision
    name: PackageSupervision
    kind: value-object
    fields:
      - name: consecutive_faults
        type: int
        description: >-
          Consecutive faulted starts. Reset by a clean run of CLEAN_RUN_RESET_MS before the fault —
          measured as UPTIME, not wall-clock since the last fault, because a package held DOWN for
          ten minutes has not run cleanly, it has been off, and reading the clock alone would reset
          the streak of exactly the package that keeps failing. Also reset by an operator enabling
          the package, which is them giving it its chances back.
      - name: unreliable
        type: bool
        description: >-
          Whether the node has given up starting it by itself, after UNRELIABLE_FAULT_THRESHOLD
          consecutive faulted starts. An unreliable package is DISABLED — the one point where the
          enabled flag moves, because every fault before it deliberately left the package enabled so
          the next boot would try again.
      - name: reason
        type: string
        description: >-
          Why it was marked, in the node's own words, for the operator being asked to acknowledge
          it. Carried into the refusal text, because an operator told only 'unreliable' has to go
          looking for why, and the point of the gate is that they see it. Empty until something goes
          wrong.
  - id: park-target
    name: ParkTarget
    kind: value-object
    fields:
      - name: kind
        type: string
        description: Promise | Timer | Signal.
      - name: handle
        type: string
        description: The handle/id of the awaited resource.
  - id: parsed-expression
    name: ParsedExpression
    kind: value-object
    fields:
      - name: tokens
        type: list<expression-token>
        description: The token stream.
      - name: raw
        type: string
        description: The raw expression source.
  - id: part-entry
    name: PartEntry
    kind: value-object
    fields:
      - name: name
        type: string
        description: The entry name within the folder part.
      - name: is_dir
        type: bool
        description: Whether the entry is a directory (false for a flat blob entry).
  - id: part-name
    name: PartName
    kind: value-object
    fields:
      - name: value
        type: string
        description: The part name / key within an entity's storage.
  - id: part-ref
    name: PartRef
    kind: value-object
    fields:
      - name: name
        type: string
        description: The part name/key within the entity's storage.
  - id: peer-identity
    name: PeerIdentity
    kind: value-object
    fields:
      - name: service
        type: string
        description: The peer's service name.
      - name: fingerprint
        type: fingerprint
        description: The peer's Ed25519 fingerprint.
  - id: permission-adjustment-check
    name: PermissionAdjustmentCheck
    kind: value-object
    fields:
      - name: ok
        type: bool
        description: >-
          True exactly when `refusals` is empty — the adjustment set would be accepted by a boot of
          this crate as it is declared right now.
      - name: refusals
        type: list<permission-adjustment-refusal>
        description: >-
          Every refusal, in the order the boot would encounter them: the whole-set checks first
          (unknown group, duplicate adjustment), then each declared group in declaration order. The
          first entry is therefore the exact error crates:boot would return.
      - name: sensitivity
        type: list<permission-group-sensitivity>
        description: >-
          The derived sensitivity of each permission group this adjustment set WOULD LEAVE STANDING
          — one entry per effective group, in declaration order, each carrying every reason the
          group is consequential (an empty reasons list means examined and nothing found). IT
          DESCRIBES THE EFFECTIVE DECLARATION, NOT THE DECLARED ONE: a declined group is absent and
          a rule narrowed away from the vault stops carrying the credential reason, so an operator
          tightening a group watches the reason they were worried about disappear — which is what
          makes the mark actionable rather than decorative. ABSENT means NOT COMPUTED and is not the
          same as an empty list: it is absent exactly when ok is false, because a refused adjustment
          set resolves to no effective declaration at all and answering with an empty list would say
          'examined, nothing found' about a state that was never examined. NOTHING HERE IS
          AUTHOR-SETTABLE — every reason is derived at review time from what the rules authorize,
          and a crate cannot write, suppress or influence a single entry.
        optional: true
  - id: permission-adjustment-refusal
    name: PermissionAdjustmentRefusal
    kind: value-object
    fields:
      - name: group_id
        type: string
        description: >-
          The declared group the refusal is about — always set, because every refusal is reached
          through an adjustment and an adjustment always names a group.
      - name: rule_index
        type: float
        description: >-
          The 0-based index of the declared rule the refusal is about, when the refusal is about one
          rule (NotANarrowing, RuleIndexOutOfRange, DuplicateNarrowing). Null when the refusal is
          about the group as a whole (UnknownGroup, DuplicateAdjustment, RequiredGroupDeclined) — an
          editor renders those on the group, not on a row.
        optional: true
      - name: code
        type: string
        description: >-
          The machine-readable reason, one of the closed set named in the type description, so a
          client can branch on it.
      - name: message
        type: string
        description: >-
          The refusal in words — the SAME sentence the boot would have failed with, so a user who
          sees it in the editor and a user who sees it in a boot log are reading one message.
  - id: permission-catalog
    name: PermissionCatalog
    kind: value-object
    fields:
      - name: groups
        type: list<stored-permission-group>
        description: The authoring groups (only Approved flatten).
      - name: bindings
        type: list<binding>
        description: The group -> principal-pattern bindings (only approved flatten).
  - id: permission-effect
    name: PermissionEffect
    kind: value-object
    fields:
      - name: value
        type: string
        description: Allow | Deny.
  - id: physical-ref
    name: PhysicalRef
    kind: value-object
    fields:
      - name: storage_route
        type: string
        description: The storage provider/route key that owns this physical location.
      - name: path
        type: string
        description: The host path, when the provider is path-based (absent for non-path-based storage).
        optional: true
  - id: policy-epoch
    name: PolicyEpoch
    kind: value-object
    fields:
      - name: boot
        type: int
        description: >-
          A random nonce minted when the rule store is built. Two different boots are incomparable,
          and the consumer re-pulls.
      - name: seq
        type: int
        description: Advanced by every replace of the active rule set.
      - name: secret_seq
        type: int
        description: Advanced only when the Secret-kind subset, in priority order, differs from the one held.
  - id: policy-snapshot
    name: PolicySnapshot
    kind: value-object
    fields:
      - name: rules
        type: list<firewall-rule>
        description: The priority-ascending firewall rules (first-match-wins, §8.1 semantics).
      - name: epoch
        type: policy-epoch
        description: >-
          The policy epoch these rules belong to, read together with them under one lock: the
          generation an enforcer compares before trusting its copy.
  - id: primitive-fn
    name: PrimitiveFn
    kind: value-object
    fields:
      - name: symbol
        type: string
        description: The native (C ABI) symbol name resolved from the package DLL.
  - id: primitive-id
    name: PrimitiveId
    kind: value-object
    fields:
      - name: value
        type: string
        description: The stable primitive registry id.
  - id: producer-list-response
    name: ProducerListResponse
    kind: value-object
    fields:
      - name: class_uuid
        type: string
        description: The class the producers construct.
      - name: producers
        type: list<producer>
        description: >-
          The construction descriptors (constructor / default_constructor / static_factory /
          instance_method).
  - id: promise-resolver
    name: PromiseResolver
    kind: value-object
    fields:
      - name: target
        type: string
        description: Opaque reference to the parent promise slot this resolver settles.
  - id: publisher-lineage
    name: PublisherLineage
    kind: value-object
    fields:
      - name: links
        type: list<lineage-link>
        description: >-
          Each rotation in order, oldest first. The chain must START at the key the node has pinned
          and END at the key that signed this bundle -- without the second check a bundle could
          carry a valid lineage to some other key and be signed by a third, and the lineage would
          verify while proving nothing about the signer.
  - id: publisher-pin
    name: PublisherPin
    kind: value-object
    fields:
      - name: fqid
        type: string
        description: The package this pin belongs to.
      - name: public_key
        type: bytes
        description: The publisher's Ed25519 verifying key, raw (32 bytes).
      - name: first_seen_via
        type: string
        description: >-
          The trust anchor that countersigned the bundle this pin was established from. NOT
          derivable from the key, which is why it is stored: it says on whose word this node first
          accepted this publisher, and a rotation review needs that answerable a year later.
      - name: first_seen_at
        type: string
        description: >-
          When the pin was recorded. The FIRST sighting, never refreshed on a later match -- a pin
          that silently updated its own date would erase the only evidence of when trust was
          established, and a rotation is only interpretable against who was trusted originally. THE
          EXACT SHAPE IS PART OF THE CONTRACT, because a consumer sorted on it and the sort
          inverted: nanosecond precision with a NUMERIC offset, never Z
          (`2026-09-10T20:37:28.507714578+00:00`). Valid RFC 3339, and a foot-gun for the reasonable
          habit of comparing RFC 3339 strings lexically, which works only while every value shares
          one shape -- mixed with browser-produced `...507Z` the comparison inverts, since Z sorts
          after any digit and the later instant reads as earlier. Deliberately NOT canonicalised to
          Z: rows already on disk carry this shape, so changing the producer would put BOTH shapes
          in one store and move the same defect from a boundary into persisted data. Consumers
          canonicalise on ingest. Nothing in core compares these -- every time-ordering here sorts a
          typed or numeric value, never a string.
      - name: next_key_digest
        type: bytes
        description: >-
          The SHA-256 digest of the ONLY key permitted to succeed public_key, when the publisher has
          committed to one (KERI pre-rotation). THE FIELD LAYER 2 CANNOT EXIST WITHOUT: the rotation
          verifier has always taken and returned a commitment, and without somewhere to hold it
          between two runs it did not survive a restart -- and a commitment that does not survive a
          restart is not a commitment. IMMUTABLE once made. It moves when the committed key is USED
          to rotate, and nowhere else: a bundle signed with the CURRENT key may not replace it,
          because the current key is precisely the thing being stolen, and a commitment its own key
          can rewrite protects against nothing. A package that has committed may also never stop
          committing -- dropping it would turn a recoverable compromise back into an unrecoverable
          one.
        optional: true
      - name: rotated_from
        type: bytes
        description: >-
          The publisher key this pin most recently REPLACED, when it arrived by rotation.
          PROVENANCE, NOT POLICY -- nothing reads it to decide anything. It exists so that 'why is
          this package pinned to a key I do not recognise?' is answerable a year later, which is the
          same question first_seen_via answers for the original pin. A trust fact that changed
          silently and left no record is one nobody can audit.
        optional: true
      - name: rotated_at
        type: string
        description: >-
          When the most recent rotation was accepted. Same shape as first_seen_at, including the
          lexical-ordering hazard documented there. Distinct from first_seen_at, which never moves:
          one says when this node first trusted the package's publisher, the other when that trust
          was last transferred.
        optional: true
      - name: rotations_seen
        type: float
        description: >-
          How many rotations this node has accepted for this package, ever. CUMULATIVE ACROSS
          BUNDLES: a node several rotations behind catches up in a single bundle and this counts all
          of them, because what it answers is 'how far has this package's identity moved', not 'how
          many times was I interrupted'.
  - id: publisher-pin-decision
    name: PublisherPinDecision
    kind: value-object
    fields:
      - name: outcome
        type: publisher-pin-outcome
        description: What was concluded.
      - name: pinned
        type: publisher-pin
        description: >-
          The pin as it stands AFTER the decision -- the newly recorded one on Pinned, the existing
          one on Matched/Mismatch/Downgraded, and absent on NotSigned. Carried on a REFUSAL on
          purpose: 'this is not the publisher' is not a diagnosable sentence without the key it is
          not, and the operator staring at it needs both sides.
        optional: true
      - name: rotation_refusal
        type: string
        description: >-
          Why a rotation was NOT accepted, when one was attempted and refused. The rotation verifier
          refuses for six materially different reasons -- the chain does not start at this pin, it
          does not end at the signer, a link is unsigned, a link presents a key that was not the one
          committed to, a commitment was abandoned, the chain is absurdly long -- and those are six
          different situations for whoever is holding the bundle. Collapsing them into Mismatch
          throws away the only sentence that says which one they are in, and a publisher who rotated
          correctly but shipped the wrong chain would have nothing to go on. Absent when no rotation
          was attempted.
        optional: true
      - name: record_changed
        type: bool
        description: >-
          Whether the stored row actually moved and therefore needs persisting. NOT DERIVABLE FROM
          outcome, which is why it is carried rather than inferred. A Matched decision usually
          writes nothing -- but a bundle may declare a pre-commitment WITHOUT rotating, which is
          exactly how a package climbs from level 1 to level 2, and that changes the row while the
          outcome stays Matched. Inferring 'persist if Pinned or Rotated' would drop every
          commitment ever established that way, silently, and pre-rotation would never engage for
          anyone who adopted it through an ordinary release. False on every path that refuses, so a
          refusal cannot move the pin it just refused against.
  - id: publisher-pin-override
    name: PublisherPinOverride
    kind: value-object
    fields:
      - name: fqid
        type: string
        description: The package whose pin this may replace.
      - name: expected_fingerprint
        type: string
        description: >-
          The publisher key fingerprint this override accepts, as key_fingerprint renders one: 16
          lowercase hex characters. THE SAME RENDERING THE REFUSAL PRINTS, deliberately --
          key_fingerprint's own contract is that an operator comparing the fingerprint in a refusal
          against the fingerprint in a warning must be comparing the same thing, and this is the one
          place a person retypes one of them. Validated for shape on the way in, because a typo does
          not fail loudly: it arms a fingerprint no key will ever match, so the recovery silently
          never happens and the operator waits on a window that cannot open.
      - name: reason
        type: string
        description: >-
          The operator's own words: why this package's publisher is allowed to change. REQUIRED and
          stored. A trust anchor that moved for a reason nobody wrote down is one nobody can audit
          -- the same defect PublisherPin.rotated_from exists to prevent for the cryptographic path,
          where the signature IS the reason.
      - name: armed_by
        type: string
        description: >-
          Who armed it -- the calling principal's id, taken from the message envelope and never from
          a payload field. It is the entire provenance of a pin that moved without evidence, and a
          caller-supplied value would be a caller-CHOSEN one. The request type carries no such slot,
          and because the wire is positional msgpack a caller who appends one is refused at the
          decode rather than believed.
      - name: armed_at
        type: string
        description: >-
          When it was armed. Same shape as PublisherPin.first_seen_at (chrono to_rfc3339: nanosecond
          precision, numeric offset, never Z), including the lexical-ordering hazard documented
          there.
      - name: consumed_at
        type: string
        description: >-
          When a pin decision consumed it, or absent while it is still armed. The row is KEPT after
          consumption rather than deleted, because 'this package's publisher changed on a person's
          say-so, on this date, for this stated reason' is the record the whole mechanism owes an
          auditor -- deleting it on use would leave the pin changed and the reason gone. A consumed
          row is also restored AS CONSUMED at boot; restoring one as armed would re-open a spent
          decision on every single restart.
        optional: true
    methods:
      - name: is_armed
        signature: is_armed() -> Boolean
        returns: bool
        description: >-
          Whether this override is still available to authorise a pin change: true while consumed_at
          is absent. Asked rather than testing the field at each call site, because the question
          'may this still move a trust anchor' has exactly one answer and it must not come to have
          two.
  - id: query
    name: Query
    kind: value-object
    fields:
      - name: entity_type
        type: string
        description: The entity type / collection to query.
      - name: filter
        type: query-spec
        description: The predicate/paging filter.
  - id: query-spec
    name: QuerySpec
    kind: value-object
    fields:
      - name: predicates
        type: any
        description: The field predicates (equality / range / membership) ANDed together.
      - name: limit
        type: int
        description: Maximum rows to return.
        optional: true
      - name: offset
        type: int
        description: Rows to skip (paging).
        optional: true
  - id: read-handle
    name: ReadHandle
    kind: value-object
    fields:
      - name: handle
        type: handle-id
        description: The open read handle id.
  - id: reconcile-finding
    name: ReconcileFinding
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          The finding kind — Missing | Extra | VersionMismatch | Corrupt | ExportViolation (a
          cross-crate ref targeting a private/non-exported entity, per the export-aware isolation
          check).
      - name: detail
        type: string
        description: Human-readable description of the discrepancy.
  - id: registration-ref
    name: RegistrationRef
    kind: value-object
    fields:
      - name: id
        type: string
        description: The registration id.
  - id: replay-handle
    name: ReplayHandle
    kind: value-object
    fields:
      - name: trace_level
        type: trace-level
        description: >-
          The capture level of the underlying log (Off | Nodes | Full | Expressions). TYPED, and the
          same closed vocabulary ExecConfig.trace_level accepts. It was a bare String on the
          argument that this is a read-back echo of a level the runtime already validated — but that
          defends the PRODUCER's confidence while the CONSUMER carries the risk: the reply is the
          half a client reads WITHOUT a decode check, so an untyped echo is the direction that can
          carry a value no variant names. The wire encoding is unchanged (the bare tag string), so
          this narrows what can be produced without changing what is on the wire.
      - name: steps
        type: list<replay-step>
        description: >-
          Ordered step records (step_seq order); a Full or Expressions run's steps additionally
          carry context_delta.
      - name: graph_snapshots
        type: graph-snapshot-set
        description: >-
          The source-graph snapshots the run captured — the content hash of each blueprint's graph
          AS IT RAN, so a replay can tell whether the blueprint has been edited since. ABSENT means
          the run was not traced (or the envelope predates the field), which is NOT the same as a
          capture that failed: a failed capture is present with a non-empty `failed` list. TRAILING
          + defaulted on decode: .logs envelopes and this handle are positional MessagePack, so a
          new field only ever goes on the end.
        optional: true
  - id: resolved-class-view
    name: ResolvedClassView
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: The resolved class's UUID.
      - name: all_properties
        type: list<resolved-property-def>
        description: Flattened properties (nearest overrides farthest).
  - id: resolved-dep
    name: ResolvedDep
    kind: value-object
    fields:
      - name: name
        type: string
        description: >-
          The dependency's name. For a `kind == "crate"` row this is the target crate's uuid; for a
          `kind == "package"` row it is the package fqid. Read `kind` to tell them apart — never the
          shape of this string.
      - name: version
        type: sem-ver
        description: >-
          The chosen version. A crate-space row carries 0.0.0 — the ABSENCE of a version rather than
          a version — and that is not on its own evidence of the row's kind either.
      - name: integrity
        type: string
        description: >-
          The integrity digest of the resolved artifact, when the resolver had one. A crate-space
          row has none.
        optional: true
      - name: kind
        type: string
        description: >-
          WHICH DEPENDENCY SPACE this row came from, carried through verbatim from the
          CrateDependency.kind it was projected from: "crate" for a cross-crate reference in this
          node's own crate space, "package" for an installed package capability.


          TRAILING and serde-defaulted: this is a positional MessagePack record, so the attribute is
          what makes a payload written before the field existed decode as ABSENT rather than fail as
          a length error. Absent means "the sender had no kind to send", NOT "this row has no space"
          — every row a current node produces carries one.
        optional: true
  - id: resolved-deps
    name: ResolvedDeps
    kind: value-object
    fields:
      - name: deps
        type: list<resolved-dep>
        description: The pinned resolved dependencies.
  - id: resolved-graph
    name: ResolvedGraph
    kind: value-object
    fields:
      - name: nodes
        type: any
        description: The resolved nodes and edges.
  - id: resolved-interface-view
    name: ResolvedInterfaceView
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: The resolved interface UUID (doc wire key `uuid`).
      - name: all_properties
        type: list<form-field>
        description: The flattened required-property schema (own + inherited) — doc wire key `all_properties`.
      - name: all_methods
        type: list<interface-method>
        description: >-
          The flattened MethodSignature set (own + inherited, up the extends chain) — doc wire key
          `all_methods`.
      - name: extends_chain
        type: list<string>
        description: The resolved base interface UUIDs (nearest-first) — additive over the doc shape.
  - id: resolved-type-view
    name: ResolvedTypeView
    kind: value-object
    fields:
      - name: uuid
        type: string
        description: The resolved type's UUID.
      - name: all_fields
        type: list<resolved-property-def>
        description: Flattened fields (nearest overrides farthest).
  - id: response
    name: Response
    kind: value-object
    fields:
      - name: payload
        type: bytes
        description: The MessagePack-encoded response payload.
      - name: headers
        type: message-headers
        description: Response headers (correlation/trace ids, content metadata).
  - id: review-state
    name: ReviewState
    kind: value-object
    fields:
      - name: value
        type: string
        description: The review-state variant — Pending | Approved | Rejected.
  - id: rule-filter
    name: RuleFilter
    kind: value-object
    fields:
      - name: predicates
        type: any
        description: The rule-selection predicates.
  - id: scan
    name: Scan
    kind: value-object
    fields:
      - name: entity_type
        type: string
        description: The entity type to scan (optional — all if absent).
        optional: true
      - name: offset
        type: int
        description: Rows to skip.
        optional: true
      - name: limit
        type: int
        description: Max rows to return.
        optional: true
  - id: scanned-segment
    name: ScannedSegment
    kind: value-object
    fields:
      - name: manifest
        type: segment-manifest
        description: The segment's .ns identity metadata.
      - name: active
        type: bool
        description: >-
          The .state active flag — false marks a tombstone (registered inactive, skipped for
          production boot).
      - name: parent_uuid
        type: string
        description: >-
          The parent segment UUID reconstructed from the persistence metadata record during the
          scan; null for a volume root. Carried so the discovery mount registers the segment under
          its parent (nested-tree rebuild) instead of as a root.
        optional: true
  - id: scheduled-task
    name: ScheduledTask
    kind: value-object
    fields:
      - name: task_id
        type: any
        description: The task's unique id.
      - name: trigger
        type: task-trigger
        description: The condition that fires the task.
      - name: action
        type: task-action
        description: The action performed when the task fires.
      - name: next_run
        type: datetime
        description: The next scheduled fire time (absent for event-only triggers).
        optional: true
      - name: owner
        type: security-principal
        description: >-
          The owning principal the task is tagged with — drives §18.3 cancel_by_owner teardown and
          the boot orphan sweep (which must recognize the off-broker sys.vault owner, e.g. the vault
          principal scoped to a secret instance, as registered).
  - id: scope-structure
    name: ScopeStructure
    kind: value-object
    fields:
      - name: scopes
        type: any
        description: The nested scopes and their owned slot ranges.
  - id: scoped-acquire-outcome
    name: ScopedAcquireOutcome
    kind: value-object
    fields:
      - name: value
        type: string
        description: Acquired | Deadlock.
      - name: cycle
        type: list<int>
        description: >-
          Deadlock only — the FiberIds forming the detected wait-for cycle (requester first), for
          the DeadlockDetected diagnostic.
        optional: true
  - id: secret-delivery
    name: SecretDelivery
    kind: value-object
    fields:
      - name: kind
        type: string
        description: The delivery mode — auto | pull | via_vault | none.
      - name: target
        type: string
        description: >-
          The via_vault LEASE TARGET, and meaningful for that mode alone: the FQID of the external
          package that receives the run-scoped unwrap lease and redeems the secret handle (for
          example `syw.system.marketplace`). The other three modes resolve the value into the
          running blueprint itself and have nobody to lease to. REQUIRED for via_vault — the
          compiler refuses a declared via_vault pin without it, and the runtime refuses the
          imperative form (MissingLeaseTarget): without a target there is no package to issue the
          lease to and the handle would reach a consumer that cannot redeem it. NOT A BUS
          FINGERPRINT, and this field used to say it was (A15, corrected 2026-10-01). A fingerprint
          is what the vault sees on the lane, so naming one reads plausible — but the redeemer
          presents its FQID when it unwraps, so a fingerprint-keyed lease can never be matched, and
          a bus fingerprint is derived from the node's seed, so it would name a different package on
          the next node and cannot travel in a PORTABLE blueprint at all. The compiler and the vault
          now both refuse a fingerprint-shaped target BY NAME rather than minting a lease that
          silently never matches. It is the AUTHOR's declaration, threaded verbatim from the pin
          through the compiler, the Wack's secrets.get argument and the runtime bridge; because it
          is declared rather than derived, the mint carries the delegating run's principal so the
          vault can evaluate that run's own unwrap policy before issuing.
        optional: true
  - id: secret-grant
    name: SecretGrant
    kind: value-object
    fields:
      - name: target
        type: fqid
        description: >-
          The leased package, BY FQID. Never a bus fingerprint: the redeemer presents its FQID when
          it unwraps, so a fingerprint-keyed lease can never be matched, and a fingerprint is
          node-local so it cannot travel in a portable blueprint. Both the compiler and the vault
          refuse a fingerprint-shaped target by name.
      - name: secret_uuid
        type: any
        description: The granted secret.
      - name: run_id
        type: any
        description: >-
          The run the lease is bound to (run-scoped). The storage key's third component and the
          run-end teardown key — never supplied by the redeemer.
      - name: verbs
        type: list<secret-verb>
        description: >-
          The granted verbs (typically unwrap). CHECKED at the authorize site, not merely recorded —
          a lease that does not carry Unwrap does not authorize an unwrap. EVERY verb is
          representable here, including invoke_method, but minting deliberately grants ONLY Unwrap:
          the sole reader of a lease is unwrap_secret, and run_secret_method never consults the
          grant store — a method invoke is authorized by the STANDING Secret policy against the
          invoking principal (verb invoke_method), because no delegated-invoke flow exists to mint
          or redeem a lease for. Widening the mint would create a grant no code path can spend. If a
          delegated invoke is ever wanted it needs a mint caller and a redemption check first; the
          verb is ready for it.
      - name: expires_at
        type: datetime
        description: The current live TTL boundary (auto-renewed while the run is live).
      - name: max_ttl_deadline
        type: datetime
        description: >-
          The absolute max-TTL ceiling renewal may not pass; carried forward by a re-grant on a
          still-live lease, so re-granting cannot move it.
      - name: ttl_secs
        type: int
        description: The per-renewal TTL window in seconds (default 300).
      - name: renew_interval_secs
        type: int
        description: The auto-renew cadence in seconds (default ttl/2 = 150).
      - name: authorized_by
        type: security-principal
        description: >-
          The on_behalf_of principal whose standing Unwrap policy authorized the mint. It is absent
          for the runtime's exempt flow. After every vault policy resync, the lease sweep
          re-evaluates this principal and revokes a lease the fresh rules no longer allow. RAM only:
          a SecretGrant never crosses a lane (the outward form is SecretLease).
        optional: true
  - id: secret-lease
    name: SecretLease
    kind: value-object
    fields:
      - name: lease_id
        type: string
        description: The lease id.
      - name: secret_uuid
        type: any
        description: The leased secret.
      - name: scope
        type: lease-scope
        description: The lease scope.
      - name: expires
        type: datetime
        description: Absolute expiry (when scoped by time).
        optional: true
      - name: renew_interval_secs
        type: int
        description: >-
          The auto-renew cadence in seconds the authority recorded for this lease: the holder renews
          every renew_interval_secs for as long as the work the lease serves is still live. It rides
          the lease because the RENEWER is the runtime (secret-grant's own contract says so) while
          the cadence is authored by the vault — a lease that reported only its expiry left the
          authority's renew_interval_secs written and read by nobody, so a run that referenced its
          via_vault pin once and then worked past the TTL lost its grant mid-run. 0 = no cadence
          declared (a lease that is not renewable, or one minted by an authority older than this
          field) and the holder auto-renews nothing. Trailing + serde(default): a
          positional-MessagePack payload encoded before this field existed decodes as 0.
  - id: secret-metadata
    name: SecretMetadata
    kind: value-object
    fields:
      - name: instance_uuid
        type: string
        description: The secret's instance/handle UUID (the secret_uuid).
      - name: class_uuid
        type: string
        description: The secret's class UUID (the schema it instantiates).
      - name: display_name
        type: string
        description: Human-readable name (defaults applied at store).
      - name: category
        type: string
        description: Optional grouping category.
        optional: true
      - name: tags
        type: list<string>
        description: Free-form tags.
      - name: non_sensitive_props
        type: any
        description: The record's props with every sensitive-tagged property stripped (safe to return).
      - name: created_at
        type: datetime
        description: Creation timestamp.
      - name: updated_at
        type: datetime
        description: Last-update timestamp (absent if never updated).
        optional: true
      - name: refresh_policy
        type: refresh-policy
        description: >-
          THE STATIC/DYNAMIC MARK, projected typed (docs/design/secret-lifetime-model.md §1,
          docs/design/transpiled-secret-authority.md §5). Absent = a STATIC secret that changes only
          when a human changes it; present = a DYNAMIC secret/connection whose value has an
          issuer-imposed lifetime and which the authority must refresh before expiry. Copied from
          the StoredSecret.refresh_policy the vault already parses on persist, so this projection
          introduces no new parsing and no new source of truth. Non-sensitive by construction — it
          names WHICH owned method refreshes and WHEN, never any credential material — so it
          survives the sensitive-prop stripping that defines this projection. Projected as a TYPED
          field rather than left inside non_sensitive_props precisely so consumers (the transpiler's
          secret-manifest pass and its target-capability guard) can read the mark without digging
          through an opaque Json blob; a mark that decides whether a build is legal must not be
          reachable only by string-keying a map. ORDERING: the encoding is a POSITIONAL ARRAY on the
          MessagePack lane, so every field added after this one must be APPENDED and optional —
          appending keeps pre-field records decodable, reordering silently misaligns every consumer.
        optional: true
      - name: parent_secret_uuid
        type: string
        description: >-
          THE CONNECTION LINK: the Secret this record was derived FROM, absent for a top-level
          Secret. Present on every Connection the vault mints through spawn_children, which stores
          each child with parent_secret_uuid = the invoked secret.


          This field already existed on the WRITE side and on the vault's own internal record, where
          it drives the delete cascade — it was simply never projected, so the Secret/Connection
          distinction was unreachable to every reader. Without it a consumer cannot assemble the
          grant tree (every grant renders as a top-level card), cannot show a cascade-delete
          preview, and cannot reach the class-method revoke dispatch, even though the vault knows
          all three.


          Projected here rather than exposed as a list-children verb because the child scan is a
          full decrypt-scan of the record set per call, so a tree would cost one scan per node —
          whereas on this field the SINGLE existing list_secrets call already carries everything a
          consumer needs to assemble the whole tree client-side. Non-sensitive by construction: a
          handle uuid, never credential material.


          APPENDED after refresh_policy per the positional-array ordering rule above.
        optional: true
      - name: last_error
        type: secret-error-mark
        description: >-
          THE HEALTH SIGNAL: a bounded mark describing the last owned-method run that FAILED —
          category, code, and when — cleared by a succeeding run, absent when the last run succeeded
          or none has run. See SecretErrorMark for why this is a mark and deliberately carries no
          message: this is the one secret read that promises sensitive material has been stripped,
          and an error message from a user-authored refresh method or an issuer response is free
          text that can contain credential material outright. Without this field a failed rotation
          is invisible to every reader — the vault persists the error, re-arms, and the secret goes
          on rendering as healthy while its value expires. APPENDED per the positional-array
          ordering rule above.
        optional: true
  - id: secret-method-outcome
    name: SecretMethodOutcome
    kind: value-object
    fields:
      - name: status
        type: string
        description: The run disposition — succeeded | failed.
      - name: updated_properties
        type: any
        description: >-
          The persisted-data projection of the live instance's property state after the run —
          present on BOTH outcomes (on a failed run it is the latest known state), so vault persists
          from the response even on failure.
      - name: result_value
        type: any
        description: >-
          The method's return value, when it produces one (rides the secure lane only; never crosses
          the broker).
        optional: true
      - name: error
        type: waffler-error
        description: The captured run error (present when status is failed).
        optional: true
      - name: spawn_children
        type: list<secret-spawn-child>
        description: >-
          Sim-caught Gap G (a parent's method could not mint a linked child -- e.g. an OAuth
          parent's create_connection producing a child connection secret): each entry declares ONE
          child secret this run wants minted. The method RETURNS what should exist; the vault
          performs the writes, folding each AFTER `updated_properties` via
          `store_secret(parent_secret_uuid = the invoked secret)`. Serde-default: absent or empty =
          no children, which is the prior wire shape.
        optional: true
  - id: secret-resolution
    name: SecretResolution
    kind: value-object
    fields:
      - name: secret_uuid
        type: any
        description: The resolved secret's id.
      - name: value
        type: bytes
        description: The unwrapped secret material (present only for ByValue deliveries; taint-tracked).
        optional: true
      - name: lease_id
        type: string
        description: The run-scoped lease bounding this resolution's lifetime.
        optional: true
  - id: secret-verb
    name: SecretVerb
    kind: value-object
    fields:
      - name: value
        type: string
        description: The secret verb — read | unwrap | list | write | delete | invoke_method.
  - id: secure-session
    name: SecureSession
    kind: value-object
    fields:
      - name: session_id
        type: string
        description: The session identifier.
      - name: peer
        type: peer-identity
        description: The authenticated peer identity for this session.
  - id: security-principal
    name: SecurityPrincipal
    kind: value-object
    fields:
      - name: type
        type: principal-type
        description: >-
          The principal type (serialized under the JSON key "type"); non-null on a resolved
          principal.
      - name: id
        type: string
        description: >-
          FQID for Service, the Ed25519 fingerprint for Package, the JWT subject/role/group id for
          the auth types, and for the three RUN SUBJECTS a uuid rendered in canonical form
          (lowercase, hyphenated): the system_uuid for System, the run's ephemeral mint for Run, the
          blueprint uuid for Blueprint. The three used to be one type spelled Blueprint, which is
          why security's save_rule can PROVE that a run-subject source whose id is a non-canonical
          literal names nobody.
  - id: segment-manifest
    name: SegmentManifest
    kind: value-object
    fields:
      - name: id
        type: string
        description: Entity UUID.
      - name: name
        type: string
        description: Technical name (folder basename).
      - name: display_name
        type: string
        description: Human-readable name.
      - name: type
        type: namespace-entity-type
        description: Entity type.
      - name: created_at
        type: string
        description: ISO-8601 creation timestamp.
      - name: tags
        type: list<string>
        description: Tags.
    methods:
      - name: to_ns_bytes
        signature: to_ns_bytes(&self) -> Vec<u8>
        returns: list<int>
        description: Serialize to the compact pipe-delimited .ns format.
      - name: from_ns_bytes
        signature: 'from_ns_bytes(bytes: &[u8]) -> Option<SegmentManifest>'
        returns: segment-manifest?
        description: Parse the pipe-delimited .ns (with legacy 4-field + JSON fallbacks).
  - id: sem-ver
    name: SemVer
    kind: value-object
    fields:
      - name: major
        type: int
        description: Major version (breaking changes).
      - name: minor
        type: int
        description: Minor version (backwards-compatible additions).
      - name: patch
        type: int
        description: Patch version (backwards-compatible fixes).
  - id: sensitivity
    name: Sensitivity
    kind: value-object
    fields:
      - name: value
        type: string
        description: Sensitive | Secret.
  - id: service-extension-announced
    name: ServiceExtensionAnnounced
    kind: value-object
    fields:
      - name: target_service
        type: service-name
        description: The host service to extend — the routing key the subscribing host filters on.
      - name: kind
        type: capability-kind
        description: >-
          Which host surface this extension targets (CapabilityKind) — the host dispatches its
          registration by this.
      - name: capability
        type: package-capability
        description: >-
          The full typed capability declaration the host registers (fqid, version, artifact_ref,
          metadata).
      - name: owner
        type: string
        description: >-
          The announcing package's principal id = its RESOLVED FQID (the Package-principal id — 'one
          Package identity everywhere'; never the raw fingerprint). Keys the owner-scoped teardown
          on Detach, tags the host-side registrations (SecurityPrincipal{ type: Package, id: owner
          }), and lets a module-backed kind's host (RuntimePrimitive) locate the owner's
          custody-verified materialized artifact tree at <package-artifact-root>/<owner>/.
      - name: action
        type: service-extension-action
        description: Attach (register) | Detach (owner-keyed unregister).
  - id: service-name
    name: ServiceName
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          transpiler | runtime-wack | sdk-capability-registry | frontend | message-bus | <external
          host id>.
  - id: shadow-report
    name: ShadowReport
    kind: value-object
    fields:
      - name: candidate_rule_id
        type: string
        description: The candidate (to-be-saved) rule id that shadows.
      - name: shadowed_rule_id
        type: string
        description: The live static.* rule id being overridden.
      - name: target
        type: string
        description: The shared target the two rules collide on.
      - name: candidate_effect
        type: permission-effect
        description: The candidate rule's effect.
      - name: shadowed_effect
        type: permission-effect
        description: The live rule's (opposite) effect.
  - id: sidecar-header
    name: SidecarHeader
    kind: value-object
    fields:
      - name: version
        type: int
        description: >-
          Sidecar format version; it FIXES the MAC algorithm (v0x02 = HMAC-SHA256), which is why no
          algorithm field is carried.
      - name: block_size
        type: int
        description: The content block size the per-block MAC chain is computed over.
      - name: total_length
        type: int
        description: The total length of the sealed content, in bytes.
      - name: n_blocks
        type: int
        description: >-
          The number of content blocks, hence the number of MACs in the parsed sidecar. A whole-file
          seal is the n_blocks = 1 case.
  - id: sidecar-parsed
    name: SidecarParsed
    kind: value-object
    fields:
      - name: header
        type: sidecar-header
        description: The parsed sidecar header.
      - name: macs
        type: list<mac>
        description: >-
          The per-block chain-chained HMAC tags, one per content block (header.n_blocks entries, in
          block order).
  - id: signature
    name: Signature
    kind: value-object
    fields:
      - name: params
        type: any
        description: The ordered typed parameters (name + type id + optional).
      - name: returns
        type: string
        description: The return type id (or unit).
        optional: true
  - id: slot-allocation
    name: SlotAllocation
    kind: value-object
    fields:
      - name: slot_count
        type: int
        description: Total number of frame slots to allocate.
      - name: bindings
        type: any
        description: Map of bound name -> slot index.
  - id: slot-resolver
    name: SlotResolver
    kind: value-object
    fields:
      - name: target
        type: string
        description: Opaque reference to the bound resolver supplied by the caller (the blueprint compiler).
  - id: sort
    name: Sort
    kind: value-object
    fields:
      - name: field
        type: string
        description: The indexed field to sort by.
      - name: dir
        type: string
        description: Sort direction — Asc | Desc.
  - id: source-map
    name: SourceMap
    kind: value-object
    fields:
      - name: entries
        type: any
        description: The per-node trace entries (node id, executed branch, pin-labelled inputs/outputs).
  - id: stack-entry
    name: StackEntry
    kind: value-object
    fields:
      - name: blueprint_uuid
        type: any
        description: The blueprint (or sub-blueprint) of this frame.
      - name: instruction_index
        type: int
        description: The current instruction index in that frame.
  - id: storage-route
    name: StorageRoute
    kind: value-object
    fields:
      - name: value
        type: string
        description: The route/provider key.
  - id: stored-permission-group
    name: StoredPermissionGroup
    kind: value-object
    fields:
      - name: id
        type: string
        description: Stable group id (charset [A-Za-z0-9._-]; MUST NOT contain ':').
      - name: display_name
        type: string
        description: Human-facing name.
      - name: description
        type: string
        description: Human-facing description.
      - name: status
        type: string
        description: GroupStatus — Approved | PendingReview | Draft | Revoked (only Approved flattens).
      - name: required
        type: bool
        description: >-
          Optionality of this permission request. true = REQUIRED (the package cannot function
          without it; denying it on an interactive install aborts the whole install; auto-approved
          on an automated boot install), false = OPTIONAL (granular approve/deny on interactive
          install; left PendingReview on automated install). Serde-default true.
      - name: source
        type: string
        description: GroupSource — Builtin | Package{package_id} | Custom | Legacy.
      - name: rules
        type: list<permission-rule>
        description: The group's flat rule set.
      - name: system
        type: bool
        description: true for builtin groups (UI hides edit/delete; re-seeded each boot).
      - name: default_bindings_locked
        type: bool
        description: true when the builtin's default bindings cannot be redirected.
      - name: override_acknowledgments
        type: list<any>
        description: Admin acknowledgments of shadowing overrides accepted at save time.
        optional: true
    methods:
      - name: is_reserved_group_id
        signature: 'is_reserved_group_id(id: String) -> bool'
        returns: bool
        description: >-
          Is `id` a group id an AUTHOR may not declare — anything in the reserved `host.` namespace?
          A PREFIX test: `host.` followed by anything is reserved; `host_x`, `hosting` and
          `myhost.x` are an author's to use. The rule the CLI refuses a pack on and core refuses an
          install on (InvalidManifest), from this one definition.
