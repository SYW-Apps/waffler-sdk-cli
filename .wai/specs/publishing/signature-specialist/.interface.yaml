id: isignature-specialist
name: Bundle Framing Contract
description: >-
  Deciding what follows the archive, and attaching a publisher signature to it.


  ## THE FRAME IS `shared`'s, AND THIS DOES NOT RESTATE IT


  This component once carried its own magic, trailer lengths and boundary scan, mirrored from the
  registry's. That was two statements of one rule, and adding a signer here would have made a third
  — which is why the signer was specified and deliberately not built, with the note that the real
  fix was to move the frame into ONE crate both sides depend on.


  `waffler_core` has done that. The boundary parser, the trailer types, the magic and the chain rule
  now live in `shared`, so this calls them and holds no copy. Two readers picking different ends of
  one file is the entire attack the boundary validation closes, and the only way to be sure two
  readers agree is for there to be one reader.


  ## THE PRODUCER IS NOW BUILT, AND THE GATE THAT HELD IT IS SATISFIED


  Readers first: emitting a signature shape deployed verifiers cannot read produces artifacts nobody
  can install. Core's verifiers are deployed and live-verified on a node — measured by that node
  REFUSING a mis-signed bundle in front of them, not by a green suite — so the producer ships.
component: signature-specialist
methods:
  - name: detectFraming
    description: >-
      Decide what the bytes after the archive are: nothing, a legacy detached signature, or a
      dual-signature trailer.


      THE ARCHIVE'S END IS FOUND BY VALIDATING THE CENTRAL DIRECTORY, not by trusting the first
      end-of-central-directory record that scans. A comment-aware scan finds several candidate
      records in a hostile file; the one whose directory pointer actually addresses a directory is
      the real end, and an archive declaring zero entries qualifies only when its record sits at
      offset zero — a zeroed plant otherwise reads as a legitimate empty archive.


      TWO QUALIFYING CANDIDATES IS A REFUSAL. Which one is 'the' boundary is not a question the
      bytes answer, and guessing decides where a signature begins.


      A SUFFIX THAT MATCHES NOTHING IS A REFUSAL. Sixty-four trailing bytes are a legacy signature;
      a trailer ending in the magic whose declared length agrees with the suffix is a dual frame;
      anything else is refused rather than trimmed, because deciding which trailing bytes are
      signature and which are content by guessing publishes a corrupt package successfully.


      STRICTER THAN THE REGISTRY IN ONE PLACE, DELIBERATELY AND IN THE SAFE DIRECTION. The registry
      treats 'no single coherent archive end' as 'not an archive' and carries on to its reader —
      sound THERE, because on its unsigned path the payload it signs is the whole artifact, so its
      boundary opinion never has to match anyone else's. This is the producer, holding the file,
      deciding whether to upload it: a file whose end cannot be established is one this tool cannot
      promise carries no signature, and refusing costs one clear local message while accepting costs
      an artifact nobody can install.
    signature: 'detectFraming(bundlePath: string): Framing'
    returns: string
    params:
      - name: bundlePath
        type: string
        description: The bundle to inspect.
    guarantees:
      - idempotent
  - name: signAsPublisher
    description: >-
      Append a publisher signature to an unsigned archive.


      COVERAGE IS STRUCTURAL, NOT DECLARED. `signatures[i]` covers `zip ||
      signatures[0..i].signature`, so the ORDER in the trailer is the countersigning chain. There is
      deliberately no field saying what a signature covers — a verifier reading one would be letting
      attacker-supplied data decide what to verify.


      THE PUBLISHER SIGNS FIRST AND THE REGISTRY LAST, which is why this only ever produces a
      trailer with a publisher signature ALONE. The registry countersigns on receipt, and its
      signature must be the final element so it commits to the publisher's beneath it; reversed,
      both still verify and the publisher signature becomes swappable. A tool that emitted a
      registry signature would be claiming an authority it does not have.


      IT REFUSES AN ALREADY-SIGNED ARCHIVE. Re-signing means either re-zipping — which destroys the
      payload a signature covers — or appending blindly, and both produce artifacts refused later on
      somebody else's machine.


      THIS IS A ONE-WAY DOOR FOR THE PACKAGE, and the caller is told before it happens rather than
      after. Once an fqid has shipped a publisher signature, every node that installed it pins that
      publisher; an unsigned publish afterwards is refused as a downgrade, and a DIFFERENT publisher
      is refused outright because rotation is not built.
    signature: 'signAsPublisher(bundlePath: string, signingKey: bytes): WrittenBundle'
    returns: sdk_cli::written-bundle
    params:
      - name: bundlePath
        type: string
        description: An unsigned bundle, as written by the bundle writer.
      - name: signingKey
        type: bytes
        description: >-
          The publisher's Ed25519 signing key, from the key adapter. Never read from disk here — a
          key is a secret and a signature is a computation, and merging the two would put file
          handling inside the one component whose correctness is checkable by reading it.
status: draft
