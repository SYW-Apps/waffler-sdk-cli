id: isignature-specialist
name: Bundle Framing Contract
description: >-
  Deciding what follows the archive.


  ## THERE IS NO `signAsPublisher` HERE, AND ITS REMOVAL IS A DESIGN CHANGE RATHER THAN A DEFERRAL


  It was specified and then taken out, on implementing it. The frame already has a producer AND a
  reader in `registry::publication::bundle_framing` — `frame` writes it, `read_framing` reads it —
  and `waffler_core` needs a reader of its own. A publisher signer here would have been the THIRD
  implementation of one wire format, with two of the three unexercised on any given day. A wire
  format with three definitions drifts in whichever copy nobody runs, and the drift is silent on
  both sides until a bundle crosses.


  SO THE REAL FIX IS SMALLER AND ELSEWHERE: when the producer half is needed, the frame types belong
  in ONE crate both sides depend on (`shared`), not re-declared per consumer. Writing the small
  wrong version here first is how the larger right one stops being possible — a third copy in the
  tree becomes a thing to keep in step rather than a thing to delete.


  The gate that was recorded against it — readers ship before producers — still holds and is now the
  `shared`-crate work's gate rather than this component's.


  ## THE DETECTION ALGORITHM IS MIRRORED, NOT INVENTED


  Two readers picking different ends of one file is the entire attack it closes: the bundle a
  developer inspects and the bundle a registry validates would differ, and neither could report it.
  The registry's parser is the reference; this must not diverge from it except where stated.
component: signature-specialist
methods:
  - name: detectFraming
    description: >-
      Decide what the bytes after the archive are: nothing, a legacy detached signature, or a
      dual-signature trailer.


      THE ARCHIVE'S END IS FOUND BY VALIDATING THE CENTRAL DIRECTORY, not by trusting the first
      end-of-central-directory record that scans. A comment-aware scan finds several candidate
      records in a hostile file; the one whose directory pointer actually addresses a directory is
      the real end, and an archive declaring zero entries qualifies only when its record sits at
      offset zero — a zeroed plant otherwise reads as a legitimate empty archive.


      TWO QUALIFYING CANDIDATES IS A REFUSAL. Which one is 'the' boundary is not a question the
      bytes answer, and guessing decides where a signature begins.


      A SUFFIX THAT MATCHES NOTHING IS A REFUSAL. Sixty-four trailing bytes are a legacy signature;
      a trailer ending in the magic whose declared length agrees with the suffix is a dual frame;
      anything else is refused rather than trimmed, because deciding which trailing bytes are
      signature and which are content by guessing publishes a corrupt package successfully.


      STRICTER THAN THE REGISTRY IN ONE PLACE, DELIBERATELY AND IN THE SAFE DIRECTION. The registry
      treats 'no single coherent archive end' as 'not an archive' and carries on to its reader —
      sound THERE, because on its unsigned path the payload it signs is the whole artifact, so its
      boundary opinion never has to match anyone else's. This is the producer, holding the file,
      deciding whether to upload it: a file whose end cannot be established is one this tool cannot
      promise carries no signature, and refusing costs one clear local message while accepting costs
      an artifact nobody can install.
    signature: 'detectFraming(bundlePath: string): Framing'
    returns: string
    params:
      - name: bundlePath
        type: string
        description: The bundle to inspect.
    guarantees:
      - idempotent
status: draft
