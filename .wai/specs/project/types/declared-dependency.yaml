kind: value-object
id: declared-dependency
name: Declared Dependency
description: >-
  A package this package needs: an fqid and a version REQUIREMENT.


  THE VERSION HALF IS A RANGE, NOT A PIN. `^1.0` is the normal spelling and `1.0.1` merely a narrow
  one — the registry resolves the requirement against what is published, and a pin makes every
  upstream patch a republish here.


  DECLARE ONLY WHAT IS TRUE, IN BOTH DIRECTIONS. Core refuses to ENABLE a package whose declared
  dependencies are absent, disabled, or at an excluded version, so a dependency nothing needs
  becomes an enable that refuses for a reason nobody can act on. A dependency that IS needed and is
  not declared becomes the failure the field exists to prevent: a package that starts and then fails
  on its first call to a service that is not there.
subsystem: project
fields:
  - name: fqid
    type: string
    description: The depended-upon package's fully-qualified id.
    optional: false
  - name: version
    type: string
    description: A SemVer requirement the registry resolves, e.g. `^1.0`.
    optional: false
  - name: optional
    type: bool
    description: >-
      Whether this package can run WITHOUT the dependency. Absent means REQUIRED.


      CORE HAS SUPPORTED THIS AND THIS TOOL COULD NOT EXPRESS IT. Every dependency authored here was
      stamped required, silently, with no field to write and no error to say why — so an author who
      wanted an optional dependency had no way to ask and no way to discover they had not asked.


      DEFAULTS TO REQUIRED, matching core's own default: a manifest written before this field keeps
      the meaning it had, and a forgotten flag produces a package that refuses to start rather than
      one that starts broken.


      WRITTEN INTO THE MANIFEST EVEN WHEN FALSE. An absent flag would carry the same meaning, but
      then a reader cannot tell "the author considered it and chose required" from "this manifest
      predates the field" — which is the distinction the flag exists to make.
    optional: true
methods: []
