        optional: true
  - id: type-ref
    name: TypeRef
    kind: value-object
    fields:
      - name: entity_uuid
        type: string
        description: UUID of the referenced entity.
      - name: entity_kind
        type: entity-kind
        description: Which kind of entity is referenced (type|class|interface|enum|signature).
      - name: generic_args
        type: list<generic-arg-binding>
        description: Generic argument bindings on the referenced entity (default empty).
  - id: artifact-ref
    name: ArtifactRef
    kind: value-object
    fields:
      - name: name
        type: string
        description: The artifact file name within the package's /artifact/ part.
      - name: kind
        type: artifact-kind
        description: >-
          How the host loads it (ArtifactKind — Dll | Wasm | NativeLib | CompatTranslator | UiBundle
          | BlueprintBundle).
      - name: hash
        type: string
        description: >-
          The artifact's content hash (must align with the manifest artifact_hashes verified at
          staged install).
      - name: entry_point
        type: string
        description: >-
          Optional load entry the host binds — the C-ABI symbol for a Dll/NativeLib, the export name
          for a Wasm module, or the mount entry for a UiBundle. Absent when the whole artifact is
          the unit.
        optional: true
  - id: fast-lane-request
    name: FastLaneRequest
    kind: value-object
    fields:
      - name: target
        type: service-name
        description: The service this package requests a fast lane to (any service — vault is the common case).
      - name: secure
        type: bool
        description: true = Secure Fast Lane (Noise XX + ChaCha20-Poly1305); false = plain Direct fast lane.
      - name: required
        type: bool
        description: >-
          Optionality. true = REQUIRED (denying it on an interactive install aborts the whole
          install; auto-approved on an automated boot install), false = OPTIONAL (granular
          approve/deny on interactive install; left PendingReview on automated install).
          Serde-default true (a declared request is required unless marked optional).
      - name: review
        type: review-state
        description: >-
          This request's approval state (Pending | Approved | Rejected), mirroring a permission
          group's review. Only Approved requests materialize a LinkGrant + load into the
          link-policy; Pending / Rejected do not. Serde-default Pending.
  - id: command-scope
    name: CommandScope
    kind: value-object
    fields:
      - name: everything
        type: bool
        description: Every command routed on this node. Must be stated; never inferred from empty match sets.
      - name: targets
        type: scope-match
        description: The addressed services.
      - name: capabilities
        type: scope-match
        description: >-
          The command verbs — which kinds of call. The dimension the global chain could not express
          before this type.
      - name: sources
        type: scope-match
        description: Who is calling.
  - id: event-scope
    name: EventScope
    kind: value-object
    fields:
      - name: everything
        type: bool
        description: Every event published on this node. Must be stated; never inferred.
      - name: topics
        type: scope-match
        description: The topics.
      - name: sources
        type: scope-match
        description: Who is publishing.
  - id: header-predicate
    name: HeaderPredicate
    kind: value-object
    fields:
      - name: key
        type: string
        description: A known MessageHeaders field name, else a key in the `extra` bag.
      - name: test
        type: string
        description: >-
          present | absent | equals | one_of. An unrecognised test refuses the declaration, and
          refuses the message if one slips through.
      - name: values
        type: list<string>
        description: What `equals` / `one_of` compare against; empty for `present` / `absent`.
  - id: module-source
    name: ModuleSource
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          stdlib | package_crate | package_native | workspace_crate | current_crate. It decides TWO
          things: how to render provenance, and which capability search plus which filter reaches
          this module's contents — see the search selector above, because the right search is not
          inferable from `module_id` alone.
      - name: id
        type: string
        description: >-
          The owner's identifier, and its meaning is decided by `kind`: the owning package's FQID
          for BOTH `package_crate` and `package_native` (deliberately the same value, so provenance
          and orphan rendering do not branch), and the crate root uuid for `workspace_crate`. ABSENT
          for `stdlib` (the node is the owner and needs no name) and for `current_crate` (the caller
          supplied the context crate in the request, so echoing it back would be the one field a
          consumer could disagree with us about).
        optional: true
  - id: namespace-entity-type
    name: NamespaceEntityType
    kind: value-object
    fields:
      - name: canonical_name
        type: string
        description: >-
          The canonical lowercase wire string (e.g. 'class', 'function_signature', or the extension
          name).
      - name: value
        type: string
        description: >-
          Folder | Crate | Package | Blueprint | Class | Type | Enum | Interface | FunctionSignature
          | Secret | Connection | Extension.
    methods:
      - name: as_str
        signature: as_str(&self) -> &str
        returns: '&str'
        description: The canonical lowercase string used in .ns files + JSON.
      - name: from_str
        signature: 'from_str(s: &str) -> NamespaceEntityType'
        returns: namespace-entity-type
        description: >-
          Parse from a string; unknown -> Extension(s); legacy schema/udt -> Type; signature ->
          FunctionSignature.
      - name: is_extension
        signature: is_extension(&self) -> bool
        returns: bool
        description: True for a package-defined extension type.
  - id: node-designer
    name: NodeDesigner
    kind: value-object
    fields:
      - name: x
        type: float
        description: Canvas x.
      - name: 'y'
        type: float
        description: Canvas y.
      - name: label
        type: string
        description: Node label.
        optional: true
      - name: comment
        type: string
        description: Author comment.
        optional: true
  - id: input-value
    name: InputValue
    kind: value-object
    fields:
      - name: kind
        type: string
        description: Static | FromScope | Expression | InlineFunction | Secret | Closure.
      - name: static_value
        type: any
        description: Static literal.
        optional: true
      - name: scope_path
        type: string
        description: FromScope variable path.
        optional: true
      - name: expression
        type: string
        description: Expression string.
        optional: true
      - name: inline_function
        type: inline-function-call
        description: InlineFunction call.
        optional: true
      - name: secret_ref
        type: secret-input-ref
        description: >-
          Secret binding — the declared secret uuid + optional delivery mode (absent delivery =
          auto).
        optional: true
      - name: closure_ref
        type: closure-input-ref
        description: >-
          Closure binding — the Closure-kind subroutine key this pin materializes as a lambda, plus
          an optional `expects` signature uuid for conformance. Trailing + optional, so payloads
          emitted before this pin kind existed keep decoding on both the JSON and
          positional-MessagePack lanes.
        optional: true
  - id: variable-mapping
    name: VariableMapping
    kind: value-object
    fields:
      - name: variable_name
        type: string
        description: Target variable name.
      - name: source_field
        type: string
        description: Optional path within the output; None = whole output.
        optional: true
      - name: kind
        type: variable-kind
        description: Var | Const.
      - name: declared_type_id
        type: string
        description: Declared-type entity UUID.
        optional: true
      - name: ownership
        type: string
        description: >-
          The bound/constructed variable's OWNED/SHARED authoring mode (value model §1.1): 'owned'
          (default, an isolated value) | 'shared' (a live object-heap instance every holder sees).
          Read by the compiler at a CONSTRUCTION node to set NewInstance.shared; absent = owned.
          Phase 2b introduces it per-variable for constructions; general per-value sharing of
          arbitrary values is a later phase.
        optional: true
      - name: target
        type: list<path-segment>
        description: >-
          PROPERTY/INDEX ASSIGNMENT target — the PROJECTION from `variable_name` (the ROOT) to the
          assigned location, ordered outermost first, each step a static `field` or a runtime `key`
          from an input pin (see path-segment). `self.config[idx].a = v` is [Field(config),
          Key(idx), Field(a)] rooted at `self`. EMPTY/ABSENT = a plain-variable assignment, the
          common case, entirely unchanged. THE TARGET IS A PROPERTY OF THE ASSIGNMENT, NOT OF THE
          NODE KIND: a flow set_variable / reassign_variable and an ORDINARY producer node carrying
          this field lower identically. That is not a detail — the compiler once honoured it only
          for flow nodes, so an ordinary node with a path target silently wrote its WHOLE result
          into the root, obliterating it. A PATH WRITE ASSIGNS INTO AN EXISTING STRUCTURE: the root
          must already be bound (a path write never defines a variable), and a null or missing
          intermediate TRAPS, naming the first absent hop — it does NOT auto-vivify. That refusal is
          unanimous in the prior art (CS1612, Go's map error, Swift's exclusivity, Python's
          AttributeError, JS's TypeError), and silently growing a structure from a mistyped path is
          the same class of silent wrong answer as the write that vanished. SUPERSEDES `target_path`
          + `target_index_pin`, which encoded a STATIC key chain plus ONE trailing dynamic key and
          therefore could not express `arr[i].f = v` at all. Decoders MUST LIFT the legacy pair into
          this form (each `target_path` element becomes a Field; a `target_index_pin`, when present,
          becomes a trailing Key), so existing graphs and artifacts keep loading unchanged.
        optional: true
  - id: exec-pin
    name: ExecPin
    kind: value-object
    fields:
      - name: name
        type: string
        description: The pin's programmatic name (then/else/body/next/case_0/default/catch_0/finally/...).
      - name: label
        type: string
        description: Human-readable label for the palette/designer.
        optional: true
      - name: description
        type: string
        description: Doc/tooltip text.
        optional: true
  - id: node-execution-status
    name: NodeExecutionStatus
    kind: value-object
    fields:
      - name: value
        type: string
        description: Completed | Failed.
  - id: node-trace-entry
    name: NodeTraceEntry
    kind: value-object
    fields:
      - name: node_uuid
        type: string
        description: The visual-graph node this entry projects (UUID).
      - name: inputs
        type: list<pin-value>
        description: Evaluated inputs as ordered (pin, value) pairs (redacted).
      - name: output
        type: any
        description: Raw output value.
        optional: true
      - name: step_seq
        type: int
        description: The authoritative step-sequence key from the record.
      - name: status
        type: node-execution-status
        description: Completed | Failed.
      - name: error
        type: string
        description: Error message if the node Failed (Option<String> on the record).
        optional: true
  - id: capability-kind
    name: CapabilityKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          TranspileBackend | AuthoringNode | RuntimePrimitive | UiPlugin | Middleware |
          TriggerProvider | ValidationHook.
  - id: capability-metadata
    name: CapabilityMetadata
    kind: value-object
    fields:
      - name: display_name
        type: string
        description: Human label for the capability in palettes/menus.
        optional: true
      - name: category
        type: string
        description: Grouping category for the designer palette (e.g. quantum/gates, quantum/measure).
        optional: true
      - name: icon
        type: string
        description: Icon id / asset reference for the palette entry.
        optional: true
      - name: form_fields
        type: list<form-field>
        description: Typed parameter descriptors (FormField) for the capability's configurable inputs.
        optional: true
      - name: node_descriptor
        type: any
        description: >-
          The authoring node's structural shape (pins/ports/typed params) the editor instantiates
          for an AuthoringNode capability. Absent for non-node capabilities.
        optional: true
      - name: docs_url
        type: string
        description: Optional documentation link surfaced in the marketplace/editor.
        optional: true
  - id: expression-token
    name: ExpressionToken
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          Literal | NumberLiteral | StringLiteral | BooleanLiteral | Variable | Function | Operator
          | LeftParen | RightParen | Comma | EscapedBraces.
      - name: text
        type: string
        description: The token's string payload (Literal/String/Variable/Operator/EscapedBraces/Function name).
        optional: true
      - name: number
        type: float
        description: NumberLiteral value.
        optional: true
      - name: boolean
        type: bool
        description: BooleanLiteral value.
        optional: true
      - name: args
        type: list<list<expression-token>>
        description: Function call argument token streams (recursive).
        optional: true
      - name: literal
        type: string
        description: >-
          A numeric literal's EXACT source text, when the producer kept it. `number` is an f64, so
          it cannot carry an integer literal outside f64's exact range: `9007199254740993` parses to
          `9007199254740992` at TOKENIZE time, before any consumer sees it -- the value is silently
          the wrong one and the wrong kind. Consumers needing exactness read this text first and
          fall back to `number`, so a producer that does not set it behaves exactly as before.
          Serde-default.
        optional: true
  - id: permission-group-sensitivity
    name: PermissionGroupSensitivity
    kind: value-object
    fields:
      - name: group_id
        type: string
        description: The group id this verdict belongs to — the same id an adjustment or an approval addresses.
      - name: reasons
        type: list<permission-sensitivity-reason>
        description: Every reason this group is consequential, in rule order. Empty = examined, nothing found.
  - id: producer
    name: Producer
    kind: value-object
    fields:
      - name: kind
        type: string
        description: constructor | default_constructor | static_factory | instance_method.
      - name: blueprint_uuid
        type: string
        description: >-
          The implementing blueprint bound to the producing declaration
          (ClassMethod.impl.blueprint_uuid), when the impl is blueprint-kind
          (constructor/factory/instance_method; absent for the synthesized default and for
          pending/primitive/command impls).
        optional: true
      - name: owner_class_uuid
        type: string
        description: The class that owns the producing method (for a static factory on another class).
        optional: true
      - name: method_name
        type: string
        description: The producing method declaration's name (ClassMethod.name).
        optional: true
      - name: display_name
        type: string
        description: Human-readable label for the picker.
        optional: true
  - id: lineage-link
    name: LineageLink
    kind: value-object
    fields:
      - name: public_key
        type: bytes
        description: The Ed25519 verifying key this link rotates TO (32 bytes) -- the successor.
      - name: next_key_digest
        type: bytes
        description: >-
          The SHA-256 digest of the key permitted to succeed THIS one, when the successor commits
          onward (KERI pre-rotation). Absent means this key names no successor, which is legal only
          when the key it replaces named none either: a package that has adopted pre-rotation may
          not silently stop. THE CONSEQUENCE IS EASY TO MISS AND EXPENSIVE TO MEET LATE -- rotating
          a package that has committed requires minting the NEXT successor at the same time. There
          is no rotate-and-stop.
        optional: true
      - name: signature
        type: bytes
        description: >-
          The predecessor's Ed25519 signature (64 bytes) over `public_key || next_key_digest` -- the
          raw CONCATENATION, never a re-encoding. Covering the commitment with the same signature
          that authorizes the successor is what stops anyone who can edit the trailer from swapping
          the commitment while the signature stays valid.
    methods:
      - name: signed_bytes
        signature: signed_bytes() -> Bytes
        returns: bytes
        description: >-
          The exact bytes the predecessor signed: public_key followed by next_key_digest when
          present.
      - name: lengths_are_valid
        signature: lengths_are_valid() -> Boolean
        returns: bool
        description: >-
          Whether the key, signature and any digest are the lengths Ed25519 and SHA-256 require.
          CHECKED AT PARSE, NOT AT VERIFY, on material that is attacker-supplied and reaches this
          before any trust decision -- a short key deeper in a chain would otherwise reach a
          fixed-size conversion and panic.
  - id: publisher-pin-outcome
    name: PublisherPinOutcome
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          Pinned | Matched | Rotated | Overridden | Mismatch | Downgraded | NotSigned. Five of the
          seven permit the install; Mismatch and Downgraded are the refusals.
    methods:
      - name: permits_install
        signature: permits_install() -> Boolean
        returns: bool
        description: >-
          Whether this outcome permits the install to continue: true for Pinned, Matched, Rotated,
          Overridden and NotSigned; false for Mismatch and Downgraded. Stated once here rather than
          as a match at each call site, so an eighth outcome added later gets ONE decision about it
          instead of as many as there are callers -- and the compiler shows exactly where that
          decision lives. Rotated joining the permitting side was the entire behavioural change of
          key rotation; Overridden joining it is the entire behavioural change of operator recovery.
          Everything else about both is evidence-gathering.
      - name: rests_on_a_human
        signature: rests_on_a_human() -> Boolean
        returns: bool
        description: >-
          Whether this outcome moved the pin to a key the node had no CRYPTOGRAPHIC reason to
          accept: true for Overridden alone, false for every other outcome. A caller that wants to
          shout about such a change asks this rather than matching on the variant, because the
          question is 'was this a person's decision' -- and a second human-authorised outcome added
          later would otherwise have to find every place that asked.
  - id: replay-step
    name: ReplayStep
    kind: value-object
    fields:
      - name: step_seq
        type: int
        description: The authoritative monotonic replay/order key.
      - name: node_uuid
        type: string
        description: The node this step is for (UUID).
      - name: status
        type: node-execution-status
        description: Completed | Failed.
      - name: inputs
        type: list<pin-value>
        description: Evaluated inputs as ordered (pin, value) pairs (redacted).
      - name: output
        type: any
        description: Raw output value.
        optional: true
      - name: context_delta
        type: map<string, any>
        description: >-
          The NAMED variables this node changed, and their values afterwards — present ONLY on a
          Full run, nested under the step (Ledger §17.13 RT-13). Computed as the difference between
          the frame as the node was entered and the frame as the next boundary found it; both
          snapshots ride the node marker, so Full costs a comparison rather than a new emit. Scratch
          slots are excluded: every intermediate expression lowers to one, so including them would
          bury the assignment a designer wrote under the temporaries that computed it. ABSENT means
          the question was not asked (any level below Full); an EMPTY map means it was asked and
          this node changed nothing — a reader must not conflate the two. Per NODE, not per
          instruction: see the scope decision on shared::trace-level.
        optional: true
  - id: graph-snapshot-set
    name: GraphSnapshotSet
    kind: value-object
    fields:
      - name: captured
        type: list<graph-snapshot-ref>
        description: >-
          The blueprints whose graph was stored, each with the content hash it stored under. Sorted
          by blueprint_uuid so two runs over the same closure produce byte-identical sets.
      - name: failed
        type: list<graph-snapshot-failure>
        description: >-
          The blueprints whose snapshot was attempted and failed — EMPTY on a clean capture, and the
          only thing that distinguishes a failed capture from a complete one.
    methods:
      - name: hash_for
        signature: 'hash_for(blueprint_uuid: String) -> Option<String>'
        returns: string?
        description: The content hash captured for one blueprint, if it was captured.
      - name: is_complete
        signature: is_complete() -> bool
        returns: bool
        description: >-
          Whether every blueprint the capture attempted was stored — i.e. whether a replay of this
          run can be rendered against the graphs that actually ran.
  - id: resolved-property-def
    name: ResolvedPropertyDef
    kind: value-object
    fields:
      - name: name
        type: string
        description: Property name.
      - name: source
        type: string
        description: Technical name or UUID of the entity that originally declared this property.
      - name: inherited
        type: bool
        description: True if inherited from an ancestor.
  - id: interface-method
    name: InterfaceMethod
    kind: value-object
    fields:
      - name: name
        type: string
        description: Method name (matched BY NAME during conformance).
      - name: signature_uuid
        type: string
        description: >-
          UUID (entity ref) to the reused WafflerSignature defining this method's inputs + output
          (kind=signature; extracted to .dependencies). Resolved by interfaces:resolve and
          classes:validate_implementation. NAMED TO MATCH ClassMethod.signature_uuid, and the rename
          is the whole point: this field was `signature` while the class side was `signature_uuid`,
          so all nineteen transpiler emitters read the CLASS key off an INTERFACE payload and the
          lookup missed unconditionally — an interface was an EMPTY contract in every target and
          conformance was vacuous everywhere. Serde keeps `signature` as a read alias FOR DATA
          already persisted, not for code.
  - id: lease-scope
    name: LeaseScope
    kind: value-object
    fields:
      - name: value
        type: string
        description: The lease scope — Run | Session | Standing.
  - id: refresh-policy
    name: RefreshPolicy
    kind: value-object
    fields:
      - name: method
        type: string
        description: The owned secret-class method the refresh runs (e.g. refresh / rotate).
      - name: kind
        type: string
        description: The schedule variant — Interval | ExpiryProperty.
      - name: every
        type: int
        description: 'Interval variant: seconds between fires.'
        optional: true
      - name: property_name
        type: string
        description: >-
          ExpiryProperty variant: the instance property carrying the expiry Timestamp the fire is
          derived from.
        optional: true
      - name: lead
        type: int
        description: 'ExpiryProperty variant: how many seconds BEFORE the expiry to fire.'
        optional: true
  - id: secret-error-mark
    name: SecretErrorMark
    kind: value-object
    fields:
      - name: category
        type: string
        description: The failing error's category (e.g. vault, runtime) — a bounded token, never free text.
      - name: code
        type: string
        description: The failing error's code (e.g. AccessDenied, ValidationFailed), when it carried one.
        optional: true
      - name: at
        type: datetime
        description: >-
          When the failure was captured — the run that failed. Answers "is this a stale failure from
          last week or is rotation broken right now", which is the question an operator actually
          asks.
  - id: secret-spawn-child
    name: SecretSpawnChild
    kind: value-object
    fields:
      - name: class_uuid
        type: any
        description: The child secret's class.
      - name: properties
        type: any
        description: The child's FULL prop set, including its `refresh_policy` when it should rotate.
      - name: display_name
        type: string
        description: An optional display name for the minted child. Serde-default.
        optional: true
  - id: principal-type
    name: PrincipalType
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          Service | Blueprint | System | Run | Package | User | AuthRole | AuthGroup. The wire token
          is the variant name verbatim (as_token / from_token round-trip with serde's tag).
    methods:
      - name: pattern_covers
        signature: 'pattern_covers(principal: PrincipalType) -> Boolean'
        returns: bool
        description: >-
          Whether a rule SOURCE PATTERN of this type covers a concrete PRINCIPAL of that type. THE
          ONE ANSWER — shared::rule_match::principal_matches, security's group_index and the vault's
          secret_policy_evaluator all call it, because a second copy of the legacy-coverage rule is
          how two matchers come to disagree about what a stored rule covers. Only Blueprint is loose
          (it covers System and Run as well as itself, for pre-split rows); every other type is
          exact equality.
      - name: as_token
        signature: as_token() -> String
        returns: string
        description: >-
          The wire token for this type — the same string serde writes for the variant. Exists
          because the relayed-run subject discriminator travels as a plain string in the
          message-header `extra` bag (HEADER_SUBJECT_TYPE), and the writer and the reader must spell
          it identically.
      - name: from_token
        signature: 'from_token(token: String) -> Optional<PrincipalType>'
        returns: principal-type?
        description: Parse a wire token back to its variant; an unknown token yields nothing, never a guess.
  - id: service-extension-action
    name: ServiceExtensionAction
    kind: value-object
    fields:
      - name: value
        type: string
        description: Attach | Detach.
  - id: rule-narrowing
    name: RuleNarrowing
    kind: value-object
    fields:
      - name: rule_index
        type: int
        description: >-
          The 0-based index of the rule being narrowed within the declared group's `rules`. An index
          past the end is a boot ERROR, never a silent skip — a narrowing that addresses nothing is
          a user believing they restricted something.
      - name: pattern
        type: rule-pattern
        description: >-
          The replacement pattern. It must be COVERED by the declared rule's pattern
          (rule_match::pattern_covers): every access it admits, the declared one already admitted.
          Anything else is refused at boot.
  - id: test-result
    name: TestResult
    kind: value-object
    fields:
      - name: test_name
        type: string
        description: The test method/case name.
      - name: class_name
        type: string
        description: The owning ITestClass name.
      - name: status
        type: string
        description: Passed | Failed | Skipped.
      - name: duration_ms
        type: int
        description: Wall-clock duration in ms.
      - name: error
        type: error-payload
        description: Failure detail (Failed only).
        optional: true
  - id: trap-entry
    name: TrapEntry
    kind: value-object
    fields:
      - name: start
        type: int
        description: First instruction index covered.
      - name: end
        type: int
        description: Last instruction index covered.
      - name: handler_index
        type: int
        description: >-
          Jump target on a matching error (the catch handler subgraph's first instruction, or the
          finally-then-rethrow handler for a synthetic finally entry).
      - name: match_set
        type: list<string>
        description: >-
          Flat UUID set { filter_class } ∪ descendants; empty/sentinel for catch-all (incl. the
          synthetic finally entry).
      - name: error_slot
        type: int
        description: >-
          The frame slot the Wack writes the caught Error instance into before jumping to
          handler_index, so the catch handler subgraph can read the bound error. Compiler-allocated
          (slot-sweeper) per catch.
  - id: permission-suggestion
    name: PermissionSuggestion
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          The RulePattern.kind the rule must carry: 'Bus' for a package capability, or the
          NativeAccessKind's own rule kind ('Filesystem' | 'Network' | 'Process' | 'Device' |
          'Console') for a host reach. A rule of the wrong kind never answers the request at all
          (native_rule_covers refuses cross-class rules), so this is the field that must be right
          before any other one matters.
      - name: target_kind
        type: string
        description: >-
          The RulePattern.target_kind — 'Command' on a bus suggestion, absent on every native one,
          where the field is meaningless.
        optional: true
      - name: target
        type: suggested-target
        description: >-
          The RulePattern.target, in the three-state form that keeps 'this rule needs no target'
          apart from 'the target is computed at run time'.
      - name: verbs
        type: list<fs-verb>
        description: >-
          The RulePattern.verbs the call requests. For a Bus suggestion this is the single COMMAND
          (the bus grammar's two halves stay apart: the service is the target, the command is the
          verb).
      - name: verbs_exact
        type: bool
        description: >-
          Whether `verbs` is EXACTLY what the call asks for (true), or a set of CANDIDATES of which
          the call will request some subset decided at run time (false). The one producer of false
          today is fs.open whose MODE operand is not a compile-time constant: the gate derives Read,
          Write or both from that operand at the call, so the analysis can only say 'one of these'.
          Appending such a sketch verbatim grants BOTH — wider than the call needs — which is why it
          is a field and not a footnote.
      - name: reach
        type: string
        description: >-
          What asked for the permission: a capability fqid (acme.mail:send) or a primitive id
          (fs.open). Carried so a client can name the reach in its own words instead of re-parsing
          the issue's message.
      - name: undeclared_class
        type: bool
        description: >-
          Whether this sketch is as WIDE as it is because the primitive named in `reach` DECLARED NO
          SECURITY CLASS — i.e. the breadth is the declaration's omission, not the call's own need.
          A package-contributed native primitive whose capability declares no security block is
          classified by the gate as GuardSpec::undeclared: Process, no verb, no visible target. Only
          a rule constraining NEITHER target NOR verb can cover it, so the grant the call needs is
          the broadest one the vocabulary has — and it is broad for a reason the CRATE author cannot
          fix, because the class belongs to the package that ships the primitive. It rides on the
          value for the same reason verbs_exact does: a client rendering a review has to separate
          'this call genuinely reaches everything' from 'nobody said what this call reaches' WITHOUT
          parsing prose. When every request in a review is unconstrained, this is the field that
          says whether that is the packages' silence or the blueprint's appetite. False for every
          built-in reach, for every package capability that DID declare a class, and for every bus
          suggestion (a bus capability's coverage is decided by service + command, both in the fqid,
          so it has no undeclared axis). APPENDED LAST on the positional-MessagePack record, so a
          report encoded before it existed still decodes.
    methods:
      - name: is_complete
        signature: is_complete() -> bool
        returns: bool
        description: >-
          Whether this sketch is a WHOLE rule — both the target and the verb set are settled, so
          appending it grants exactly what the call needs and nothing more. False means the sketch
          is a starting point with at least one blank in it, and a client must put a person in front
          of it rather than committing it on one click.
  - id: bytes-buffer
    name: Bytes Buffer
    kind: value-object
    fields:
      - name: bytes
        type: list<int>
        description: >-
          The contiguous octets. Declared bare per the group's REALIZATION CONVENTION (a declared
          field type names WHAT THE VALUE IS, not how it is stored): the implementation holds this
          behind a refcount with copy-on-write, so an owned copy is a pointer bump rather than a
          byte-for-byte clone. Length is the collection's own, not a separate field — a stored
          length that can disagree with the buffer is a second source of truth.
  - id: closure-binding
    name: ClosureBinding
    kind: value-object
    fields:
      - name: program
        type: program-ref
        description: >-
          The opaque in-process reference to the owner's LOADED program — the instruction vector,
          trap table, node-boundary map and load-resolved primitive table that a frame push needs,
          i.e. exactly the bundle of things an in-bundle member push resolves today. Resolved at
          LoadFunction from the frame the fiber is currently executing, so it is correct by
          construction for ANY owner (member or entry) and needs no index, table or membership test.
          Held behind a reference-count so the program outlives every closure value that can still
          enter it.
      - name: captures
        type: list<value>
        description: >-
          The captured environment: the values lifted out of the enclosing scope, ORDERED to match
          the handle's capture_slots positionally, so frame push seeds captures[i] ->
          frame[capture_slots[i]] with no name lookup. SNAPSHOTTED at closure-creation time — an
          OWNED value is copied, while a SHARED instance's snapshot is its heap_ref HANDLE, so the
          closure and the enclosing scope keep addressing one cell (snapshot the slot, share the
          box). A captured value may itself carry any side-channel, including another closure's
          binding, so environments CHAIN. EMPTY for a capture-free lambda — which still has a
          binding, because it still needs its program.
  - id: generic-parameter
    name: GenericParameter
    kind: value-object
    fields:
      - name: name
        type: string
        description: Short identifier used in type positions (e.g. 'T', 'TItem').
      - name: constraint
        type: type-ref
        description: >-
          Optional upper-bound constraint; a supplied arg must be the constrained entity or a
          subtype.
        optional: true
      - name: description
        type: string
        description: Doc text.
        optional: true
  - id: class-property
    name: ClassProperty
    kind: value-object
    fields:
      - name: key
        type: string
        description: Property key (name-keyed).
      - name: label
        type: string
        description: Display label.
      - name: description
        type: string
        description: Doc text.
        optional: true
      - name: type
        type: field-type
        description: The property's typed field (FieldType; carries the entity TypeRef relation).
      - name: default_value
        type: any
        description: Default value.
        optional: true
      - name: access
        type: access-level
        description: >-
          Member visibility (AccessLevel: public | private). Private properties are
          implementation-internal (inspectable, not externally usable).
      - name: ui
        type: field-ui
        description: Optional UI hints (placeholder, hidden, render_as).
        optional: true
      - name: constraints
        type: field-constraints
        description: Optional constraints (required, readonly, sensitive, show_if).
        optional: true
  - id: class-lifecycle
    name: ClassLifecycle
    kind: value-object
    fields:
      - name: enable_default_constructor
        type: bool
        description: >-
          When true, the platform-synthesized default constructor is available
          (classes:list_producers reports it).
  - id: class-layout
    name: ClassLayout
    kind: value-object
    fields:
      - name: groups
        type: list<any>
        description: UI property groups.
      - name: actions
        type: list<any>
        description: UI actions.
  - id: enum-item
    name: EnumItem
    kind: value-object
    fields:
      - name: key
        type: string
        description: Stable key (default empty).
      - name: label
        type: string
        description: Display label.
      - name: value
        type: any
        description: Opaque JSON value.
  - id: generic-param
    name: GenericParam
    kind: value-object
    fields:
      - name: extends
        type: string
        description: Upper-bound type id.
        optional: true
      - name: default
        type: string
        description: Default type id.
        optional: true
  - id: type-method
    name: TypeMethod
    kind: value-object
    fields:
      - name: id
        type: string
        description: Method id.
      - name: name
        type: string
        description: Method name.
      - name: description
        type: string
        description: Doc text.
      - name: access
        type: access-level
        description: >-
          Member visibility (AccessLevel: public | private). When presenting a class method, derived
          from the declaring ClassMethod.access (the declaration is the source of truth).
      - name: arguments
        type: list<form-field>
        description: >-
          The argument list — an ARRAY of named FormFields (one per parameter; never a bare
          primitive at root; an empty Vec = no parameters). The single return is `return_type` (a
          type id).
      - name: return_type
        type: string
        description: Return type id.
  - id: invocation-mode
    name: InvocationMode
    kind: value-object
    fields:
      - name: value
        type: string
        description: autonomous | on_demand | template.
  - id: blueprint-ownership
    name: BlueprintOwnership
    kind: value-object
    fields:
      - name: kind
        type: string
        description: independent | owned_by_class.
      - name: class_uuid
        type: string
        description: >-
          Owning class UUID (owned_by_class; UUID-primary). The by-owner reverse-lookup index keys
          on it.
        optional: true
      - name: receiver
        type: string
        description: >-
          instance | static (owned_by_class) — the guard-enforced MIRROR of the declaring
          ClassMethod.receiver, kept blueprint-side so the compiler slot-sweeper / Wack fiber read
          it manifest-locally (self/this slot allocation) without a class fetch; the class
          declaration remains the source of truth.
        optional: true
  - id: blueprint-target-spec
    name: BlueprintTargetSpec
    kind: value-object
    fields:
      - name: environments
        type: list<target-environment>
        description: Declared target environments (default empty).
  - id: target-environment
    name: TargetEnvironment
    kind: value-object
    fields:
      - name: id
        type: string
        description: Stable id within the blueprint (referenced by compiler plugin settings).
      - name: label
        type: string
        description: Human-readable label (e.g. 'Backend Service').
      - name: tags
        type: list<context-tag>
        description: Context tags this environment provides.
  - id: capture-liveness
    name: CaptureLiveness
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          snapshot (statically known owned/primitive — the closure holds a COPY; later creator
          mutations are invisible to it) | shared-live (the captured binding is a SHARED
          construction — one heap cell, mutation visible in both directions) | runtime-form (the
          compiler genuinely cannot classify — a call result, a collection item, a caught error;
          live IFF the runtime value turns out to be handle-bearing).
  - id: node-range
    name: NodeRange
    kind: value-object
    fields:
      - name: node_uuid
        type: string
        description: The L0 designer node UUID.
      - name: start
        type: int
        description: The first instruction index — the node's own NodeEnter marker.
      - name: end
        type: int
        description: The last instruction index of this node's code (INCLUSIVE).
  - id: slot-info
    name: SlotInfo
    kind: value-object
    fields:
      - name: slot
        type: int
        description: The numeric slot index (the key into the artifact's slot_names/slot_kinds).
      - name: name
        type: string
        description: The display/variable name.
      - name: kind
        type: variable-kind
        description: Var (reassignable) or Const (immutable once set).
      - name: scope_id
        type: int
        description: >-
          The lexical scope id this slot is declared in (the scope whose slot range contains it).
          Absent is not scope 0 — scope 0 is a real scope.
        optional: true
      - name: clear_scope
        type: int
        description: The scope id whose close clears this slot — the [declare..clear] lifetime end, if any.
        optional: true
  - id: edge-jump
    name: EdgeJump
    kind: value-object
    fields:
      - name: node_uuid
        type: string
        description: The flow node the jump belongs to.
      - name: pin
        type: string
        description: The exec pin / branch role the jump realizes (then / elif-0 / body / back / ...).
      - name: instr_index
        type: int
        description: The realizing jump's ABSOLUTE instruction index.
  - id: node-pin-slots
    name: NodePinSlots
    kind: value-object
    fields:
      - name: node_uuid
        type: string
        description: The L0 designer node UUID.
      - name: inputs
        type: list<pin-slot>
        description: >-
          The node's INPUT pins, in the order the weave materialized them — which for a capability
          call IS the callee's declared parameter order, the same order its Execute operands sit in
          — each with the slot the flattener wove it from.
      - name: output
        type: int
        description: >-
          The slot this node's result is written to, when it produces one. Absent is a real answer,
          not a fallback: a branch/loop, a break/continue/return/throw, and a PATH-targeted
          assignment (obj.x = v, whose result lands in a FIELD of a live object rather than in any
          slot) all genuinely write no output slot.
        optional: true
  - id: entry-param
    name: EntryParam
    kind: value-object
    fields:
      - name: name
        type: string
        description: Param/field name.
      - name: declared
        type: field-type
        description: >-
          The declared type. None — and Dynamic, which is what an undeclared type deserializes to —
          mean UNCHECKED.
        optional: true
      - name: default_value
        type: any
        description: >-
          The value that stands in when the caller omits this parameter. None = genuinely required.
          serde(default), so an artifact written before the field existed decodes with None.
        optional: true
  - id: waffler-data-type
    name: WafflerDataType
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          One of the WafflerDataType variants (String, Int, Float, Byte, Bytes, Char, Boolean,
          Object, Array, Reference, Secret, Connection, Credential, Dynamic, ...).
  - id: credential-accept
    name: CredentialAccept
    kind: value-object
    fields:
      - name: entity_kind
        type: string
        description: '''Secret'' or ''Connection''.'
      - name: type_id
        type: string
        description: Class FQID; picker accepts entities whose class extends this.
  - id: entity-kind-hint
    name: EntityKindHint
    kind: value-object
    fields:
      - name: value
        type: string
        description: Type | Class | Interface | Enum | Signature.
  - id: field-style
    name: FieldStyle
    kind: value-object
    fields:
      - name: indent
        type: bool
        description: Indent the field.
        optional: true
      - name: margin_top
        type: string
        description: Top margin.
        optional: true
      - name: divider_before
        type: bool
        description: Render a divider before.
        optional: true
  - id: entity-config
    name: EntityConfig
    kind: value-object
    fields:
      - name: type_id
        type: string
        description: Entity type id.
      - name: target_module
        type: string
        description: Service module.
      - name: list_command
        type: string
        description: List capability.
      - name: get_command
        type: string
        description: Get capability.
      - name: create_command
        type: string
        description: Create capability.
      - name: update_command
        type: string
        description: Update capability.
      - name: delete_command
        type: string
        description: Delete capability.
        optional: true
      - name: id_field
        type: string
        description: Field holding the entity id.
  - id: generic-arg-binding
    name: GenericArgBinding
    kind: value-object
    fields:
      - name: parameter_name
        type: string
        description: Must match a GenericParameter.name on the referenced entity.
      - name: bound_to
        type: type-ref-or-param
        description: A concrete TypeRef or a pass-through generic param name.
  - id: artifact-kind
    name: ArtifactKind
    kind: value-object
    fields:
      - name: value
        type: string
        description: Dll | Wasm | NativeLib | CompatTranslator | UiBundle | BlueprintBundle.
  - id: scope-match
    name: ScopeMatch
    kind: value-object
    fields:
      - name: any_of
        type: list<string>
        description: Prefix-* glob or exact patterns that admit. EMPTY admits everything in this dimension.
      - name: none_of
        type: list<string>
        description: >-
          Patterns that refuse. Evaluated BEFORE any_of and always wins, so an exclusion can never
          widen a scope.
  - id: inline-function-call
    name: InlineFunctionCall
    kind: value-object
    fields:
      - name: function_name
        type: string
        description: Registered inline-function name.
      - name: arguments
        type: map<string, input-value>
        description: Named arguments (each an InputValue).
  - id: secret-input-ref
    name: SecretInputRef
    kind: value-object
    fields:
      - name: secret_uuid
        type: string
        description: >-
          The Secret | Connection entity to resolve into this pin, as a uuid STRING (the blueprint
          body crosses a non-human-readable lane — see the wire note). Empty or the nil uuid is a
          compile-time validation failure.
      - name: delivery
        type: secret-delivery
        description: >-
          How the value is delivered (auto | pull | via_vault | none). Absent = auto (cached once
          per run).
        optional: true
  - id: closure-input-ref
    name: ClosureInputRef
    kind: value-object
    fields:
      - name: subroutine
        type: string
        description: >-
          The key of the Closure-kind subroutine this pin materializes, in this blueprint's
          subroutine map. Static by construction — a lambda is lexically fixed, so a runtime-chosen
          name is a compile error exactly as it is on the node form.
      - name: expects
        type: string
        description: >-
          Optional signature-entity uuid the subroutine's own (inputs, output) pair is checked
          against for conformance — the same machinery `function.ref` and the `function.closure`
          node's `expects` pin already use. Absent = no conformance check (the consuming parameter's
          declared type still applies wherever one exists).
        optional: true
  - id: path-segment
    name: PathSegment
    kind: value-object
    fields:
      - name: kind
        type: string
        description: '`field` (a static member/property name) | `key` (a runtime key from an input pin).'
      - name: field
        type: string
        description: >-
          kind=field ONLY: the static property/member name this step navigates or assigns. Baked at
          compile time; needs no pin and costs no operand.
        optional: true
      - name: key_pin
        type: string
        description: >-
          kind=key ONLY: the name of the input pin whose VALUE is this step's key — an array index,
          a map key, a computed property name. The pin is an ordinary node input (the compiler
          resolves it to a slot like any other), so a key segment is legal at ANY position, which is
          exactly what the old single-trailing-pin model could not express.
        optional: true
      - name: value
        type: string
        description: >-
          Field | Key. NOT a plain closed enum: `Key` carries associated data (`key_pin: String`),
          so a consumer must read the payload rather than the tag alone.
  - id: pin-value
    name: PinValue
    kind: value-object
    fields:
      - name: pin
        type: string
        description: The input pin name.
      - name: value
        type: any
        description: The evaluated value (redacted if sensitive).
  - id: permission-sensitivity-reason
    name: PermissionSensitivityReason
    kind: value-object
    fields:
      - name: cause
        type: permission-sensitivity-cause
        description: The closed cause tag — what a client filters and groups by.
      - name: rule_index
        type: float
        description: >-
          The index of the rule in the group's `rules` that produced this reason, or absent when the
          reason came from something that is not a rule (a declared fast-lane request). Rule INDEX
          is identity in this model — a boot-time narrowing addresses a rule by its position — so
          this points at exactly the rule an operator would tighten to make the reason go away.
        optional: true
      - name: detail
        type: string
        description: >-
          The rendered sentence: what this rule grants, in the operator's words. It NAMES THE CAUSE
          rather than asserting a verdict, and never claims anything the derivation did not check. A
          client may show it verbatim; it must not parse it (that is what `cause` is for).
  - id: graph-snapshot-ref
    name: GraphSnapshotRef
    kind: value-object
    fields:
      - name: blueprint_uuid
        type: string
        description: The blueprint whose graph was captured — its `.graphs` folder part holds the blob.
      - name: graph_hash
        type: string
        description: >-
          The content hash (lowercase hex SHA-256) of the serialized source graph — the blob's
          address inside `.graphs`.
  - id: graph-snapshot-failure
    name: GraphSnapshotFailure
    kind: value-object
    fields:
      - name: blueprint_uuid
        type: string
        description: The blueprint whose snapshot failed.
      - name: reason
        type: string
        description: >-
          Why it failed, in the words of the read or write that failed. A message rather than a code
          because the reader is a human looking at an unrenderable log, not a retry policy.
  - id: suggested-target
    name: SuggestedTarget
    kind: value-object
    fields:
      - name: kind
        type: string
        description: >-
          The discriminator: 'unconstrained' (the rule needs no target and is finished), 'known'
          (the target is in the `target` field and the rule is finished), or 'unknown' (the call has
          a target, it is decided at run time, and the rule is incomplete).
      - name: target
        type: string
        description: >-
          The concrete target — present ONLY on 'known'. Absent on both of the targetless states,
          which is exactly why `kind` and not this field decides whether the rule is finished.
        optional: true
      - name: value
        type: string
        description: Unconstrained | Known | Unknown.
    methods:
      - name: is_settled
        signature: is_settled() -> bool
        returns: bool
        description: >-
          Whether this target axis leaves the suggested rule FINISHED — true for 'unconstrained' and
          'known', false for 'unknown'. Exists so no caller re-derives it by matching, which is
          where the two-states-not-three mistake creeps back in.
      - name: value
        signature: value() -> Option<String>
        returns: string?
        description: >-
          The concrete target string, or none for BOTH targetless states. DELIBERATELY LOSSY, and
          only for a caller that has already consulted is_settled: it collapses exactly the
          distinction this type exists to keep. A client rendering a rule form must read `kind`.
  - id: program-ref
    name: ProgramRef
    kind: value-object
    fields:
      - name: program
        type: any
        description: >-
          The opaque loaded-program payload (instructions + trap table + node map + resolved
          primitive table), reference-counted. `Json` is the spec's shape-abstraction for a live
          in-process handle — the same convention native-handle and the callback repository's live
          submission port already use; it is never encoded as Json and never leaves the process.
  - id: context-tag
    name: ContextTag
    kind: value-object
    fields:
      - name: value
        type: string
        description: The tag label (matched by exact equality against a capability's required_tags).
  - id: pin-slot
    name: PinSlot
    kind: value-object
    fields:
      - name: pin
        type: string
        description: The input pin's name, exactly as the designer node spells it.
      - name: slot
        type: int
        description: >-
          The frame slot the pin's value is materialized into (a binding's own slot, or the scratch
          a literal/expression result lands in).
  - id: type-ref-or-param
    name: TypeRefOrParam
    kind: value-object
    fields:
      - name: concrete
        type: type-ref
        description: Set when binding to a concrete entity (boxed to break the recursive size cycle).
        optional: true
      - name: param
        type: string
        description: Set when passing through an enclosing generic parameter name.
        optional: true
  - id: permission-sensitivity-cause
    name: PermissionSensitivityCause
    kind: value-object
    fields:
      - name: value
        type: string
        description: >-
          VaultFastLane | OffBrokerFastLane | SystemControlVerb | UnconstrainedBus |
          UnconstrainedSecret | SecretUnwrap | SecretInvokeMethod | SecretMetadataRead |
          UnconstrainedFilesystem | UnconstrainedNetwork | UnconstrainedProcess.
